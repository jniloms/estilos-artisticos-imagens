 "Memphis": {"en": {"nome": "Memphis Design", "periodo": "1981 to 1988, Milan (Italy); return from the 2010s", "caracteristicas": "Playful geometric shapes, scribbled prints, loud colors, patterned laminates and anti-minimalism.", "historia": "The Memphis Group was founded in Milan, in 1980–81, by Ettore Sottsass and young designers such as Michele De Lucchi and Nathalie du Pasquier. The name came from a Bob Dylan song played during the founding meeting. They rejected modernist good taste and presented furniture, vases and fabrics in eye-catching shapes, such as Sottsass's Carlton bookcase (1981). Dissolved in 1988, the group influenced the aesthetics of the 80s, of music videos, MTV and clothing, and returned to inspire graphic design and fashion from the 2010s.", "tecnica": "The repertoire includes basic geometric shapes (triangles, circles, zigzags), wavy lines, dots, squiggles and patterns inspired by plastic laminates. Colors are vibrant and unexpected: pink, turquoise, yellow, black and white with thick outlines. Objects are combined asymmetrically, in compositions that look chaotic and fun. Cheap industrial materials, such as laminate and plastic, were used with humor. The look is playful and unconventional."}, "pt": {"g": "Composição divertida em estilo Memphis sobre fundo branco, linhas pretas rabiscadas, triângulos, zigue-zagues, pontos e padrões de granilite em rosa-choque, turquesa, amarelo-limão e preto, blocos abstratos coloridos e assimétricos semelhantes a móveis, energia pós-moderna dos anos 1980", "m": "Retrato elegante de uma jovem latina de cabelos escuros e cacheados segurando um vaso com flores lilás, vermelhas e amarelas, estilo Memphis Design dos anos 1980, mulher e vaso mostrados com formas geométricas ousadas, rabiscos, zigue-zagues e pontos em rosa-choque, turquesa e amarelo, fundo com padrão de granilite, assimetria divertida"}},
 "Op Art": {"en": {"nome": "Op Art", "periodo": "1950s and 1960s, Europe and United States", "caracteristicas": "Optical illusions of movement and vibration, black-and-white patterns, repeated lines and circles and distortion of perception.", "historia": "The term 'Op Art' was published in Time magazine in 1964, and the movement was consecrated in the MoMA exhibition 'The Responsive Eye' (1965). Victor Vasarely, considered its father, had been exploring illusions since the 1930s, with works such as 'Zebras'. Bridget Riley created black-and-white works that seem to ripple or pulse; Soto and Agam added movement and color to space. The style was quickly assimilated by 1960s fashion and advertising, and is a reference for graphic design and psychedelic patterns.", "tecnica": "It uses precise geometric patterns, with parallel lines, distorted grids, concentric circles and waves, in high contrast (black and white) or vibrant complementary colors. Small variations in spacing or inclination provoke a sensation of movement, depth or shimmer, as in moiré and afterimage effects. The finish is clean and flat, with acrylic paint and masking tape, and the image has no human figure or narrative, the visual stimulus being the subject."}, "pt": {"g": "Composição op art pura em preto e branco de círculos concêntricos deformados e linhas paralelas ondulantes criando a ilusão de uma esfera tridimensional pulsante, bordas afiadíssimas, alto contraste, vibração de moiré, ilusão de ótica hipnótica, acabamento acrílico chapado", "m": "Retrato elegante de uma jovem do Oriente Médio de cabelos escuros segurando um vaso com flores lilás, vermelhas e amarelas, estilo op art, retrato distorcido por linhas paralelas ondulantes em preto e branco e círculos concêntricos, ilusão de ótica de movimento, bordas afiadíssimas, alto contraste, flores feitas de anéis de moiré"}},
 "Cartaz Vintage": {"en": {"nome": "Vintage / Propaganda Poster", "periodo": "c. 1890 to 1960, Europe, United States and Soviet Union", "caracteristicas": "Flat colors, large typography, heroic figure from a low angle, direct message and lithographic printing.", "historia": "Color lithography made the large urban posters possible from the 1890s; Jules Chéret is called the 'father of the modern poster'. In the First World War, Alfred Leete's poster 'Lord Kitchener Wants You' (1914) and James Montgomery Flagg's 'I Want YOU' (1917) mobilized volunteers. In post-revolutionary Russia, El Lissitzky and Gustav Klutsis used Constructivism, and J. Howard Miller's poster 'We Can Do It!' (1943) became a female icon. States and companies used the medium to persuade; the style is today reproduced in art and design in a critical or ironic way.", "tecnica": "The composition is direct: a central theme on a large scale, often seen from below to give monumentality, and large, short, bold text. A few flat colors (red, black, cream, blue) and sharp outlines simplify the figure. Soviet Constructivism uses strong diagonals, photomontage and geometric shapes. Lithographic or silkscreen printing leaves slight imperfections, misplaced registration and aged paper. Text and image reinforce each other for an immediate effect."}, "pt": {"g": "Cartaz de propaganda litográfico vintage, um trabalhador heroico apontando para um sol nascente visto de um ângulo baixo, composição diagonal ousada, paleta chapada e limitada de vermelho, preto e creme, enorme slogan condensado sem serifa, tinta levemente desalinhada e dobras de papel envelhecido", "m": "Retrato elegante de uma jovem morena de cabelos escuros e trançados segurando um vaso com flores lilás, vermelhas e amarelas, estilo de cartaz de propaganda vintage, pose heroica em ângulo baixo erguendo o vaso de flores, paleta chapada e ousada de vermelho, preto e creme, texto de slogan grande e condensado, impressão litográfica granulada, papel envelhecido"}},
 "Fotografia Cinematográfica": {"en": {"nome": "Cinematic Photography", "periodo": "Aesthetic derived from the language of cinema, consolidated throughout the 20th century and intensified in the digital era (2000s onward)", "mestres": ["Roger Deakins (b. 1949)", "Emmanuel Lubezki (b. 1964)", "Vittorio Storaro (b. 1940)", "Gregg Toland (1904–1948)", "Wong Kar-wai, director (b. 1958)", "Christopher Doyle, cinematographer (b. 1952)"], "caracteristicas": "Film-frame look (wide aspect ratio), dramatic lighting and film grain.", "historia": "It arises from still photography's appropriation of cinema's narrative resources — framing, dramatic lighting and color palette. The aesthetic consolidated with Hollywood's visual language throughout the 20th century and gained a technical vocabulary of its own in the era of digital color grading. The most influential example is the complementary 'teal and orange' contrast, popularized by the colorist Stefan Sonnenfeld in 'Bad Boys II' (2003) and then taken to the extreme by Michael Bay's Transformers franchise, becoming the aesthetic standard of contemporary blockbusters. Today cinematic photography is used both in still photography and in AI image generation to evoke the feeling of a film still.", "tecnica": "It uses a widescreen ratio (letterbox/anamorphic), directional and dramatic lighting that models the face and separates the subject from the background, and complementary-contrast color grading between cool shadows (blue-green) and warm skin tones (orange). It adds subtle film grain, light vignetting and shallow depth of field to guide the eye, plus a composition conceived as an isolated frame from a larger narrative, with negative space and dramatic tension."}, "pt": {"g": "Um detetive solitário sob um poste de luz de sódio piscando em densa neblina noturna, quadro anamórfico 2,39:1, profundidade de campo rasa com bokeh oval, correção de cor teal-laranja, grão de 35mm, compressão de lente longa, quietude tensa", "m": "Fotograma cinematográfico elegante em filme 35mm de uma jovem loira segurando um pote de cerâmica cheio de flores vibrantes lilás, vermelhas e amarelas, profundidade de campo rasa, flare natural de lente anamórfica, correção de cor sombria"}},
 "Fotografia Macro": {"en": {"nome": "Macro Photography", "periodo": "Technique developed since the early 20th century, consolidated with the arrival of dedicated macro lenses from the 1950s–60s", "mestres": ["Thomas Shahan", "Levon Biss (b. 1975)", "Ernst Haeckel, precursor (1834–1919)", "Robert Mapplethorpe, flowers (1946–1989)", "Karl Blossfeldt (1865–1932)"], "caracteristicas": "Extreme close-up focused on tiny details, with an extremely blurred background (bokeh).", "historia": "The first records at close magnification date from the early 20th century, when the naturalist filmmaker F. Percy Smith photographed insects using bellows and extension tubes to move the lens away from the film and increase magnification, with the scientific purpose of documenting details invisible to the naked eye. The arrival of SLR cameras in the 1950s made the technique more accessible to amateurs, and in 1975 Canon released one of the first dedicated macro lenses with 1:1 reproduction magnification, consolidating the genre as a photographic specialty of its own, today popular in both scientific and artistic photography.", "tecnica": "It is characterized by extreme magnification of small subjects (insects, drops, textures, flowers), revealing patterns and structures normally imperceptible. The depth of field is extremely shallow, producing a soft blurred background (bokeh) and surgical focus on a millimeter-thin slice of the scene. It requires controlled, diffuse lighting to avoid harsh shadows so close to the subject, and the composition tends to isolate textures, symmetries and repeating patterns that normally go unnoticed."}, "pt": {"g": "Uma única gota de orvalho na nervura de uma folha com ampliação de 5:1, plano de foco finíssimo, bokeh cremoso dissolvendo o fundo, um minúsculo mundo refratado dentro da gota, contraluz suave da manhã, quietude íntima", "m": "Fotografia macro elegante em close focando as mãos de uma jovem loira segurando um pote, detalhe extremamente nítido nas pétalas de flores lilás, vermelhas e amarelas, fundo com bokeh suave e deslumbrante"}},
 "Double Exposure": {"en": {"nome": "Double Exposure", "periodo": "Analog photographic technique of the 19th century, rediscovered as a deliberate artistic device from the 2010s", "mestres": ["Dan Mountford", "Brandon Kidwell", "Robert Doisneau, precursor (1912–1994)", "Man Ray (1890–1976)", "Alexey Kondakov (b. 1984)"], "caracteristicas": "Artistic fusion of two overlaid images in a single composition (e.g. face + forest).", "historia": "It emerged as an accidental effect in analog cameras of the mid-19th century, when the same plate or film was exposed twice. The photographer William H. Mumler involuntarily popularized the technique in the 1860s when he mistakenly created an overlay that seemed to show a 'spirit' beside the sitter — giving rise to the fashion for 'spirit photography', which commercially exploited the Victorian fascination with the supernatural, until Mumler was prosecuted for fraud in 1869. Decades later, the effect was rescued by creative analog photography and, more recently, by digital editing, as a deliberate aesthetic device to fuse visual narratives.", "tecnica": "It consists of the semi-transparent overlay of two distinct images — typically a portrait and a landscape, texture or silhouette — blending the light and dark tones of each layer so that one 'reveals' the other. The high-contrast areas of one image act as a natural mask for the second exposure, creating compositions in which settings, textures or symbolic elements seem to sprout from inside the silhouette of the main subject."}, "pt": {"g": "A silhueta de perfil de um homem preenchida por uma floresta de pinheiros enevoada e um céu estrelado, duas imagens mescladas por altas luzes transparentes, fundo branco limpo, bordas em degradê suave, introspecção e melancolia", "m": "Retrato elegante em dupla exposição da silhueta de uma jovem loira segurando um pote, perfeitamente sobreposta a um jardim exuberante em flor de flores lilás, vermelhas e amarelas, fusão artística"}},
 "Lomografia": {"en": {"nome": "Lomography", "periodo": "Lomo LC-A camera launched in 1984 in the USSR; photographic movement founded in Vienna, Austria, in 1992", "mestres": ["Wolfgang Stranzinger", "Michael Wesely (b. 1963)", "Nan Goldin (b. 1953)", "Ryan McGinley (b. 1977)", "William Eggleston (b. 1939)"], "caracteristicas": "Retro analog camera effect with oversaturated colors, dark vignettes and light leaks.", "historia": "The Soviet Lomo LC-A camera began mass production in 1984 at the LOMO factory in Leningrad. In 1991, the Austrian students Matthias Fiegl and Wolfgang Stranzinger found a used unit in a Prague shop and were fascinated by the saturated colors and unexpected vignettes of its photos. Back in Vienna, they began reselling the model and, in 1992, founded the Lomographic Society International, turning the experimentalism around the camera into a global artistic movement with the motto 'don't think, just shoot' — today associated with the unpolished, imperfect aesthetic of analog.", "tecnica": "It is characterized by strong vignetting at the edges of the frame, highly saturated and sometimes color-shifted colors, slight blur and optical distortion typical of simple, cheap lenses, plus the visible grain of analog film. Light leaks, accidental multiple exposures and spontaneous, intuitive framing reinforce the unpredictable, raw character of the technique."}, "pt": {"g": "Amigos rindo em volta de uma fogueira na praia ao entardecer, vinheta forte, verdes e magentas supersaturados com cross-processing, faixa laranja de vazamento de luz atravessando o quadro, leve desfoque e enquadramento imperfeito, alegria nostálgica e espontânea", "m": "Fotografia espontânea lomográfica elegante de uma jovem loira segurando um pote com flores lilás, vermelhas e amarelas, vazamentos de luz retrô, cores de alta saturação com cross-processing, vinheta suave"}},
 "Vintage": {"en": {"nome": "Vintage / Sepia", "periodo": "Chemical process popularized between 1860 and 1930, today reused as an aesthetic filter", "mestres": ["Julia Margaret Cameron (1815–1879)", "Mathew Brady (1822–1896)", "Eugène Atget (1857–1927)", "Edward S. Curtis (1868–1952)", "Nadar (1820–1910)"], "caracteristicas": "Aged look that emulates 19th-century photographs, with brown tones, dust and scratches.", "historia": "Sepia toning was born of a technical need: albumen prints — the most common photographic process of the second half of the 19th century, made with egg white and silver salts on paper — deteriorated quickly. Treating negatives and prints with a sulfur-based toner (sodium sulfide or thiourea) converted metallic silver into silver sulfide, a far more stable compound resistant to light and moisture, which prolonged the life of the image and, as a side effect, tinted it a characteristic yellowish brown. The process dominated studio photography and portraits until it was supplanted by modern black-and-white film and then by color, remaining today as a visual synonym of memory and nostalgia.", "tecnica": "It presents monochrome in yellowish-brown tones replacing neutral black and white, soft contrast and compressed midtones, as was typical of old printing processes. Worn edges, stains, scratches and yellowed corners simulate the physical wear of photographic paper over decades, together with coarse, irregular grain recalling the low sensitivity of the films and papers of the time."}, "pt": {"g": "Uma plataforma ferroviária lotada em uma fotografia de longa exposição dos anos 1890, tons sépia, desfoque fantasmagórico de passageiros em movimento, arranhões, grãos de poeira e bordas desbotadas, foco suave, figuras rígidas posadas, a passagem silenciosa do tempo", "m": "Fotografia vintage elegante do século XIX de uma jovem loira segurando um pote rústico com flores lilás, vermelhas e amarelas coloridas à mão, tom sépia, foco suave, poeira sutil e arranhões finos"}},
 "Cyber-Noir": {"en": {"nome": "Cyber-Noir", "periodo": "Aesthetic fusion of classic film noir (Hollywood, 1940s–50s) and cyberpunk (literature and cinema from 1980)", "mestres": ["Ridley Scott, director of Blade Runner (b. 1937)", "Frank Miller, author of Sin City (b. 1957)", "Jordan Cronenweth (1935–1996)", "Syd Mead (1933–2019)", "Katsuhiro Otomo (b. 1954)"], "caracteristicas": "Mix of classic crime film and science fiction; long shadows and a single neon source.", "historia": "The term 'film noir' was coined in 1946 by the French critic Nino Frank to describe a group of dark American crime dramas — such as 'The Maltese Falcon' and 'Laura' — marked by ambiguous morality and a look inherited from German Expressionism. Decades later, works such as 'Blade Runner' (1982) fused this aesthetic of light and shadow, cynical detectives and rain-soaked cities with cyberpunk settings of technological megacities and all-powerful corporations, creating the so-called 'tech-noir' or cyber-noir — a visual subgenre that became a mandatory reference in games, animation and production design for urban science fiction.", "tecnica": "It uses extremely high-contrast lighting with hard, cut-out shadows (chiaroscuro inherited from Expressionism), venetian blinds and silhouettes cut out against pinpoint lights. Colored neon signs are reflected in puddles, glass and wet metal under constant rain, while fog and smoke soften beams of volumetric light. The composition favors diagonal framing, low angles and vertical, labyrinthine urban spaces that recall both crime suspense and the oppression of futuristic megacities."}, "pt": {"g": "Um detetive de sobretudo junto a uma janela com persianas, listras de neon rosa entrecortadas atravessando a fumaça de cigarro, chuva no vidro, pretos profundos e esmagados, uma única fonte de luz colorida, solidão cansada do mundo", "m": "Retrato cyber-noir elegante de uma jovem loira segurando um pote de vidro com flores lilás, vermelhas e amarelas, iluminada por um único letreiro de neon através das persianas, longas sombras cinematográficas de alto contraste"}},
 "Tilt-Shift": {"en": {"nome": "Tilt-Shift", "periodo": "Optical shift lenses since the mid-20th century; miniature effect popularized digitally from 2000", "mestres": ["Olivo Barbieri (b. 1954)", "Keith Loutit", "Sam O'Hare", "Satoshi Tomiyama"], "caracteristicas": "Photographic technique that makes real-world scenes look like scale models or miniatures.", "historia": "Tilt and shift movements have existed since the earliest days of large-format photography, when photographers manipulated the camera bellows to correct perspective distortion in architecture or to extend depth of field in landscapes. With the popularization of 35mm cameras, manufacturers such as Nikon released, in the mid-1960s, dedicated lenses that replicated these movements without the need for bellows cameras. Only decades later did photographers discover that tilting the focal plane in the opposite direction — instead of correcting it — produced the opposite and unexpected effect of turning real scenes into apparent miniatures; the trick, nicknamed 'miniature faking', exploded in popularity in the late 2000s through Flickr and mobile apps that simulated the effect digitally.", "tecnica": "It produces progressive selective blur at the top and bottom edges of the frame, leaving only a narrow horizontal band in the center sharp — simulating the extremely shallow depth of field typical of macro photography of models. It is reinforced by increased saturation and contrast, and works best in scenes seen from above, with people, cars or buildings small enough to reinforce the illusion of toy scale."}, "pt": {"g": "Um cruzamento movimentado da cidade fotografado de um ângulo alto, faixa extremamente estreita de foco nítido com forte desfoque no topo e na base, saturação aumentada, carros e pessoas que parecem de brinquedo, clima divertido de miniatura", "m": "Fotografia em miniatura tilt-shift elegante de uma jovem loira em pé num pequeno jardim, segurando um pequeno pote de flores lilás, vermelhas e amarelas, desfoque estreito e seletivo, efeito de escala de brinquedo"}},
 "Glitch Art": {"en": {"nome": "Glitch Art", "periodo": "First experiments in the late 1960s–70s; consolidated as a digital movement between 1990 and 2010", "mestres": ["Rosa Menkman (b. 1983)", "Nam June Paik (1932–2006)", "Takeshi Murata (b. 1974)", "Ant Scott", "Phillip Stearns (b. 1982)"], "caracteristicas": "Aesthetic based on digital system errors, static, corrupted colors and old TV lines.", "historia": "The roots of glitch art go back to the late 1960s, when artists such as Nam June Paik and Steina Vasulka began to deliberately manipulate and distort analog video signals. With the popularization of personal computers in the 1990s and 2000s, a new generation of artists began to intentionally corrupt digital files — a technique nicknamed 'databending', which consists of opening an image file in an incompatible text or audio editor, altering its code and saving it back in the original format to generate unpredictable visual distortions. The Dutch artist and theorist Rosa Menkman helped consolidate the movement in the late 2000s, describing the glitch as a 'wonderful interruption' that displaces the image from its original form and meaning.", "tecnica": "It is characterized by pixel distortions, shifting and bleeding between color channels (RGB), exaggerated and visible JPEG compression blocks, and bands of digital noise that fragment the image into blocks or stripes. Elements of the image may appear displaced, repeated or 'melted' horizontally, as if the file were being read incorrectly — an effect that directly recalls real digital data corruption."}, "pt": {"g": "Um rosto se dissolvendo em separações de canais RGB e fatias horizontais de databending, rastros de pixel sorting, rasgos de scanline, blocos corrompidos de cor saturada, ruído de tracking de VHS, decadência digital ansiosa", "m": "Retrato glitch art elegante de uma jovem loira segurando um pote de flores lilás, vermelhas e amarelas, linhas artísticas de deslocamento digital, estética de dados corrompidos, sofisticada separação de canais de cor"}},
 "Fotorrealismo": {"en": {"nome": "Photorealism / Hyperrealism", "periodo": "Photorealism: late 1960s to the present. Hyperrealism: 2000s onward", "caracteristicas": "Extreme detail, skin texture and pores, exact reflections, sharp focus and the look of an enlarged photograph.", "historia": "Photorealism emerged in the United States in the late 1960s, when painters such as Chuck Close, Richard Estes and Audrey Flack began copying photographs with precision, in reaction to Abstract Expressionism and abstraction. The gallery owner Louis K. Meisel, who helped name the movement, defined criteria for the genre. Hyperrealism, from the 2000s, extends this limit, with works that look even more real than the photo, and the sculptures of Ron Mueck and Duane Hanson reproduce bodies in detail. Today, it is one of the most common searches in AI prompts.", "tecnica": "The artist works from photographs, projected or divided into grids, and reproduces every detail with a fine brush or airbrush, applying layers and glazes. The painting reproduces camera characteristics, such as depth of field, blur, reflections in glass and chrome and grain. In portraits, pores, eyelashes, strands of hair and veins appear at large scale. The result is a smooth surface with no visible brushstrokes. In prompts, terms such as '85mm, macro, skin pores, 8k' induce this finish."}, "pt": {"g": "Retrato hiper-realista em close de um velho pescador de pele castigada, cada poro, ruga e cílio renderizado em detalhe microscópico, reflexos úmidos e vítreos nos olhos, foco afiadíssimo com fundo suavemente desfocado, luz natural de janela, indistinguível de uma fotografia, 8k", "m": "Retrato elegante de uma jovem negra segurando um vaso com flores lilás, vermelhas e amarelas, retrato fotorrealista e hiper-realista, poros da pele e pelos finos visíveis, reflexos úmidos e brilhantes no vaso de vidro, lente de 85mm, foco afiadíssimo, luz natural de janela, detalhe em 8k"}},
 "Retrato de Estudio": {"en": {"nome": "Studio Portrait", "periodo": "Late 19th century to the present", "mestres": ["Richard Avedon (1923–2004)", "Irving Penn (1917–2009)", "Annie Leibovitz (b. 1949)", "Yousuf Karsh (1908–2002)", "George Hurrell (1904–1992)"], "caracteristicas": "Plain background, controlled lighting, sculpted shadows, direct gaze, refined retouching and focus on the face.", "historia": "The studio portrait was born with the daguerreotype, but was consecrated as art in the 20th century. George Hurrell defined Hollywood glamour in the 1930s, with dramatic light on movie stars. Yousuf Karsh portrayed world leaders, such as Winston Churchill (1941). Irving Penn and Richard Avedon revolutionized the genre with neutral backgrounds and close-up faces, and Annie Leibovitz created conceptual portraits for Rolling Stone and Vanity Fair. The absence of context directs the viewer's gaze to the personality of the sitter.", "tecnica": "Paper or plain wall background (white, gray or black), with lighting from softboxes, beauty dishes and reflectors. Classic schemes include Rembrandt lighting (triangle of light on the cheek), butterfly lighting and side lighting. 85–135 mm lenses give pleasing compression and a wide aperture blurs the background. Portraitists direct the pose and gaze, and editing adjusts skin, contrast and color. The result conveys character, control and elegance."}, "pt": {"g": "Retrato clássico de estúdio em preto e branco de um músico de jazz castigado pelo tempo diante de um fundo cinza infinito, iluminação Rembrandt com um triângulo de luz na bochecha, sombras profundas e esculpidas, olhar direto e intenso, lente de 85mm, grão fino de filme, atemporal e digno", "m": "Retrato elegante de uma jovem sul-asiática de cabelos escuros segurando um vaso com flores lilás, vermelhas e amarelas, fotografia clássica de retrato de estúdio, iluminação Rembrandt com triângulo de luz na bochecha, fundo cinza infinito, beauty dish suave, lente de 85mm, olhar direto, retoque refinado"}},
 "Fotografia de Produto": {"en": {"nome": "Product Photography", "periodo": "1850s to the present; modern advertising since the 1920s", "mestres": ["Paul Outerbridge (1896–1958)", "Irving Penn (1917–2009)", "Edward Steichen (1879–1973)", "Edward Weston (1886–1958)", "Albert Renger-Patzsch (1897–1966)"], "caracteristicas": "Clean background, soft and precise lighting, controlled reflections, full sharpness and focus on the object.", "historia": "Product photography emerged alongside illustrated advertising and became professional in the 1920s, when German New Objectivity and photographers such as Albert Renger-Patzsch showed objects with clarity and rigor. Paul Outerbridge elevated the advertisement to art with geometric compositions and intense colors, and Edward Steichen worked for brands such as Jergens. Irving Penn, in his still lifes, treated cigarettes and glass as sculptures. With e-commerce, the genre gained scale and defines the look of online stores, ads and catalogs.", "tecnica": "The object is photographed on a studio table with a seamless background (white, gray or colored), with softboxes, diffusers and reflectors that control highlights and shadows. For glass, backlighting and edge lighting are used; for metal, large diffuse sources. Macro lenses and focus stacking ensure sharpness from end to end. Post-production removes dust and adjusts colors. Props and composition tell a lifestyle narrative around the brand."}, "pt": {"g": "Fotografia comercial de produto de alto padrão de um frasco de perfume de cristal sobre uma superfície de acrílico espelhado, iluminação suave de grande softbox com realces de contorno nítidos, fundo infinito pastel limpo, reflexos perfeitos, nitidez macro de ponta a ponta, adereços florais sutis, visual de publicidade de luxo", "m": "Retrato elegante de uma jovem de pele morena segurando um vaso com flores lilás, vermelhas e amarelas, fotografia em estilo de produto comercial, mãos elegantes de uma jovem de pele morena apresentando um vaso de vidro com flores lilás, vermelhas e amarelas, fundo infinito pastel, iluminação suave de softbox, reflexos nítidos, nitidez macro"}},
 "Golden Hour": {"en": {"nome": "Golden Hour", "periodo": "Photography and film device since the 1900s", "mestres": ["Néstor Almendros (1930–1992)", "Terrence Malick (b. 1943)", "Ansel Adams (1902–1984)", "Galen Rowell (1940–2002)", "Emmanuel Lubezki (b. 1964)"], "caracteristicas": "Low golden light, long soft shadows, backlight with glowing hair and warm orange and honey tones.", "historia": "The 'golden hour' is the first or last hour of the day, when the sun is low and the light is soft and warm. Cinema calls the short period after sunset the 'magic hour'. Néstor Almendros, in Terrence Malick's 'Days of Heaven' (1978), shot almost every scene in this interval, and won the Oscar for cinematography. Galen Rowell and Ansel Adams sought the exact moment in landscapes, and Emmanuel Lubezki took the technique to 'The Tree of Life' (2011). Today the golden hour is one of the most popular searches in portraits and travel.", "tecnica": "The photographer positions the low sun behind or beside the subject to generate backlight, glowing hair (rim light) and long shadows. Light of 3000–4000 K tints the image gold and honey, and the color temperature can be reinforced with a white balance adjustment. Wide-aperture lenses create creamy blur (bokeh) with circles of light, and light flares add atmosphere. The useful window is short, so the location is planned in advance."}, "pt": {"g": "Campo de trigo na hora dourada, sol baixo em flare através das sementes de capim em contraluz, sombras longas e suaves, tons quentes de âmbar e mel, luz de contorno brilhante em cada haste, círculos cremosos de bokeh, uma figura solitária em silhueta, nostalgia cinematográfica e onírica", "m": "Retrato elegante de uma jovem latina de cabelos escuros e cacheados segurando um vaso com flores lilás, vermelhas e amarelas, fotografia de retrato na hora dourada, sol baixo e quente atrás dela, luz de contorno brilhante nos cabelos, flare suave de lente, bokeh cremoso, tons de mel e âmbar, fotografado a f/1.8"}},
 "Fotografia de Rua": {"en": {"nome": "B&W Street Photography", "periodo": "1930s to the present, worldwide", "mestres": ["Henri Cartier-Bresson (1908–2004)", "Robert Frank (1924–2019)", "Vivian Maier (1926–2009)", "Garry Winogrand (1928–1984)", "Daido Moriyama (b. 1938)"], "caracteristicas": "High-contrast black and white, spontaneous moments, geometric composition, grain and deep shadows.", "historia": "Street photography was born from the portable Leica cameras of the 1930s, which made it possible to record public life without apparatus. Henri Cartier-Bresson formulated the 'decisive moment' in his 1952 book, the instant when form and event coincide. Robert Frank, with 'The Americans' (1958), presented a raw, personal vision of the United States. Vivian Maier, a nanny in Chicago, produced thousands of photos that were only discovered after 2007. Daido Moriyama, in Tokyo, took the genre to rupture with grainy, blurred and contrasty images.", "tecnica": "The photographer walks the city with a compact camera and a 28 to 50 mm lens, alert to gestures, light and backgrounds. They prefer to shoot in black and white, with high contrast, high-sensitivity film (Tri-X) and pronounced grain. The composition uses geometry, layered framing, hard shadows and silhouettes. The key is anticipation: waiting for a character to enter a frame or a ray of light. The result conveys spontaneity and truth."}, "pt": {"g": "Fotografia de rua em preto e branco crua de um cruzamento chuvoso numa cidade lotada, um homem saltando sobre uma poça em pleno ar, alto contraste com sombras profundas, grão pesado de filme Tri-X, camadas geométricas de guarda-chuvas e reflexos, momento decisivo com Leica 35mm", "m": "Retrato elegante de uma jovem negra de cabelos curtos segurando um vaso com flores lilás, vermelhas e amarelas, fotografia de rua espontânea em preto e branco, mulher com o vaso de flores caminhando numa calçada movimentada, sol forte e sombras profundas, grão pesado de filme, Leica 35mm, momento decisivo, alto contraste"}},
 "Polaroid": {"en": {"nome": "Polaroid / Instax", "periodo": "1948 to the present, United States and Japan", "mestres": ["Edwin Land (1909–1991), inventor", "Andy Warhol (1928–1987)", "Walker Evans (1903–1975)", "Maurizio Galimberti (b. 1956)", "Fujifilm (Instax, 1998)"], "caracteristicas": "White frame, faded and warm colors, vignette, soft focus and an intimate, memory-like look.", "historia": "Edwin Land demonstrated instant photography in 1947 and launched the first Polaroid camera in 1948. The SX-70 model (1972) allowed photos that developed by themselves before the eyes. Artists such as Andy Warhol and Walker Evans used the Polaroid in intimate records and portraits. When Polaroid abandoned its films in 2008, the group 'The Impossible Project' resumed production. Fujifilm launched the Instax line in 1998, which popularized the format among young people. The aesthetic of the instant photo became a synonym for nostalgia.", "tecnica": "Instant film contains all the developing chemicals in a pod that spreads as it leaves the camera. The image is square, with a wide white frame at the bottom for handwritten notes. The result has slightly washed-out colors, blues or greens in the shadows, low contrast, vignette and soft focus, as well as small imperfections, such as stains and uneven edges. Direct flash produces hard light and shadows on the background. There is no second chance, which values spontaneity."}, "pt": {"g": "Foto instantânea Polaroid de amigos rindo em um calçadão de praia ensolarado, borda branca larga com legenda escrita à mão, cores quentes desbotadas com tom azul-petróleo nas sombras, foco suave, leve vinheta, reflexo direto de flash, vazamento de luz, memória nostálgica de verão", "m": "Retrato elegante de uma jovem miscigenada de cabelos cacheados segurando um vaso com flores lilás, vermelhas e amarelas, foto instantânea Polaroid vintage, moldura branca grossa com legenda escrita à mão, cores quentes desbotadas, foco suave e vinheta, reflexo direto de flash, vazamento de luz, registro nostálgico"}},
 "Fotografia Aerea": {"en": {"nome": "Aerial Photography (Drone)", "periodo": "19th century (balloon) to the present (drones since 2013)", "mestres": ["Nadar (1820–1910)", "Yann Arthus-Bertrand (b. 1946)", "Gerco de Ruijter (b. 1971)", "Tom Hegen", "Kacper Kowalski (b. 1977)"], "caracteristicas": "Top-down view, geometric patterns in the landscape, grand scale and contrasting colors.", "historia": "The first aerial photograph was taken by Nadar in 1858, from a balloon over Paris. In the 20th century, aviation and satellites broadened the view. Yann Arthus-Bertrand launched 'The Earth from Above' (1994), with helicopter images that traveled the world. From 2013, affordable drones, such as the DJI Phantom, democratized the perspective. Artists such as Gerco de Ruijter, Tom Hegen and Kacper Kowalski use the view from above to reveal patterns created by nature and by humans, from plantations and salt pans to cities and environmental crises.", "tecnica": "The drone climbs to altitudes of 50–120 m with a gimbal-stabilized camera and a wide-angle lens. The composition is graphic: a 90° (top-down) view turns landscapes into patterns, lines and abstract shapes, with tiny figures for scale. The ideal time is low light to give relief and rich colors. Editing accentuates contrast and saturation, and symmetry and repetition are valued. The result often suggests abstract paintings or maps."}, "pt": {"g": "Fotografia aérea de drone vista de cima de canais de maré turquesa se ramificando como veias por salinas douradas, pessoas minúsculas para dar escala, padrões geométricos abstratos, sombras longas e suaves ao nascer do sol, cores saturadas de alto contraste, visão nadir de 90 graus, nitidez de gimbal grande-angular", "m": "Retrato elegante de uma jovem de cabelos escuros segurando um vaso com flores lilás, vermelhas e amarelas, tomada aérea de drone vista de cima de uma minúscula jovem de cabelos escuros em pé num prado verde segurando um vaso de flores lilás, vermelhas e amarelas, sombra longa e suave, padrões geométricos de campo, nitidez de gimbal grande-angular"}},
 "Aquarela": {"en": {"nome": "Watercolor", "periodo": "Consolidated as an independent technique from the late 17th century, with a Golden Age in the mid-18th century in Great Britain", "mestres": ["J. M. W. Turner (1775–1851)", "Winslow Homer (1836–1910)", "John Singer Sargent (1856–1925)", "Paul Cézanne, for his watercolors (1839–1906)", "Joseph Zbukvic (b. 1952)"], "caracteristicas": "Fluid, translucent effects of diluted paint, with organic blotches and soft edges.", "historia": "Painting with pigment diluted in water goes back tens of thousands of years, but watercolor as an artistic medium of its own only consolidated after paper and soft brushes arrived in Europe from China. The German painter Albrecht Dürer (1471-1528) produced some of the first refined examples, in botanical studies and landscapes. The technique only became truly independent of oil painting in the late 17th century, and lived its 'Golden Age' in the mid-18th century in Great Britain, where it became the favorite medium for travel records and naturalist studies. In 1780, the Englishman William Reeves invented the first dry watercolor cakes, making the technique portable and popularizing its use outside the studio.", "tecnica": "Pigments are diluted in water and bound by gum arabic, applied in transparent layers on absorbent paper — which is why the white of the paper, not white paint, works as the lightest color of the painting. The result depends on water control: strokes on still-damp paper create soft edges and blotches that spread on their own, while applications on dry paper preserve sharp edges. Translucent layers overlap ('glazing') to build color depth without losing luminosity. The grainy texture of the paper remains visible through the paint, and mistakes are hard to correct, which gives the style its characteristic spontaneity."}, "pt": {"g": "Um buquê de papoulas silvestres e centáureas em aguadas úmido sobre úmido, pigmentos florescendo e escorrendo uns nos outros, backruns em forma de couve-flor, papel branco intocado como luzes, pigmento granulado, fragilidade suave e terna", "m": "Retrato elegante em aquarela de uma jovem loira segurando um pote translúcido, bela difusão suave de flores lilás, vermelhas e amarelas, textura fina de papel, efeitos de respingos"}},
 "Desenho a Carvão": {"en": {"nome": "Charcoal Drawing", "periodo": "Practiced since prehistory (about 30,000 BCE), consolidated as a study medium in the Renaissance and expanded as an independent technique in 19th-century France", "mestres": ["Käthe Kollwitz (1867–1945)", "Georges Seurat, for his drawings (1859–1891)", "Odilon Redon (1840–1916)", "Kara Walker (b. 1969)", "William Kentridge (b. 1955)"], "caracteristicas": "Rough, smudged paper texture, deep black tones and high manual contrast.", "historia": "Charcoal is among humanity's oldest drawing media, used in cave paintings with charred sticks. In Ancient Greece and, later, in the Renaissance, masters such as Leonardo da Vinci and Michelangelo adopted it for preparatory studies, since it was cheap and easy to correct — only in the late 15th century did fixing methods appear that made it possible to preserve the drawings. In the 18th century, the introduction of manufactured charcoal (compressed pigment in different hardnesses) widened the range of available tones. In the 19th century, French artists such as Georges Seurat and Odilon Redon raised charcoal to the category of independent expressive technique, exploring its tonal potential in finished works, not only in sketches.", "tecnica": "Charcoal produces a rich tonal scale, from deep black to the lightest gray, with great ease of smudging and blending the pigment with fingers or a blending stump to create soft gradations. The tip can be sharpened for precise lines or used on its side to cover broad areas quickly. Subtraction techniques — erasing or 'drawing with the eraser' — make it possible to recover lights directly from the dark ground. The grainy texture of the paper and the gestural traces of the hand's movement remain visible in the final work, and a layer of fixative is needed to keep the pigment from coming loose."}, "pt": {"g": "O rosto castigado de um velho marinheiro emergindo de uma sombra esfumada, pretos profundos e aveludados, meios-tons esfumados com os dedos, luzes tiradas com a borracha, textura do papel visível, emoção intensa e anos de vida dura", "m": "Esboço elegante a carvão de uma jovem loira segurando um pote, flores destacadas com sutis toques seletivos de cor em pastel lilás, vermelho e amarelo, papel texturizado, técnicas de arte esfumada"}},
 "Xilogravura": {"en": {"nome": "Woodcut / Linocut", "periodo": "Woodcut since the Chinese Han dynasty (before 220 CE), spread in Europe from the 13th century; linocut created in the late 19th century and popularized in the early 20th", "mestres": ["Albrecht Dürer (1471–1528)", "Gustave Doré (1832–1883)", "J. Borges, for the cordel (1935–2024)", "Oswaldo Goeldi (1895–1961)", "Lasar Segall (1891–1957)"], "caracteristicas": "Hand printing with rough gouge grooves in wood or linoleum, high contrast.", "historia": "The oldest known fragments of woodblock printing come from Han-dynasty China, used to stamp silk with flowers; the technique began to use paper from the 7th century and became the first technology for mass reproduction of images and text, since a single carved block could generate thousands of identical impressions. Woodcut reached Europe around the 13th century, later evolving into the art of engraving, and in Japan it gave rise to the ukiyo-e tradition. In the late 19th century linocut appeared, a variation that replaces wood with linoleum — a softer, easier-to-carve material — popularized in the early 20th century by artists such as Pablo Picasso and Henri Matisse.", "tecnica": "The image is carved in relief on a wood or linoleum matrix: the artist removes with gouges the areas that should stay white, leaving in relief only what will be printed. The carved surface is inked with a roller and pressed against paper, producing thick, angular outlines, with fully flat areas of black and white (or color), without tonal gradation. The marks of the cutting tool remain visible in the edges and textures of the final image, and the drawing must be conceived mirrored, since printing reverses the matrix."}, "pt": {"g": "Uma coruja num galho nu entalhada em preto e branco severo, marcas de goiva visíveis, cortes ousados de cinzel, sem degradês, leve irregularidade na cobertura da tinta, energia de xilogravura de cordel, misteriosa e ancestral", "m": "Retrato elegante em linogravura de uma jovem loira segurando um pote gravado com flores estilizadas lilás, vermelhas e amarelas, linhas ousadas de tinta entalhadas, textura de impressão de matriz entalhada à mão"}},
 "Origami": {"en": {"nome": "Origami / Papercraft", "periodo": "Folding practice spread in Japan from the 6th–7th centuries, popularized in the Edo period (1603-1868); digital papercraft aesthetic from the 2000s", "mestres": ["Akira Yoshizawa (1911–2005)", "Eric Joisel (1956–2010)", "Peter Callesen (b. 1967)", "Lily Zeng", "Jeff Nishinaka (b. 1958)"], "caracteristicas": "Three-dimensional layers that look made purely of paper folds or cutouts.", "historia": "There are signs of paper folding in China and Europe as early as the 6th century, but it was in Japan, after Buddhist monks brought paper from the continent, that the practice developed into the origami we know. During the Edo period, when paper was still a luxury good, the technique gained ceremonial use, such as folding napkins into elaborate shapes for refined banquets. In the 20th century, Akira Yoshizawa, considered the 'grand master' of origami, created a system of symbols and diagrams that simplified the teaching of the technique and helped spread it internationally. More recently, modular origami — which assembles complex structures from several separately folded pieces — drove a resurgence of the style, including as a three-dimensional digital aesthetic (papercraft).", "tecnica": "Forms arise exclusively from precise geometric folds in a flat sheet, traditionally without cutting or gluing, resulting in faceted surfaces with sharp, well-defined edges. Each fold creates a plane that reflects light differently, so volume is suggested by soft shadows between the facets, not by painted shading. Colors appear solid and uniform, like colored paper or cardstock, reinforcing the material origin of the technique. In the digital version (papercraft), these same principles — sharp facets, soft shadows and flat color — are recreated to simulate the tactile volume of paper folded in three dimensions."}, "pt": {"g": "Um leão feito de papel dobrado com vincos nítidos, dobras visíveis e recortes em camadas, sombras projetadas suaves entre as camadas, papel creme fosco com um único acento quente, precisão e paciência silenciosas", "m": "Retrato elegante em papercraft de uma jovem loira feito de papel em camadas, segurando um pote de origami de papel detalhado cheio de flores de papel dobrado lilás, vermelhas e amarelas, sombras suaves de profundidade"}},
 "Claymation": {"en": {"nome": "Claymation", "periodo": "First experiments in the early 20th century; term 'Claymation' registered by Will Vinton in 1978; popularized between the 1950s and 1980s", "mestres": ["Nick Park, of Aardman (b. 1958)", "Henry Selick (b. 1952)", "Will Vinton (1947–2018)", "Tim Burton, director of Corpse Bride (b. 1958)", "Laika Studios"], "caracteristicas": "Characters and objects with the digital texture of modeling clay and stop-motion.", "historia": "The first documented stop-motion film, 'The Humpty Dumpty Circus', is from 1898, but the first experiments specifically with clay animation appear in early 20th-century silent cinema. The technique matured in the mid-century, gaining popular appeal with the cartoon 'The Gumby Show' in the 1950s, starring the green clay puppet Gumby. In 1978, the animator Will Vinton registered the term 'Claymation' and, in the following decade, created the singing 'California Raisins' characters. The British studio Aardman consolidated the artistic prestige of the technique from 1989, with the first Wallace and Gromit short, and later with features such as 'Coraline' and 'Corpse Bride'.", "tecnica": "Figures and sets are sculpted in malleable modeling clay and re-sculpted by hand, frame by frame, to create the illusion of continuous movement — an extremely laborious process. Internal wire armatures help support and position the characters during manipulation. The final surface preserves fingerprints and marks of sculpting tools, with slightly irregular, organic forms that give the technique its characteristic tactile, handmade texture, quite different from the smoothness of digital 3D animation. Soft, directional studio lighting highlights this volume and the physical texture of the clay."}, "pt": {"g": "Um monstrinho de massinha redondo e desengonçado com impressões digitais marcadas na superfície, linhas de emenda visíveis, proporções levemente irregulares, cores vivas e saturadas de plastilina, cenário em miniatura de mesa com luz de estúdio dura, caloroso e engraçado", "m": "Retrato elegante em estilo claymation de uma jovem loira meticulosamente esculpida em argila, segurando um pote liso de argila com flores de massinha lindamente modeladas lilás, vermelhas e amarelas, visual de estúdio de stop-motion"}},
 "Vitral": {"en": {"nome": "Stained Glass", "periodo": "Peak between the 12th and 16th centuries, associated with the Gothic architecture that emerged around 1140 in France", "mestres": ["Marc Chagall (1887–1985)", "Louis Comfort Tiffany (1848–1933)", "Gabriel Loire (1904–1996)", "Antoni Gaudí (1852–1926)", "Josep Maria Jujol (1879–1949)", "Masters of Chartres"], "caracteristicas": "Pieces of translucent colored glass cut and joined by black lead lines.", "historia": "The technique of producing stained glass, described by the monk Theophilus in the early 12th century, remained practically unchanged for centuries. Stained glass took center stage with Gothic architecture: structural innovations such as flying buttresses and pointed arches allowed much more open walls, turning cathedrals into true surfaces of colored light. In Gothic theology, light passing through colored glass was understood as a manifestation of divine presence, and French stained glass enshrined the intense use of reds and blues. In the 13th century, the discovery of 'silver stain' made it possible to paint yellow tones on clear glass, widening the palette and brightening cathedral interiors even more.", "tecnica": "Glass was colored while still liquid with metal oxides — copper for green or blue-green, cobalt for deep blue, gold for wine or violet tones. Details such as faces and folds of cloth were painted on the glass with a mixture of ground glass, metal oxide and vinegar, then permanently fused in a kiln. The pieces of colored glass were then cut, fitted and joined by grooved lead strips, forming compositions segmented into geometric panels. Unlike painting, the color of stained glass depends on the light that passes through it, not on the light it reflects — which is why it changes in intensity throughout the day."}, "pt": {"g": "Uma fênix ascendendo em uma janela gótica ogival, peças de vidro vivas em rubi, cobalto e âmbar separadas por grossas linhas escuras de chumbo, contraluz luminoso projetando um brilho colorido, formas simbólicas chapadas, esplendor sagrado", "m": "Retrato elegante em vitral de uma jovem loira segurando um pote, vibrante mosaico de peças de vidro translúcido lilás, vermelho e amarelo unidas por finas linhas pretas de chumbo, fonte de luz brilhante atrás"}},
 "Ilustração Botânica": {"en": {"nome": "Botanical Illustration", "periodo": "Tradition begun in Antiquity (De Materia Medica, 1st century CE), scientifically consolidated in Europe between the 16th and 19th centuries", "mestres": ["Maria Sibylla Merian (1647–1717)", "Pierre-Joseph Redouté (1759–1840)", "Georg Dionysius Ehret (1708–1770)", "Margaret Mee (1909–1988)", "Ernst Haeckel (1834–1919)"], "caracteristicas": "Old, meticulous scientific drawing on a yellowed paper or encyclopedia background.", "historia": "Representations of plants already decorated tombs and temples in Egypt and Mesopotamia about four thousand years ago, although in stylized form. The tradition of botanical illustration proper goes back to the treatise 'De Materia Medica' by the Greek physician and botanist Dioscorides (c. 50-70 CE), created to help identify medicinal plants. The discipline remained focused on scientific identification until the Renaissance, when artists also began to value the aesthetic beauty of nature, beyond its medical usefulness. The 18th century brought advances in printing and a growing public of amateur botanists, gardeners and naturalists, driving illustrations ever more precise in color and detail during the era of the great naturalist expeditions.", "tecnica": "Botanical illustration seeks almost scientific precision in the anatomy of leaves, petals, stems and roots, often showing different stages of the plant — bud, flower, seed — on the same plate. It is traditionally built with watercolor or gouache for color, combined with fine ink lines for the outlines and a preparatory graphite drawing for the structure. The color palette is naturalistic and soft, faithful to the real appearance of the specimen, and the subject is isolated on a neutral background, with no setting around it, to prioritize documentary clarity over any atmospheric effect."}, "pt": {"g": "Um grupo de cogumelos renderizado com hachuras finas de pena e delicada aguada de aquarela, rótulos em latim e número de prancha, detalhes de raiz e corte transversal, papel marfim envelhecido com manchas de foxing, devoção científica paciente", "m": "Elegante ilustração vintage de livro didático de botânica de uma jovem loira de perfil segurando um pote de terracota com flores cientificamente precisas lilás, vermelhas e amarelas, arte de linha fina a nanquim, textura de papel envelhecido"}},
 "Giz de Cera": {"en": {"nome": "Crayon / Pastel", "periodo": "Dry pastel since the Italian Renaissance, consolidated as an independent technique in the 17th century and in great vogue in the 18th; modern crayon popularized in the 20th century", "mestres": ["Edgar Degas (1834–1917)", "Mary Cassatt (1844–1926)", "Odilon Redon (1840–1916)", "Rosalba Carriera (1673–1757)", "Jean-Étienne Liotard (1702–1789)"], "caracteristicas": "Thick strokes, childlike or naive texture with rough wax grain over the background.", "historia": "The first works to use pastel emerged in the Italian Renaissance, applied sparingly to add color to drawings made in natural chalk. Pastel only consolidated as an independent painting technique in the 17th century, but it was in the 18th that it lived its peak: for its soft atmospheric effects, it became the favorite medium of European portraitists, to the point that some 2,500 artists and amateurs worked in pastel in Paris alone in the mid-century. The wax crayon, a related but technically distinct industrial medium, was developed and popularized in the 20th century, becoming at once a basic school material and, later, an artistic medium valued for its spontaneity and direct, saturated color.", "tecnica": "The sticks are made of powdered pigment bound with gum arabic and applied dry, directly on textured paper, with no prior preparation. Color comes from each stick already at maximum saturation — unlike paint, which is mixed on a palette — which forces the artist to work with dozens or hundreds of sticks of distinct colors. The stroke can be used on its side to cover broad areas, smudged with fingers to create soft gradations, or layered in opaque coats for an almost impasto effect. The final surface is grainy and slightly powdery, with the paper's texture and directional strokes always visible."}, "pt": {"g": "Um parquinho infantil num parque desenhado com giz de cera grosso, pressão irregular, grão ceroso deixando o papel branco aparecer, formas ingênuas e trêmulas, cores primárias saturadas, pura entrega alegre", "m": "Desenho elegante em pastel macio de uma jovem loira segurando um pote de cerâmica, texturas aveludadas de flores lilás, vermelhas e amarelas, textura de grão fino, delicada mistura artística"}},
 "Tatuagem": {"en": {"nome": "Traditional Tattoo", "periodo": "Style consolidated between the late 19th and early 20th centuries in the USA, peaking under Sailor Jerry in Hawaii (1930s to 1970s)", "mestres": ["Norman 'Sailor Jerry' Collins (1911–1973)", "Don Ed Hardy (b. 1945)", "Bert Grimm (1900–1985)", "Paul Rogers (1905–1990)", "Horihide, Hideo Kakimoto (1929–2017)"], "caracteristicas": "American Old School style; very thick black outlines and simplified shading.", "historia": "In the late 19th and early 20th centuries, American tattooists offered simple designs, with black outlines and limited colors, made for fast execution. In the 1920s–30s, sets of ready-made designs ('flash sheets') — many with a nautical theme — began to circulate among studios, consolidating what would be called the American traditional ('old school') style. Norman 'Sailor Jerry' Collins, considered the father of the style, left the navy in 1936, settled in Honolulu and opened his own studio around 1940, serving sailors on shore leave. His contact with Japanese tattooists during and after World War II led him to incorporate the composition and shading of Japanese tattooing into the vigor of the American line, refining the style without losing its legibility on the skin — a tradition that remains alive and is still being tattooed today.", "tecnica": "The style relies on thick, continuous black outlines that delimit each form and ensure legibility even decades later, when the skin ages and the ink spreads. The palette is deliberately limited and highly saturated — traditionally red, green, yellow and blue-black — chosen for its stability under the skin over the years. The color fill is flat and without gradation, letting the outline and the simplified form, not the shading, build the visual reading. The iconography is purposely simple and direct — swallows, anchors, roses, pin-ups, banners with text — designed to remain recognizable at a distance even decades after application."}, "pt": {"g": "Uma cabeça de pantera rosnando avançando para a frente, contornos pretos pesados, preenchimentos sólidos e saturados de vermelho, verde e amarelo, sombreamento mínimo em chicote, faixa com pergaminho, flash sheet em papel envelhecido, atitude ousada e atemporal", "m": "Design elegante de flash de tatuagem neotradicional de um retrato de uma jovem loira segurando um pote clássico com flores vibrantes lilás, vermelhas e amarelas, linhas grossas, limpas e ousadas, sombreamento suave em degradê"}},
 "Giz de Lousa": {"en": {"nome": "Chalkboard Art", "periodo": "Aesthetic derived from commercial chalkboard lettering in bars and cafés, popularized in graphic design from the 2000s–2010s", "mestres": ["Dana Tanamachi (b. 1985)", "Jessica Hische, letterer (b. 1984)", "Mike Shea", "Greg Smith"], "caracteristicas": "Art made with white or colored textured chalk on a blackboard background.", "historia": "Chalk typography has roots in traditional commercial lettering — boards hung by hand outside bars, cafés and restaurants to advertise the day's menu. This everyday, ephemeral practice was incorporated into graphic design and brand identities from the 2000s–2010s, when designers began digitally reproducing this handmade charm, within a broader movement of revival of 'hand-lettering' in design. The aesthetic quickly spread to wedding invitations, packaging, book covers and film titles in search of a nostalgic, personal and handcrafted effect, backed by an almost universal memory: the shared experience of writing with chalk on a school blackboard.", "tecnica": "The stroke, in white, cream or pastel tones, appears on a textured dark background that imitates a real blackboard, often with subtle marks of dust and smudging. The lines are deliberately irregular and slightly shaky, rather than geometrically perfect, reproducing the real resistance of chalk dragged over a rough surface. The composition mixes decorative hand-made lettering or display typography with small illustrative elements around the text — banners, leaves, arrows, stars. In practice, the effect is obtained both with chalk or white pencil on a dark surface and digitally, with a graphics tablet or a black pencil stroke later inverted in post-production."}, "pt": {"g": "Um mapa desenhado a giz de uma ilha de fantasia em uma lousa de ardósia escura, traços empoeirados, borrões fantasmas de linhas apagadas, giz branco e pastel, rótulos escritos à mão, charme brincalhão de professora", "m": "Arte em lousa elegante retratando uma jovem loira segurando um pote cheio de flores desenhadas a giz lilás, vermelhas e amarelas lindamente esfumadas, autêntica textura empoeirada de lousa"}},
 "Brutalismo": {"en": {"nome": "Brutalism", "periodo": "Architecture: 1950s to 1970s, starting from Le Corbusier's Unité d'Habitation in Marseille (1952); here adapted as a portrait aesthetic", "mestres": ["Le Corbusier (1887–1965)", "Paul Rudolph (1918–1997)", "Tadao Ando (b. 1941)", "Marcel Breuer (1902–1981)", "Lina Bo Bardi (1914–1992)"], "caracteristicas": "Architecture focused on massive geometric forms, heavy blocks and raw concrete texture. (Adapted for Portrait)", "historia": "Brutalism was born from postwar modernism, driven by the need to rebuild European cities devastated by World War II quickly and cheaply. Its origin is usually associated with Le Corbusier's Unité d'Habitation in Marseille, completed in 1952 — one of the first large buildings to expose raw concrete as the final finish. The name comes precisely from the French term 'béton brut' ('raw concrete'), a material that Le Corbusier defended as honest and free of ornamentation. The style spread internationally in the 1950s to 1970s in civic, educational and residential buildings, with names such as Paul Rudolph, Marcel Breuer and, in Brazil, Lina Bo Bardi — before falling out of favor and being reassessed decades later, including as an aesthetic reference, as in this adaptation of the style for portraits.", "tecnica": "Brutalism is defined by massive, monolithic and repetitive forms, with a strong sense of weight and structural modularity. Exposed, unfinished concrete is the defining surface of the style, often preserving the marks and grain of the wooden forms used in casting ('board-formed texture'). The central principle is to expose structure and material honestly, rather than hiding them behind ornaments or cladding. Hard, flat light, often from an overcast day, reinforces this coldness and material weight — qualities that, in the portrait version, translate into an angular, sculptural and high-contrast treatment of the subject, as if carved in concrete."}, "pt": {"g": "Um monumento monolítico de blocos de concreto bruto num campo enevoado, textura de fôrma de madeira, massas pesadas empilhadas, luz dura, plana e nublada, riscos de chuva, silêncio frio e imponente", "m": "Retrato artístico brutalista elegante de uma jovem loira, texturas de concreto angulosas e de alto contraste, segurando um pote monolítico de pedra com flores estruturais cruas e nitidamente definidas em lilás, vermelho e amarelo"}},
 "Psicodélico": {"en": {"nome": "Psychedelic", "periodo": "Peak between 1966 and 1972, in the United States (San Francisco) and the United Kingdom", "mestres": ["Victor Moscoso (b. 1936)", "Wes Wilson (1937–2020)", "Alton Kelley (1940–2008)", "Rick Griffin (1944–1991)", "Peter Max (1937–2026)"], "caracteristicas": "Kaleidoscopic patterns, fluid optical distortions and intense mixtures of rainbow colors.", "historia": "Psychedelic art emerged in the mid and late 1960s as the visual language of the counterculture and of hallucinogenic drug culture, seeking to translate altered states of perception visually. The movement is closely tied to the San Francisco rock concert poster scene, at venues such as the Fillmore Auditorium and the Avalon Ballroom, promoting bands such as the Grateful Dead and Jefferson Airplane. Key poster artists such as Wes Wilson, Victor Moscoso and Bonnie MacLean drew inspiration from the flowing lines of Art Nouveau and Victorian ornament, added to the optical effects of Op Art. The style quickly extended beyond posters to album covers, fashion and graphic design, becoming a lasting visual symbol of the counterculture of the late 1960s.", "tecnica": "The patterns are kaleidoscopic, undulating and often symmetrical, built from densely interlaced organic and geometric motifs. Colors are intensely saturated and placed side by side in simultaneous contrasts (such as orange and blue, or red and green), creating an optical vibration effect. The lettering is deliberately distorted, melted or interwoven with the surrounding ornament, to the point of being hard to read — the composition values visual rhythm above legibility. Continuous curved lines, with no right angles, together with Op Art-inspired repetitions, suggest movement, distortion and depth, recalling the visual effects associated with hallucinogenic experiences."}, "pt": {"g": "Padrões concêntricos caleidoscópicos e ondulantes em laranja ácido, magenta e azul elétrico em choque, formas derretidas semelhantes a letras, contrastes complementares vibrantes, distorção óptica, êxtase de cartaz de 1967", "m": "Retrato de arte psicodélica elegante de uma jovem loira segurando um pote em redemoinho, flores se expandindo em ondulações caleidoscópicas de lilás, vermelho rubi e amarelo cromo, fusão com Art Nouveau dos anos 1960"}},
 "Escultura em Marmore": {"en": {"nome": "Marble Sculpture", "periodo": "6th century BCE to the present, Greece, Rome, Italy and the world", "mestres": ["Praxiteles (4th century BCE)", "Michelangelo (1475–1564)", "Gian Lorenzo Bernini (1598–1680)", "Antonio Canova (1757–1822)", "Auguste Rodin (1840–1917)"], "caracteristicas": "Polished white marble, idealized anatomy, wet drapery, translucency and the glow of skin in stone.", "historia": "The Greeks developed marble sculpture from the 6th century BCE, arriving at Praxiteles and his Aphrodite of Knidos. In the Renaissance, Michelangelo carved the 'Pietà' (1498–99) and the 'David' (1501–04) from blocks of Carrara. Bernini, in the Baroque, gave dramatic movement to works such as 'Apollo and Daphne' (1622–25), in which the stone seems to turn into leaves, and Canova brought the neoclassical elegance of 'Psyche Revived by Cupid's Kiss'. Rodin returned to the theme with 'The Kiss' (1882), leaving parts rough. In antiquity, statues were painted.", "tecnica": "The sculptor extracts the figure from a block with hammer and point chisel, then uses chisels, rasps and abrasives to refine it. The final surface is polished with ever finer powders until it shines, and the translucency of marble (up to a few millimeters) simulates flesh. 'Wet drapery' reveals the body beneath the cloth. The 'non finito' technique leaves parts rough, and the contrast between polished and rustic stone is expressive. The white color is sometimes the result of wear, since statues were originally polychrome."}, "pt": {"g": "Fotografia de museu de uma escultura de mármore branco puro de Carrara de dois amantes em um abraço, dobras de drapeado molhado colando-se a uma anatomia idealizada, pedra polida e translúcida com veios sutis, marcas rústicas de cinzel inacabadas na base, luz rasante suave, movimento barroco dramático", "m": "Retrato elegante de uma jovem com traços mediterrâneos clássicos segurando um vaso com flores lilás, vermelhas e amarelas, busto de escultura em mármore branco de Carrara de uma jovem segurando um vaso de flores esculpido em pedra, superfície polida e translúcida, veios sutis, dobras de drapeado molhado, iluminação suave de museu"}},
 "Bordado": {"en": {"nome": "Embroidery / Tapestry", "periodo": "Antiquity to the present; European tapestry since the Middle Ages", "mestres": ["Bayeux Tapestry (c. 1070)", "The Lady and the Unicorn (c. 1500)", "William Morris (1834–1896)", "Anni Albers (1899–1994)", "Arthur Bispo do Rosário (c. 1909–1989)"], "caracteristicas": "Colored threads with raised texture, visible stitches, decorative patterns, miniature details and a handcrafted look.", "historia": "Embroidery and tapestry are among the oldest arts. The Bayeux Tapestry (c. 1070), actually a 70-meter embroidery, narrates the Norman conquest of England. 'The Lady and the Unicorn' (c. 1500) is a set of six tapestries in wool and silk, a symbol of the late Gothic. In the 19th century, William Morris renewed the tradition with floral patterns for Arts and Crafts. Anni Albers, of the Bauhaus, raised weaving to modern art, and the Brazilian Arthur Bispo do Rosário embroidered an entire universe with threads pulled from uniforms during decades of psychiatric confinement.", "tecnica": "Embroidery creates images with needle and thread on fabric, with stitches such as backstitch, satin stitch, stem stitch, French knot and chain stitch, which form textures and reliefs. Tapestry weaves the image into the weave itself, passing colored threads between the warp threads. Colors come from wool, silk, cotton and metallic threads, in transitions made by hatching of threads. The image has the look of a soft mosaic, with repeated patterns and darkened outlines. Light brings out the sheen of the threads and the shadows between the stitches."}, "pt": {"g": "Close de uma tapeçaria medieval ricamente bordada de um unicórnio em um jardim millefleurs, milhares de pontos visíveis em fio de lã e seda, textura em relevo de ponto cheio, trama tecida em vermelho profundo, azul e ouro, minúsculas flores em padrão denso, tecido envelhecido com sombras suaves entre os fios", "m": "Retrato elegante de uma jovem latina de cabelos escuros e trançados segurando um vaso com flores lilás, vermelhas e amarelas, bordado à mão em linho, retrato bordado em ponto cheio e nós franceses, textura de fio visível e relevo, borda floral, cores vivas de fio de seda, sombras suaves entre os pontos"}},
 "Arte em Neon": {"en": {"nome": "Neon Art", "periodo": "1910 to the present, France, United States and the world", "mestres": ["Georges Claude (1870–1960)", "Bruce Nauman (b. 1941)", "Dan Flavin (1933–1996)", "Chryssa (1933–2013)", "Tracey Emin (b. 1963)"], "caracteristicas": "Glowing glass tubes, handwritten letters and silhouettes, colored glow on a dark background and wet reflections.", "historia": "The French engineer Georges Claude presented the neon lamp in Paris in 1910, and the first commercial sign in 1912. In the United States, the first shop to use neon was a car dealership in Los Angeles in 1923. The technology reached art in the 1960s, with light as a material in works by Dan Flavin (fluorescent tubes), Bruce Nauman and Chryssa. Tracey Emin makes handwritten phrases in neon. On the streets of cities such as Tokyo, Hong Kong and Las Vegas, signs became a symbol of nightlife and film noir.", "tecnica": "Glass tubes are heated and bent by hand into letters or drawings, filled with a noble gas (neon, red-orange; argon with mercury, blue) and electrified. Different colors come from gases and phosphor coatings. Visually, the light forms a continuous, saturated line, with a luminous halo that spreads. The dark background and reflections in wet asphalt or glass reinforce the atmosphere. The supports, wires and transformers behind the work can be seen."}, "pt": {"g": "Arte de letreiro de neon brilhante numa parede de tijolos escuros à noite, tubos de vidro dobrados à mão formando uma palavra cursiva e um raio em rosa-choque, azul elétrico e violeta, halos suaves de brilho se espalhando em reflexos no asfalto molhado, suportes e fios de fixação visíveis, vida noturna urbana sombria", "m": "Retrato elegante de uma jovem do leste asiático de cabelos pretos segurando um vaso com flores lilás, vermelhas e amarelas, retrato em arte de letreiro de neon, perfil da mulher e um vaso de flores desenhados como tubos de vidro brilhantes dobrados à mão em rosa-choque, azul elétrico e violeta, halo brilhante intenso, parede de tijolos escuros, reflexos molhados"}}
}
}/*I18N:fim*/;
</script>
<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const url = p => p.split('/').map(encodeURIComponent).join('/');
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
const ler = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };

/* ---------- Ícones ---------- */

}

/* ---------- Temas ---------- */
const menu = $('#themeMenu'), themeBtn = $('#themeBtn');
function montarMenuTemas() {
  menu.textContent = '';
  TEMAS.forEach(tm => {
    const [nome, desc] = t().temas[tm.id];
    const b = el('button'); b.type = 'button'; b.setAttribute('role', 'menuitemradio'); b.setAttribute('aria-checked', tm.id === tema); b.dataset.tema = tm.id;
    const sw = el('span', 'sws'); tm.sw.forEach(c => { const i = el('i'); i.style.background = c; sw.appendChild(i); });
    const tx = el('span'); tx.appendChild(el('b', null, nome)); tx.appendChild(el('small', null, desc));
    b.append(sw, tx); menu.appendChild(b);
  });
}
function fecharMenu() { menu.hidden = true; themeBtn.setAttribute('aria-expanded', 'false'); }
themeBtn.addEventListener('click', () => {
  const abrir = menu.hidden; menu.hidden = !abrir; themeBtn.setAttribute('aria-expanded', abrir);
  if (abrir) (menu.querySelector('[aria-checked=true]') || menu.firstChild).focus({ preventScroll: true });
});
menu.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  definirTema(b.dataset.tema); fecharMenu(); themeBtn.focus();
});
menu.addEventListener('keydown', ev => {
  const itens = [...menu.querySelectorAll('button')], i = itens.indexOf(document.activeElement);
  if (ev.key === 'ArrowDown') { ev.preventDefault(); itens[(i + 1) % itens.length].focus(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); itens[(i - 1 + itens.length) % itens.length].focus(); }
});
function definirTema(id) {
  tema = id; document.documentElement.dataset.theme = id; guardar('tema', id);
  menu.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b.dataset.tema === id));
  $('#themeName').textContent = t().temas[id][0];
}

swPrompts.addEventListener('change', () => { aplicarPrompts(swPrompts.checked); guardar('prompts-visiveis', swPrompts.checked ? '1' : '0'); });
