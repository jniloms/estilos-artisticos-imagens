 "Sketch": {"en": {"nome": "Sketch / Croquis", "periodo": "From the Renaissance to the present; fashion croquis in the 20th century; urban sketching since 2007", "mestres": ["Leonardo da Vinci (1452–1519)", "René Gruau (1909–2004)", "Antonio Lopez (1943–1987)", "Gabriel Campanario (founder of Urban Sketchers, 2007)", "Egon Schiele (1890–1918)"], "caracteristicas": "Quick, loose strokes, visible construction lines, stylized proportions and a deliberately unfinished look.", "historia": "The sketch has always been the artist's stage of thinking, and Leonardo da Vinci's notebooks show visual study as a method. In the 20th century, the fashion croquis, with elongated figures and elegant gestures, became a language of its own, with illustrators such as René Gruau (Dior campaigns) and Antonio Lopez. In 2007, the journalist and illustrator Gabriel Campanario created the Urban Sketchers movement, which encouraged recording cities on location. Today, the sketch is also valued as a finished aesthetic, because it shows spontaneity, process and personal voice.", "tecnica": "The sketch uses a few quick, confident lines, in pencil, pen or marker, with a gestural outline that suggests form without closing off every detail. Construction lines (circles, axes, boxes) stay visible. In the fashion croquis, the figure is about nine heads tall, with elongated neck and legs, and fabric is indicated by a few lines and patches of marker or watercolor. Areas of color, generally flat and applied outside the line, complete the drawing, and the paper is left almost blank."}, "pt": {"g": "Página solta de caderno de urban sketching de uma rua de café ensolarada, traço rápido e confiante de nanquim com gesto visível, guias de perspectiva trêmulos, algumas aguadas de aquarela pingadas fora das linhas, anotações manuscritas na margem, charme espontâneo e inacabado em papel creme", "m": "Retrato elegante de uma jovem brasileira miscigenada de cabelos cacheados e volumosos segurando um vaso com flores lilás, vermelhas e amarelas, croqui de moda, figura alongada e elegante, traços rápidos e confiantes de nanquim, aguadas soltas de marcador e aquarela, linhas de construção visíveis, aspecto inacabado e espontâneo em papel branco"}},
 "Quadrinhos Americanos": {"en": {"nome": "American Comics (Comic Book)", "periodo": "1938 to the present, United States (Golden Age, Silver Age and Modern)", "mestres": ["Jack Kirby (1917–1994)", "Steve Ditko (1927–2018)", "Neal Adams (1941–2022)", "Frank Miller (b. 1957)", "Jim Lee (b. 1964)"], "caracteristicas": "Thick ink outlines, flat colors with halftone dots, heroic anatomy, dynamic foreshortening and onomatopoeia.", "historia": "The superhero comics industry began with 'Action Comics' no. 1 (June 1938), which introduced Superman, created by Jerry Siegel and Joe Shuster. In the Silver Age, Marvel, under Stan Lee, Jack Kirby and Steve Ditko, launched 'Fantastic Four' (1961) and 'Spider-Man' (1962), with more human heroes. Neal Adams brought anatomical realism in the 1970s, and Frank Miller, with 'Batman: The Dark Knight Returns' (1986), plunged the genre into dark tones. In 1992, Jim Lee and others founded Image Comics, valuing the authorship of the artists.", "tecnica": "The classic process divides the work into pencils, inks and coloring. The line work uses black outlines of varying thickness, shadows from masses of ink and dramatic foreshortening for impact. Colors were limited by four-color printing, with Ben-Day dots (halftone) simulating tones. Kirby created the 'Kirby Krackle' to represent energy. Panels have diagonal composition, muscular characters, large onomatopoeia ('POW!') and speech balloons; the page is planned for reading flow."}, "pt": {"g": "Splash page de um herói mascarado saltando por uma cidade encharcada de chuva, escorço extremo, contornos ousados de nanquim preto e grandes manchas de preto, paleta chapada em quatro cores com pontos de retícula Ben-Day, faíscas de energia irregulares, linhas de ação e uma onomatopeia gigante", "m": "Retrato elegante de uma jovem latina de cabelos longos e escuros segurando um vaso com flores lilás, vermelhas e amarelas, estilo de capa de quadrinhos americanos, contornos ousados de nanquim preto, paleta chapada em quatro cores com pontos de retícula Ben-Day, escorço dramático, pose heroica e dinâmica, linhas de ação"}},
 "Cartum": {"en": {"nome": "Cartoon / Caricature", "periodo": "16th century to the present, Europe, the Americas and the world", "caracteristicas": "Exaggerated features, humor and criticism, expressive lines, distorted proportions and recognizable characters.", "historia": "The word 'caricature' comes from the Italian 'caricare' (to load, to exaggerate), and the genre is associated with the Carracci brothers of Bologna in the late 16th century. In England, Hogarth and Gillray used drawing as a political weapon. Honoré Daumier hounded those in power in France, and Thomas Nast created, in the United States, the symbols of the elephant and the donkey for the parties. In Brazil, Angelo Agostini pioneered the editorial cartoon in the 19th century and, later, Henfil, Millôr Fernandes and Ziraldo made the cartoon an instrument of criticism during the dictatorship. The tradition is still alive in newspapers and social media.", "tecnica": "The technique consists of identifying and exaggerating the most striking feature of a face or posture, such as the nose, chin, eyes or ears, while keeping the likeness recognizable. The line is loose and expressive, in pen, ink or brush, with few resources and plenty of personality. Proportions are distorted (big head, small body), and color is applied flat or in watercolor. The humor comes from the contrast between appearance and action, with short captions or balloons."}, "pt": {"g": "Charge de jornal de um político pomposo com cabeça enorme e corpo minúsculo pisoteando uma montanha de papelada, nariz e queixo exagerados, linhas de nanquim soltas e trêmulas, aguada de aquarela chapada, energia satírica espirituosa, balão de fala", "m": "Retrato elegante de uma jovem ruiva e sardenta segurando um vaso com flores lilás, vermelhas e amarelas, estilo de desenho de caricatura, cabeça exagerada e superdimensionada e grandes olhos expressivos, corpo minúsculo, linhas de nanquim trêmulas, aguada de aquarela chapada e divertida, humor satírico, buquê enorme"}},
 "Gravura em Metal": {"en": {"nome": "Metal Engraving / Etching", "periodo": "15th century to the present, Europe and the world", "caracteristicas": "Very fine, sharp lines, dense hatching, deep contrasts and the texture of pressed paper.", "historia": "Metal engraving was born among the German and Italian goldsmiths of the 15th century, who carved plates with a burin. Albrecht Dürer raised the genre to masterpiece level, with 'Melencolia I' (1514). Etching, in which the drawing is eaten away by acid, was used around 1500 and reached perfection with Rembrandt, who explored light and shadow with subtle variations. Goya, in 'Los Caprichos' (1799) and 'The Disasters of War', used aquatint to create somber atmospheres, and Piranesi imagined monumental prisons. Engraving made it possible to reproduce images in series and spread ideas across Europe.", "tecnica": "In burin engraving, the artist cuts the copper plate with a steel tool and obtains clean, firm lines. In etching, the plate is covered with varnish, the drawing is scratched with a needle and the acid eats the exposed lines. Aquatint creates tonal areas with resin. The plate is inked, wiped and pressed onto damp paper, and the image comes out reversed, with the plate mark on the paper. Shadows come from dense cross-hatching, in deep blacks and tonal gray."}, "pt": {"g": "Água-forte de um salão de prisão barroca imaginária com escadarias e arcos infinitos, hachuras cruzadas finas e densas, pretos profundos e aveludados, linhas incisas finíssimas, marca da chapa e papel vergê creme, tinta preto-sépia em papel antigo", "m": "Retrato elegante de uma jovem morena de cabelos escuros presos no alto segurando um vaso com flores lilás, vermelhas e amarelas, estilo de gravura em metal e água-forte, hachuras cruzadas finas e densas, linhas incisas finíssimas, pretos profundos e aveludados, marca da chapa em papel antigo creme, flores desenhadas com detalhe meticuloso"}},
 "Studio Ghibli": {"en": {"nome": "Studio Ghibli", "periodo": "1985 to the present, Japan", "caracteristicas": "Hand-painted backgrounds, skies of billowing clouds, lush nature, delicate characters and a nostalgic atmosphere.", "historia": "Studio Ghibli was founded in 1985 by Hayao Miyazaki, Isao Takahata and the producer Toshio Suzuki, after the success of 'Nausicaä of the Valley of the Wind' (1984). Its features, such as 'My Neighbor Totoro' (1988), 'Spirited Away' (2001, Oscar for Best Animated Feature in 2003) and 'Howl's Moving Castle' (2004), combine fantasy, ecology and everyday life. The art director Kazuo Oga painted landscapes of luminous forests that defined the studio's look. In March 2025, the 'Ghibli style' went viral in image generators; Miyazaki had already criticized AI animation in 2016, and the subject remains debated in terms of authorship and respect for artists.", "tecnica": "The features are made with traditional hand-drawn animation, frame by frame. The sets are painted in gouache and watercolor, with blue skies, white cumulus clouds with soft outlines and vegetation in many shades of green. The characters have simple lines, expressive but not exaggerated eyes, and natural movements. There are moments of pause and silence (the 'ma'), and the light is soft. The palette is natural and slightly faded, with emphasis on food, wind, water and small everyday gestures."}, "pt": {"g": "Tarde de verão no campo pintada à mão, cúmulos imponentes em um céu azul profundo, colinas verdes ondulantes e um minúsculo trem a vapor atravessando uma ponte de madeira, fundos suaves em guache e aquarela, personagens simples e limpos desenhados à mão, vento suave, nostalgia tranquila e encantamento", "m": "Retrato elegante de uma jovem japonesa de cabelos curtos e pretos segurando um vaso com flores lilás, vermelhas e amarelas, estilo de longa de animação japonesa desenhada à mão, fundo suave em aquarela de campo verde e cúmulos, design de personagem simples e gentil, luz quente e nostálgica, atmosfera fantasiosa"}},
 "Estilo Pixar": {"en": {"nome": "Pixar Style (3D)", "periodo": "1986 to the present, United States", "caracteristicas": "Stylized 3D, charismatic characters with big eyes, tactile materials, soft light and saturated colors.", "historia": "Pixar was born in 1986, when Steve Jobs bought the computer graphics division of Lucasfilm, led by Ed Catmull and Alvy Ray Smith. In 1995, 'Toy Story' was the first fully computer-animated feature, and the company developed the RenderMan software. Hits such as 'Finding Nemo' (2003), 'The Incredibles' (2004) and 'Up' (2009) combined technical advances with emotional storytelling. Disney bought the studio in 2006. The aesthetic of stylized 3D, with round, expressive characters and well-lit scenes, became a reference for animation, games and social media.", "tecnica": "Characters have simplified and exaggerated forms (big heads, wide eyes, cartoonish proportions) and movements animated with the classic principles of animation. Materials are carefully simulated: subsurface scattering in skin, individual hairs, fabrics with fibers and surfaces with micro-imperfections. Lighting uses soft global illumination, with soft shadows and highlights in the eyes. The palette is saturated and harmonious, and the scenes have cinematic depth of field."}, "pt": {"g": "Cena de longa de animação 3D estilizado de um pequeno robô redondo abraçando um broto em vaso numa oficina bagunçada, olhos grandes, brilhantes e expressivos, materiais táteis de plástico e metal enferrujado, iluminação global suave com luz de contorno quente, paleta saturada e alegre, profundidade de campo rasa", "m": "Retrato elegante de uma jovem negra de cabelos cacheados em coque alto segurando um vaso com flores lilás, vermelhas e amarelas, visual de longa de animação 3D estilizado, olhos grandes e expressivos, pele com dispersão subsuperficial suave, proporções arredondadas e simpáticas, iluminação cinematográfica quente, cores saturadas e alegres"}},
 "Disney Classico": {"en": {"nome": "Classic Disney (2D)", "periodo": "1928 to 1999 (classic era), United States", "mestres": ["Walt Disney (1901–1966)", "Ub Iwerks (1901–1971)", "Frank Thomas (1912–2004) and Ollie Johnston (1912–2008)", "Mary Blair (1911–1978)", "Eyvind Earle (1916–2000)"], "caracteristicas": "Hand-drawn animation, rounded lines, rich colors, painted backgrounds, princesses, talking animals and musicals.", "historia": "The classic Disney era began with 'Steamboat Willie' (1928), the first cartoon with synchronized sound, and with the Technicolor of 'Flowers and Trees' (1932). 'Snow White and the Seven Dwarfs' (1937) was the first cel-animated feature, produced with the multiplane camera. The animators Frank Thomas and Ollie Johnston, of the 'Nine Old Men', described the 12 principles of animation in 'The Illusion of Life' (1981). 'Sleeping Beauty' (1959) was designed by Eyvind Earle with backgrounds inspired by medieval art. The period from 1989 to 1999, the 'Disney Renaissance', revitalized the genre with 'The Little Mermaid' and 'The Lion King'.", "tecnica": "Each frame is drawn by hand, transferred to acetate (cel) and painted with opaque paints over backgrounds painted in gouache or watercolor. Characters have continuous, flowing line outlines, rounded forms and movements based on the principles of 'squash and stretch', anticipation, follow-through and overlapping action. The color is intense and bright, with simple shading. Musical scenes and pantomime exaggerate emotions, and animals and objects take on personality."}, "pt": {"g": "Cena clássica de animação em cel com tinta feita à mão de uma princesa cantando para animais da floresta numa clareira encantada, contornos suaves e fluidos, cenário pintado em aquarela, cores vivas e ricas, squash and stretch expressivo, brilhos e folhas rodopiando, calor de livro de contos", "m": "Retrato elegante de uma jovem de pele morena quente e cabelos longos castanho-escuros segurando um vaso com flores lilás, vermelhas e amarelas, estilo clássico de conto de fadas animado em 2D desenhado à mão, contornos de nanquim suaves e fluidos, fundo pintado de livro de histórias, cores vivas e ricas de cel, pose graciosa de princesa, pássaros cantores e pétalas de flores"}},
 "Cartoon Moderno": {"en": {"nome": "Modern Cartoon (Western Animation)", "periodo": "1990 to the present, United States and Europe", "caracteristicas": "Simple geometric shapes, uniform outlines, flat colors, exaggerated humor and stylized graphic design.", "historia": "Western TV animation went through a phase of renewal in the 1990s, when the 'Cartoon Cartoons', such as 'Dexter's Laboratory' (1996) and 'The Powerpuff Girls' (1998), gave creative control to their authors. 'The Simpsons' (1989) showed that animation could also be adult content. Genndy Tartakovsky brought minimalist design to 'Samurai Jack' (2001). From the 2010s, 'Adventure Time' (2010), 'Steven Universe' (2013) and 'Gravity Falls' (2012) created personal, queer-friendly universes with an auteur look. The style draws on the UPA design of the 1950s.", "tecnica": "Characters are built from basic geometric shapes (circles, squares, triangles) and silhouettes that are easy to recognize. Lines have uniform thickness and colors are flat, with little or no shading, usually in vector art. Backgrounds are more graphic, with restricted palettes and brushed textures. Expression comes from squash and stretch, big eyes or simple dots, and comic poses. The animation pace is limited, which reinforces the visual humor."}, "pt": {"g": "Quadro de cartoon vetorial chapado de um herói desengonçado e um cachorro falante numa estrada do deserto em tons pastel vivos, contornos grossos e uniformes, formas geométricas simples nos personagens, cores sólidas chapadas sem sombreamento, pose trêmula de squash and stretch, formas gráficas ousadas no fundo, paleta saturada de doce", "m": "Retrato elegante de uma jovem latina de cabelos pretos e rabo de cavalo segurando um vaso com flores lilás, vermelhas e amarelas, estilo de cartoon moderno de TV, formas geométricas simples nos personagens, contorno grosso e uniforme, cores sólidas chapadas sem sombreamento, olhos grandes de ponto, paleta saturada de doce, formas gráficas de flores"}},
 "Render 3D": {"en": {"nome": "3D Render (Octane / Unreal Engine)", "periodo": "2010s to the present, digital world", "mestres": ["Beeple (Mike Winkelmann, b. 1981)", "Ash Thorp", "Peter Tarka", "Alessandro Baldasseroni", "Epic Games (Unreal Engine, since 1998)"], "caracteristicas": "Glossy and iridescent materials, glass, metal, volumetric light, perfect reflections and surreal forms in high resolution.", "historia": "The 3D render aesthetic was consolidated with physically based rendering engines, such as Octane Render (OTOY, 2012) and Unreal Engine (Epic Games, released in 1998 and popularized by Unreal Engine 5, in 2022). Artists such as Beeple, who created one image a day for 13 years ('Everydays'), took the language into contemporary digital art. In 2021, his work 'Everydays: The First 5000 Days' sold for US$69 million at Christie's. Today the term 'Octane render' appears in AI prompts as a shortcut for ultra-polished, hyper-detailed and shiny images.", "tecnica": "The artist models forms in 3D, assigns materials with physical properties (roughness, transparency, refraction, iridescence) and lights the scene with studio lights, HDRI and volumetric rays. Renderers simulate the path of light (path tracing), generating realistic reflections, soft shadows, caustics and depth of field. Post-production details include bloom, chromatic aberration and grain. The result is a clean, shiny and hyper-detailed image, with the feel of a futuristic product."}, "pt": {"g": "Render Octane de uma esfera de vidro iridescente flutuante abrigando uma minúscula cidade luminosa, reflexos e refrações com ray tracing, raios de luz volumétricos, dispersão subsuperficial, estúdio escuro com luz de contorno suave, ultradetalhado, 8k, profundidade de campo cinematográfica, futurismo surreal", "m": "Retrato elegante de uma jovem do leste asiático de cabelos longos e pretos segurando um vaso com flores lilás, vermelhas e amarelas, render 3D estilo Octane, pele brilhante e iridescente e pétalas semelhantes a vidro, reflexos com ray tracing, iluminação de contorno volumétrica, ultradetalhado, fundo de estúdio escuro, futurismo surreal"}},
 "Isometrico": {"en": {"nome": "Isometric", "periodo": "Technical drawing (19th century); games and illustration from 1982 to today", "mestres": ["eBoy (pixel art collective, founded 1997)", "ustwo games (Monument Valley, 2014)", "Will Wright (SimCity 2000, 1993)", "M. C. Escher (1898–1972)", "Sega (Zaxxon, 1982)"], "caracteristicas": "30° projection, miniatures of cut-away scenes, fixed angles, clean colors and city or room details.", "historia": "Isometric projection was formalized in the 19th century by William Farish and used in technical and engineering drawings because it preserves the proportions of the three axes. In video games, it appeared in 'Zaxxon' (1982) and 'Q*bert' (1982), and became a way to simulate depth in 2D with games such as 'SimCity 2000' (1993). The eBoy collective has created isometric pixel art cities since 1997, and 'Monument Valley' (2014) brought impossible illusions inspired by Escher. Today isometric lives on in illustration, infographics and low-poly 3D art.", "tecnica": "The three axes sit at 120° angles to each other and parallel lines remain parallel, with no vanishing point. Objects keep the same size regardless of distance, which gives a scale-model look. Scenes are shown as a cutaway block of a room, island or city, with soft lighting, long shadows and a controlled palette. The forms are clean, with sharp edges and no excessive texture. In pixel art, lines follow the 2:1 ratio."}, "pt": {"g": "Diorama isométrico em corte de um quartinho aconchegante flutuando sobre um fundo pastel limpo, projeção de 30 graus, móveis e plantas em miniatura, sombras longas e suaves, arestas nítidas, paleta harmoniosa e limitada, visual charmoso de asset de jogo", "m": "Retrato elegante de uma jovem sul-asiática de cabelos longos e escuros segurando um vaso com flores lilás, vermelhas e amarelas, ilustração isométrica em miniatura, diorama minúsculo de um quarto com uma mulher e um vaso de flores, projeção de 30 graus, arestas limpas e nítidas, sombras suaves, paleta pastel limitada"}},
 "Kawaii": {"en": {"nome": "Kawaii / Chibi", "periodo": "1970 to the present, Japan", "mestres": ["Sanrio (Hello Kitty, 1974)", "Osamu Tezuka (1928–1989)", "Naoko Takeuchi (b. 1967)", "San-X (Rilakkuma, 2003)", "Takashi Murakami (b. 1962)"], "caracteristicas": "Childlike proportions, big head, big eyes, simple little face, pastel colors, sparkle and exaggerated cuteness.", "historia": "'Kawaii' means 'cute' in Japanese, and the culture of cuteness gained strength in the 1970s, with the round handwriting of teenagers and with Sanrio, which launched Hello Kitty in 1974. Osamu Tezuka, creator of 'Astro Boy', popularized the big eyes of manga, and 'chibi' (shorty) describes versions of characters with an enormous head and small body. Takashi Murakami brought this aesthetic into contemporary art in the Superflat movement. The look spread to fashion, games and messaging-app stickers, becoming universal.", "tecnica": "Proportions are baby-like: head about half the body, short and chubby limbs, a face with big, shiny eyes and a tiny mouth. Shapes are rounded, with thick, soft outlines. The palette uses pastel tones (pink, baby blue, lilac, mint) and accents of sparkle, stars and hearts. Simple backgrounds, with confetti and sweets. The expression is sweet and simple, with blush on the cheeks."}, "pt": {"g": "Grupo de mascotes kawaii chibi de um coelhinho redondo e uma nuvem sonolenta dividindo um bolo de morango, cabeça enorme e corpo rechonchudo, olhos enormes e cintilantes com boquinha minúscula, contornos grossos e suaves, paleta pastel de rosa, menta e lavanda, brilhos, corações e granulado", "m": "Retrato elegante de uma jovem japonesa de maria-chiquinhas pretas segurando um vaso com flores lilás, vermelhas e amarelas, ilustração kawaii chibi, cabeça enorme e corpo minúsculo, olhos enormes e cintilantes, boquinha minúscula e bochechas coradas, contornos grossos e suaves, paleta pastel de rosa e lavanda, brilhos e corações, flores gordinhas"}},
 "Art Toy": {"en": {"nome": "Art Toy / Vinyl", "periodo": "Late 1990s to the present, Hong Kong, Japan and the USA", "mestres": ["Michael Lau (b. 1970)", "KAWS (Brian Donnelly, b. 1974)", "Medicom Toy (Bearbrick, 2001)", "Kidrobot (2002)", "Pop Mart (2010)"], "caracteristicas": "Glossy vinyl figures, rounded forms, X or plain eyes, solid colors and a collectible-toy finish.", "historia": "'Designer toys' emerged in Hong Kong, with Michael Lau's 'Gardener' figures (1997), and went global with companies such as Medicom (Bearbrick, 2001) and Kidrobot (2002). Street and design artists, such as KAWS, turned characters into limited editions sold in galleries and at auctions. The 'blind box' format, with surprise boxes, popularized by Pop Mart from 2010, made the art toy a collecting phenomenon. The aesthetic migrated into illustration, fashion and the 3D of AI prompts.", "tecnica": "Figures are molded in vinyl or resin and painted with smooth, glossy or matte finishes. The design uses simple, large, rounded silhouettes, minimalist eyes (an X, a dot or giant pupils) and a few solid colors. The clean look shows mold seams and crisp paint. Product photographs display the toy on a plain background, with studio lighting, soft reflection and shallow depth of field, as in a collectors' catalog."}, "pt": {"g": "Foto de produto em estúdio de um brinquedo de design em vinil brilhante, um personagem rechonchudo parecido com um urso com olhos em forma de X e membros arredondados, corpo sólido rosa-pastel com aplicação de tinta nítida, reflexos suaves sobre fundo infinito, profundidade de campo rasa, visual de blind box colecionável", "m": "Retrato elegante de uma jovem negra de cabelos naturais curtos segurando um vaso com flores lilás, vermelhas e amarelas, figura de art toy de vinil de design, corpo arredondado e brilhante, olhos minimalistas de ponto, tinta sólida pastel, visual de blind box colecionável, iluminação de estúdio para produto, flores como acessórios esculpidos"}},
 "Tim Burton": {"en": {"nome": "Tim Burton Style", "periodo": "1982 to the present, United States", "mestres": ["Tim Burton (b. 1958)", "Henry Selick (b. 1952)", "Edward Gorey (1925–2000)", "Robert Wiene (1873–1938), director of 'The Cabinet of Dr. Caligari' (1920)", "Dr. Seuss (1904–1991)"], "caracteristicas": "Quirky gothic, thin figures with sunken eyes, spirals and twisted trees, black, white and purple palette.", "historia": "Tim Burton began as an animator at Disney, and his early shorts, such as 'Vincent' (1982), already showed his morbid and melancholy universe. Films such as 'Beetlejuice' (1988), 'Edward Scissorhands' (1990), 'The Nightmare Before Christmas' (1993, directed by Henry Selick from his story) and 'Corpse Bride' (2005) consolidated a style of his own. Influences include German Expressionism, Vincent Price's B horror films, and the illustrations of Edward Gorey and Dr. Seuss. The look is widely imitated because it is so recognizable.", "tecnica": "Figures have thin, elongated bodies, big heads, dark, deep-set eyes with dark circles, spiky hair and slender hands. The sets use distorted perspectives, spiral staircases, crooked houses and twisted trees under enormous moons. The palette is limited to black, white and gray, with accents of purple, red or acid green, and stripes and spirals. The atmosphere mixes humor, melancholy and tenderness for strange, misunderstood creatures. In stop-motion, articulated puppets with fabric and wood textures are used."}, "pt": {"g": "Subúrbio gótico caprichoso com casas tortas e árvores retorcidas sem folhas sob uma lua enorme e em espiral, colinas em espiral e detalhes listrados em preto e branco, uma figura pálida e esquelética com olhos escuros fundos e cabelos selvagens, paleta dessaturada com acentos violeta, humor macabro e melancólico", "m": "Retrato elegante de uma jovem pálida e esquelética de cabelos pretos desgrenhados segurando um vaso com flores lilás, vermelhas e amarelas, ilustração gótica macabra e caprichosa, mulher pálida e esquelética com enormes olhos escuros e fundos e cabelos pretos desgrenhados, vestido listrado, árvores retorcidas em espiral, paleta dessaturada com acentos violeta, charme melancólico"}},
 "Pop Surrealism": {"en": {"nome": "Pop Surrealism (Lowbrow)", "periodo": "Late 1960s to the present, United States (California)", "caracteristicas": "A mix of kitsch, surrealism and pop culture, enormous eyes, candy tones, mysterious symbolism and a polished oil finish.", "historia": "The movement emerged in California, out of hot rod culture, underground comics (Zap Comix, 1968) and Surrealism. Robert Williams, who coined the term 'Lowbrow' (low-ranking art, as opposed to high art), published 'The Lowbrow Art of Robt. Williams' (1982) and in 1994 founded Juxtapoz magazine. Mark Ryden, with the exhibition 'The Meat Show' (1998), became the best-known name in the genre. The scene fed on the internet and independent galleries and became known as Pop Surrealism, with works that combine strangeness and childlike charm.", "tecnica": "The paintings, usually in oil or acrylic on wood or canvas, are smooth and polished, with an almost photographic finish and candy colors. The figures (big-eyed girls, animals, robots and creatures) appear in unreal settings, surrounded by symbols and references to advertising, toys and horror. There is a contrast between cuteness and unease: a sweet setting with sinister details. The composition is often symmetrical, almost like an official portrait or an altar."}, "pt": {"g": "Pintura a óleo brilhante sobre painel de madeira de uma menina de olhos de corça com vestido rosa-doce segurando um ursinho de pelúcia em forma de carne, cercada por caveiras de desenho animado, balões e pequenas criaturas estranhas, paleta saturada de chiclete e azul-petróleo, acabamento liso e polido, composição simétrica como um altar, fofo e perturbador", "m": "Retrato elegante de uma jovem de chanel preto brilhante e pele de porcelana segurando um vaso com flores lilás, vermelhas e amarelas, pintura pop surrealista lowbrow, enormes olhos brilhantes de corça, pele de porcelana, paleta de rosa-chiclete e azul-petróleo, pequenas criaturas estranhas e balões entre as flores, acabamento a óleo liso e polido, fofo e perturbador"}},
 "Cyberpunk": {"en": {"nome": "Cyberpunk", "periodo": "Science fiction literature from 1984 (Neuromancer, by William Gibson); visual aesthetic consolidated in the 1980s–90s", "mestres": ["Syd Mead (1933–2019)", "Katsuhiro Otomo (b. 1954)", "Simon Stålenhag (b. 1984)", "Josan Gonzalez", "Ridley Scott, director of Blade Runner (b. 1937)"], "caracteristicas": "Technological, dystopian future, neon lights, holograms, rain and urban settings.", "historia": "The term 'cyberpunk' was coined by Bruce Bethke as the title of a short story published in 1980, but the genre only consolidated as a movement with 'Neuromancer' by William Gibson (1984) — the first novel to win the Hugo, Nebula and Philip K. Dick awards in the same year. Gibson had already introduced the term 'cyberspace' in the short story 'Burning Chrome' (1982). The genre flourished in the 1980s as a reaction to distrust of megacorporations and to punk culture, imagining urban futures where high technology coexists with low quality of life. Cinema consolidated the aesthetic visually with Ridley Scott's 'Blade Runner' (1982), a mandatory reference for the genre.", "tecnica": "Palettes dominated by saturated neon — pink, cyan and purple — in contrast with dark, rainy and polluted settings, recalling noir applied to the future. Vertical megacities covered in luminous signs, advertising holograms and exposed cables suggest a chaotic, unregulated technological infrastructure. Characters often wear visible cybernetic implants, mechanical prostheses and clothes that mix leather, plastic and tech accessories. The composition favors low, vertical framings that reinforce the oppressive scale of corporations over the individual, with artificial light almost entirely replacing natural light."}, "pt": {"g": "Beco de megacidade encharcado de chuva lotado de letreiros holográficos verticais em japonês e chinês, neon magenta e ciano refletindo no asfalto molhado, vapor, cabos emaranhados, silhueta solitária sob um guarda-chuva transparente, distopia de alta tecnologia e solidão", "m": "Retrato cyberpunk elegante de uma jovem loira segurando um pote high-tech luminoso com flores bioluminescentes lilás, vermelhas e amarelas, reflexos de neon, cenário futurista chuvoso ao fundo"}},
 "Steampunk": {"en": {"nome": "Steampunk", "periodo": "Term coined in 1987; aesthetic set in the Victorian era (19th century)", "mestres": ["Jules Verne (1828–1905)", "Daniel Merriam (b. 1963)", "Jake von Slatt", "Hayao Miyazaki, director of Howl's Moving Castle (b. 1941)"], "caracteristicas": "19th-century steam technology (Victorian Era) with bronze and copper gears.", "historia": "The term 'steampunk' was coined in 1987 by the writer K.W. Jeter, in a letter to Locus magazine, as a joke referencing cyberpunk, to describe the works of alternate Victorian fiction he wrote alongside Tim Powers and James Blaylock. Although the name is recent, its roots go back to the 19th-century science fiction of Jules Verne and H.G. Wells, who imagined advanced steam-powered technologies within the sensibility of the Industrial Revolution. The genre became popular in the 1990s and 2000s, spreading from literature to games, film, fashion and design, always reimagining a 19th century in which steam technology advanced beyond what happened historically.", "tecnica": "Exposed gears, valves, brass and copper piping and steam-powered mechanisms replace modern electronics, always with a visible handcrafted finish. The palette tends toward sepia, gold and reddish-brown, recalling aged metals and fine wood. Costumes draw on Victorian fashion — waistcoats, long coats, bustle skirts, goggles and top hats — combined with mechanical prostheses and accessories. Settings include airships, ornate locomotives and laboratories full of brass instruments, reinforcing the fusion of historical elegance and retro technological invention."}, "pt": {"g": "Um dirigível rebitado de latão atracando em uma torre vitoriana enfumaçada, engrenagens expostas, tubulações de cobre liberando vapor, luz de lampião em sépia e ouro, couro polido e óculos de proteção, o assombro tátil da Revolução Industrial", "m": "Retrato steampunk elegante de uma jovem loira em traje vitoriano segurando um pote de latão, mecanismo de relojoaria por dentro alimentando flores lilás, vermelhas e amarelas com pétalas de cobre, engrenagens"}},
 "Synthwave": {"en": {"nome": "Synthwave / Retrowave", "periodo": "Music genre that emerged in the mid-2000s; 1980s retro aesthetic popularized from 2010", "caracteristicas": "1980s aesthetic, perspective grids, neon colors (pink/purple) and chrome sunsets.", "historia": "As a music and aesthetic genre, synthwave emerged in the mid-2000s in France and Western Europe, with artists such as College and Kavinsky recreating the sound of film and TV soundtracks from the 1980s. The aesthetic draws directly on references such as Vangelis's score for 'Blade Runner' (1982), Jan Hammer's 'Miami Vice' theme and John Carpenter's synth scores, building a nostalgia for a future imagined in the 80s. From the 2010s, the visual style became popular through album covers, music videos and games such as 'Far Cry 3: Blood Dragon' and 'Hotline Miami', consolidating a retro-futurist imaginary.", "tecnica": "Vibrant gradients of pink, purple and electric blue dominate the sky, often with a geometric sun setting on the horizon. Perspective grids stretching to the horizon recall the primitive computer graphics aesthetic of the 80s. Silhouettes of cars, palm trees or human figures appear backlit against this backdrop, while scanlines, neon glow and slight VHS grain reinforce the retro texture. Typography in futuristic fonts with neon outlines and chrome reflections completes the composition."}, "pt": {"g": "Um carro esportivo cromado correndo em direção a um sol gigante listrado sobre uma grade wireframe magenta brilhante, céu em gradiente de violeta a laranja, scanlines e bloom, silhuetas de palmeiras, solidão nostálgica de uma viagem noturna dos anos 1980", "m": "Retrato synthwave elegante de uma jovem loira segurando um pote cromado retrofuturista com flores neon vibrantes lilás, vermelhas e amarelas, fundo retrô de pôr do sol com grade dos anos 1980, brilho neon"}},
 "Solarpunk": {"en": {"nome": "Solarpunk", "periodo": "Term created in 2008, consolidated as a movement from 2014", "caracteristicas": "Optimistic, ecological future focused on sustainability, clean energy and plants in the structures.", "historia": "The term 'solarpunk' emerged in 2008 on the blog 'Republic of the Bees', inspired by a cargo ship partly powered by wind, but the concept remained marginal until it gained strength in 2014, when Adam Flynn's essay 'Solarpunk: Notes toward a manifesto' articulated its core ideas. In 2019, a collective manifesto consolidated the movement as a current of speculative fiction, art and activism that asks what a sustainable civilization would look like — and how to reach it. Unlike the pessimism of cyberpunk, solarpunk proposes post-scarcity futures in which clean energy, nature and technology coexist in harmony, influenced by environmentalist and regenerative design movements.", "tecnica": "Organic architecture that integrates vegetation into buildings — green roofs, living facades and structures that resemble natural forms — replaces the raw concrete of dystopian fiction. Solar panels, wind turbines and water-collection systems appear integrated into the design, never hidden. The palette is luminous, dominated by greens, golds and earthy tones under abundant, diffuse sunlight, evoking optimism. Compositions tend to show communities, open-air markets and vertical cities covered in gardens, with a general feeling of serenity and abundance rather than scarcity."}, "pt": {"g": "Cidade em terraços de torres verdes vivas, turbinas eólicas e pétalas de vidro solar, jardins suspensos e canais de água, sol quente da manhã atravessando as folhas, pessoas partilhando comida num terraço, comunidade luminosa e esperançosa", "m": "Retrato solarpunk elegante de uma jovem loira segurando um pote de vidro ecológico cheio de flores frescas e sustentáveis lilás, vermelhas e amarelas, fundo de cidade verde do futuro banhada de sol"}},
 "Dieselpunk": {"en": {"nome": "Dieselpunk", "periodo": "Term coined in 2001; aesthetic set between 1910 and 1950", "mestres": ["Fritz Lang, director of Metropolis (1890–1976)", "Ian McQue", "Sergey Kolesnikov (b. 1967)", "Tom Hardy (b. 1977)", "Hugh Ferriss (1889–1962)"], "caracteristicas": "Heavy industrial aesthetic based on the interwar period (1920s–1940s), metal and smoke.", "historia": "The term 'dieselpunk' was formally coined in 2001 by the game designer Lewis Pollak, to describe his tabletop RPG 'Children of the Sun', seeking to name an aesthetic distinct from and darker than steampunk's. The genre is set in the interwar period, roughly between World War I and the 1950s, when diesel engines and mass industrial production dominated the Western technological imaginary. Unlike the Victorian optimism of steampunk, dieselpunk absorbs the aesthetics and political tension of the 1920s to 1950s, incorporating visual influences from Art Deco, Streamline Moderne and Soviet Constructivism.", "tecnica": "Heavy industrial machines, propeller planes, zeppelins and armored vehicles with aerodynamic lines dominate the compositions, with a robust metallic finish rather than an ornamented one. The palette combines earth tones, khaki and rust with matte metallic accents, evoking factories, hangars and battlefields. The lighting is usually dramatic and high-contrast, with smoke and harsh industrial light reinforcing a tense, warlike atmosphere. Art Deco graphic elements — stepped geometric lines and angular typography — appear on posters, uniforms and control panels."}, "pt": {"g": "Um colossal trem blindado rebitado rastejando por um vale industrial negro de fuligem, aço manchado de óleo, chaminés e holofotes, ferrugem e graxa pesadas, paleta dessaturada de verde-oliva e ferrugem, aspereza opressiva de tempos de guerra", "m": "Retrato dieselpunk elegante de uma jovem loira usando equipamento retrô de aviadora, segurando um pesado pote industrial de aço com flores ousadas lilás, vermelhas e amarelas, leve fuligem de óleo, estilo deco de metal escuro"}},
 "Dark Fantasy": {"en": {"nome": "Gothic / Dark Fantasy", "periodo": "Term 'dark fantasy' coined in the 1970s; roots in medieval Gothic architecture (12th–15th century) and in the Gothic literature of the 18th–19th centuries", "caracteristicas": "Somber, melancholy atmosphere, pointed medieval architecture and a dark color palette.", "historia": "The term 'dark fantasy' was coined in the 1970s by the writer Karl Edward Wagner, but its roots go back to the Gothic literature of the 18th and 19th centuries, with authors such as Mary Shelley, Bram Stoker and Edgar Allan Poe, who blended supernatural elements with atmospheres of decay and death. Medieval Gothic architecture, which arose in 12th-century France with pointed arches, ribbed vaults and monumental stained glass, provides the visual repertoire that the dark fantasy aesthetic reinterprets. In the 20th century, authors such as H.P. Lovecraft deepened this macabre tradition, later absorbed by role-playing games, dark fantasy literature and film, consolidating an imaginary of ruined cathedrals and morally ambiguous heroes.", "tecnica": "Ruined pointed-arch architecture, gargoyles, broken stained glass and imposing towers make up settings dominated by a dark palette, with occasional accents of blood red or deep purple. The lighting is almost always low-key, coming from candles, moonlight or narrow slits, creating dense shadows and dramatic contrasts. Fog, ravens, bones and heavy, torn fabrics reinforce an atmosphere of decay and imminent danger. The ornamentation is carved and somber, with a rigorous symmetry that recalls the grandeur and dread associated with medieval cathedrals."}, "pt": {"g": "Uma catedral em ruínas de pináculos engolida por névoa fria, um andarilho solitário encapuzado, paleta de cinza-cinzas e violeta arroxeado, pedra apodrecida e corvos, tênue brilho de brasa, melancolia e pavor esmagadores", "m": "Retrato elegante de dark fantasy de uma jovem loira em renda preta, segurando um pote gótico ornamentado com flores lilás profundo, vermelho escuro e amarelo pálido, névoa sinistra, atmosfera sombria"}},
 "Cosmic Horror": {"en": {"nome": "Cosmic Horror", "periodo": "Consolidated by H.P. Lovecraft in the 1920s–1930s; visual aesthetic expanded in the 21st century", "mestres": ["H. P. Lovecraft (1890–1937)", "Zdzisław Beksiński (1929–2005)", "Wayne Barlowe (b. 1958)", "Jon Foster", "John Carpenter (b. 1948)"], "caracteristicas": "Monsters with tentacles, inexplicable colossal architecture and fear of the unknown (Lovecraft).", "historia": "Cosmic horror was synthesized by H.P. Lovecraft (1890-1937) in the philosophy he called 'cosmicism', although elements of the subgenre existed almost a decade before him, in authors such as Edgar Allan Poe, Arthur Machen and Lord Dunsany. Cosmicism is an atheist worldview that defines humanity as an insignificant detail within a vast, ancient universe indifferent to human existence. In tales such as 'The Call of Cthulhu' (1928), Lovecraft fused these ideas into a genre in which the true horror comes not from monsters who want to kill, but from the revelation of cosmic truths too great for the human mind to bear.", "tecnica": "Tentacular forms, asymmetrical anatomies and non-Euclidean geometries suggest entities that defy ordinary human logic and perception. The scale is deliberately disproportionate and monumental, making human figures look tiny before colossal structures or creatures. The palette tends toward somber tones — ocean green, deep purple, bluish gray — associated with dampness, the oceanic abyss and decay. The lighting usually reveals less than it hides, leaving crucial parts of the scene in the penumbra to sustain the feeling of mystery and unspeakable terror."}, "pt": {"g": "Um minúsculo farol diante de uma forma titânica e tentacular emergindo de um oceano negro, arquitetura impossível e não euclidiana no horizonte, céu de um verde doentio, escala enorme contra a insignificância humana, pavor paralisante", "m": "Retrato de horror cósmico elegante e perturbador de uma jovem loira segurando um pote, as flores lilás, vermelhas e amarelas têm sutis detalhes em forma de olhos e geometria lovecraftiana, luz de estrelas sinistra"}},
 "Biomecânico": {"en": {"nome": "Biomechanical", "periodo": "Consolidated from 1979, with H.R. Giger (the film Alien)", "mestres": ["H. R. Giger (1940–2014)", "Zdzisław Beksiński (1929–2005)", "Hajime Sorayama (b. 1947)", "Shinya Tsukamoto, director of Tetsuo (b. 1960)"], "caracteristicas": "Organic fusion between living biology (bones/muscles) and cold machines (H.R. Giger / Alien style).", "historia": "The biomechanical style was consolidated by the Swiss artist H.R. Giger, known for airbrush paintings that fused human anatomy and mechanical components in a cold, organic-machine relationship. Its global popularization came in 1979, when Giger designed the creature for the film 'Alien', inspired by his painting 'Necronom IV', work that earned him the Oscar for Best Visual Effects in 1980. From there, the biomechanical spread to album covers, tattoos and creature design in games and in science fiction and horror cinema, becoming one of the most popular contemporary tattoo styles.", "tecnica": "Organic tissue — muscles, tendons, exposed flesh — fuses visually with tubes, pistons, gears and metal plates, with no clear line separating body from machine. Surfaces alternate between a wet, viscous sheen and matte metallic reflections, suggesting that both materials belong to the same organism. The palette is predominantly dark, in grays, black and graphite, punctuated by silvery highlights. Sinuous, elongated, exoskeletal forms replace conventional human outlines, with dramatic, raking lighting that accentuates textures and recesses."}, "pt": {"g": "Um corredor semelhante a uma catedral de vértebras, tubos nervurados e metal preto oleoso fundido com osso e tendão, cinzas monocromáticos de aerógrafo, brilho doentio, biologia úmida e fria se fundindo com maquinário, erótico e ameaçador", "m": "Retrato biomecânico elegante de uma jovem loira, suas mãos se fundindo em um pote metálico orgânico segurando flores sintéticas lilás, vermelhas e amarelas feitas de cabos e pétalas, estilo H.R. Giger"}},
 "Vaporwave": {"en": {"nome": "Vaporwave", "periodo": "2010 to the present, internet", "mestres": ["Macintosh Plus (Floral Shoppe, 2011)", "Oneohtrix Point Never (Daniel Lopatin, b. 1982)", "James Ferraro", "Vektroid", "Hiroshi Nagai (b. 1947), city pop illustrator"], "caracteristicas": "Greek statues, pink and cyan, palm trees, Windows 95 windows, Japanese text and ironic nostalgia for the 80s and 90s.", "historia": "Vaporwave emerged in 2010–2011 as an internet music and visual genre, on forums and Tumblr. In 2010, Daniel Lopatin released, as Chuck Person, the album 'Eccojams Vol. 1', and in 2011 Macintosh Plus's album 'Floral Shoppe' became the icon of the genre. Mixing praise of shopping-mall consumerism, the aesthetic took elements from Japanese city pop covers (such as those by Hiroshi Nagai), corporate advertising and retro technology. The look became one of the most recognizable on the internet, with remixes in memes and fashion.", "tecnica": "The palette gathers hot pink, cyan, lilac and sunset orange, in gradients. The elements are marble busts (Helios, Venus), palm trees, perspective grids, Windows 95, retro suns, dolphins and VHS with noise. Text appears in katakana or Chinese characters, with captions such as 'ａｅｓｔｈｅｔｉｃ'. The screen is overlaid with glitch, scanlines and tape grain. The composition is calm, symmetrical and unhurried, with an ironic tone."}, "pt": {"g": "Degradê de pôr do sol rosa e ciano sobre um piso xadrez, um busto grego de mármore branco com óculos escuros, palmeiras, sol de grade retrô, painéis flutuantes de janelas do Windows 95, texto vertical em katakana, scanlines de VHS e ruído de glitch, estética nostálgica de shopping", "m": "Retrato elegante de uma jovem japonesa de cabelos longos e pretos segurando um vaso com flores lilás, vermelhas e amarelas, estética vaporwave, pôr do sol em degradê rosa e ciano, estátua grega de mármore e palmeiras, grade retrô, painéis de janela flutuantes com glitch, texto em katakana, scanlines de VHS, nostalgia onírica"}},
 "Atompunk": {"en": {"nome": "Atompunk", "periodo": "Aesthetic of 1945 to 1965, United States and Soviet Union (recent name)", "mestres": ["Chesley Bonestell (1888–1986)", "John Lautner (1911–1994), Googie architecture", "Eero Saarinen (1910–1961)", "Saul Bass (1920–1996)", "Hanna-Barbera (The Jetsons, 1962)"], "caracteristicas": "Space Age optimism, cars with tail fins, rockets, atomic furniture, turquoise and orange colors and retro typography.", "historia": "The term atompunk is recent, applied to the aesthetic that emerged after World War II and the explosion of the atomic bomb, when the world believed in a future of progress, nuclear power and space conquest. Chesley Bonestell painted planets and spaceships for magazines and for Wernher von Braun; the Googie architecture of gas stations and motels, with slanted roofs and boomerang shapes, and the series 'The Jetsons' (1962) show the same optimism. Games such as 'Fallout' (1997) revisited this aesthetic in a dystopian key. The mix of enthusiasm and nuclear fear is the heart of the genre.", "tecnica": "The palette combines turquoise, orange, mustard yellow, cherry red and cream. The forms are aerodynamic, with rocket curves, atomic starbursts (atom models), boomerangs and flying saucers. Products have chrome, glossy plastics and large buttons. The typography is retro script and geometric sans serif. Illustrators use airbrush and gouache in posters and ads, with smiling characters and futuristic domestic scenes."}, "pt": {"g": "Cozinha suburbana da era espacial dos anos 1950, a cozinha do amanhã, padrões atômicos em forma de bumerangue, eletrodomésticos cromados com aletas de foguete, paleta de turquesa e vermelho-cereja, uma família sorridente ao lado de uma torradeira com formato de pistola de raios e um disco voador fora da janela, ilustração publicitária retrô feita com aerógrafo", "m": "Retrato elegante de uma jovem ruiva com penteado cacheado dos anos 1950 segurando um vaso com flores lilás, vermelhas e amarelas, ilustração publicitária retrofuturista atompunk dos anos 1950, paleta de turquesa e vermelho-cereja, padrões atômicos em explosão estelar, adereços cromados da era espacial, pose de dona de casa sorridente, visual de guache com aerógrafo"}},
 "Biopunk": {"en": {"nome": "Biopunk", "periodo": "1980s to the present", "mestres": ["Paolo Bacigalupi (b. 1972)", "Margaret Atwood (b. 1939)", "David Cronenberg (b. 1943)", "Paul Di Filippo (b. 1954)", "Andrew Niccol (b. 1964), director of 'Gattaca' (1997)"], "caracteristicas": "Wet labs, fused flesh and plant, bioluminescence, test tubes and genetic engineering in acid-green tones.", "historia": "Biopunk is an offshoot of cyberpunk that swaps computing for biotechnology. The term appeared in the 1980s–90s, in stories such as those by Paul Di Filippo ('Ribofunk'), and became established with works such as Margaret Atwood's 'Oryx and Crake' (2003) and Paolo Bacigalupi's 'The Windup Girl' (2009). In film, David Cronenberg explores mutant flesh in films such as 'The Fly' (1986) and 'eXistenZ' (1999), and 'Gattaca' (1997) imagines a society divided by genetics. The theme reflects real concerns about genetic engineering, patents on life and pandemics.", "tecnica": "Visually, it mixes the aseptic laboratory and the organic body: Petri dishes, vats of liquid, translucent tubes, syringes, magnified cells, pulsing tissues and membranes. The palette uses acid green, yellow, flesh pink and lab blue, with bioluminescent, translucent light. Textures are wet, glossy and slightly repulsive: veins, fungi, flowers sprouting from machines. Settings combine decaying city and greenhouses, with living materials in place of metal and circuits."}, "pt": {"g": "Interior de laboratório genético subterrâneo com cubas translúcidas luminosas de criaturas embrionárias flutuando, vinhas e tubulações venosas semelhantes a carne crescendo pelo maquinário, bioluminescência verde-ácido e amarelo doentio, texturas úmidas e brilhantes, placas de Petri e seringas, atmosfera distópica de biotecnologia", "m": "Retrato elegante de uma jovem sul-asiática de cabelos escuros segurando um vaso com flores lilás, vermelhas e amarelas, estilo biopunk, pele translúcida com veias levemente luminosas, orquídeas brotando da manga, vidrarias de laboratório e cubas ao fundo, luz bioluminescente verde-ácido, texturas orgânicas úmidas"}},
 "Afrofuturismo": {"en": {"nome": "Afrofuturism", "periodo": "1950s to the present; term coined by Mark Dery in 1993", "mestres": ["Sun Ra (1914–1993)", "Octavia E. Butler (1947–2006)", "Wangechi Mutu (b. 1972)", "Ruth E. Carter (b. 1960), costume designer of 'Black Panther'", "Nnedi Okorafor (b. 1974)"], "caracteristicas": "African technology and ancestry, vibrant fabrics and prints, gold, cosmos, futuristic cities and Black pride.", "historia": "Afrofuturism imagines futures in which Black people are protagonists of technology, science and the cosmos. The term was coined in 1993 by the critic Mark Dery, but its roots lie in the music of Sun Ra (who said he came from Saturn), in the books of Octavia Butler and in Parliament-Funkadelic. Wangechi Mutu creates collages of hybrid bodies, and Nnedi Okorafor writes African science fiction. The film 'Black Panther' (2018), with costumes by Ruth E. Carter and sets by Hannah Beachler, took the style to a wide audience. In Brazil, the movement dialogues with artists and musicians who reimagine the diaspora.", "tecnica": "The look combines traditional African references (wax prints, kente cloth, gold jewelry, masks, scarification and braiding) with futuristic elements such as spaceships, glowing circuits, space suits and high-tech cities. The palette is of saturated colors, such as gold, red, purple and cobalt blue. The lighting is neon or cosmic, and the figures have a lofty bearing, of queens and explorers. Collages and geometric patterns recall ancestry and identity."}, "pt": {"g": "Majestosa metrópole africana futurista ao entardecer com torres douradas e padrões de circuitos luminosos, uma rainha-astronauta imponente em um traje espacial dourado com estampa kente e uma coroa de tranças escultural, dourado, cobalto e magenta saturados, motivos geométricos ancestrais, céu de nebulosa cósmica", "m": "Retrato elegante de uma jovem negra de cabelos naturais segurando um vaso com flores lilás, vermelhas e amarelas, retrato afrofuturista, pose imponente, coroa de tranças intrincada, joias de ouro e roupa futurista com estampa kente, motivos geométricos luminosos, fundo de nebulosa cósmica, dourado, cobalto e magenta saturados"}},
 "Fantasia Epica": {"en": {"nome": "Epic Fantasy / RPG (D&D)", "periodo": "1950s to the present", "mestres": ["Alan Lee (b. 1947)", "John Howe (b. 1957)", "Frank Frazetta (1928–2010)", "Larry Elmore (b. 1948)", "Todd Lockwood (b. 1957)"], "caracteristicas": "Dragons, castles and heroes, epic landscapes, detailed armor, dramatic light and painterly realism.", "historia": "Modern epic fantasy derives from J. R. R. Tolkien, whose 'The Hobbit' (1937) and 'The Lord of the Rings' (1954–55) defined elves, dwarves and Middle-earth. Frank Frazetta redefined cover painting in the 1960s–70s, with muscular barbarians and monsters. The game 'Dungeons & Dragons' (1974), by Gary Gygax and Dave Arneson, created a tradition of manuals illustrated by Larry Elmore and Todd Lockwood. Alan Lee and John Howe did the concept art for Peter Jackson's films (2001–2003). Today the style dominates book covers, games and collectible cards.", "tecnica": "The images are painted in oil or digitally, with a realistic, dramatic finish. Heroes have armor, capes, swords and spells; settings are ancient forests, mountains with castles and dragon caves. The composition is cinematic, with small figures before an immense landscape or heroic close-ups. The light is strong and contrasted (sunset, magical glow), and the colors are rich and earthy, with atmospheric haze. Details of metal, leather and scales lend credibility."}, "pt": {"g": "Pintura épica a óleo de um cavaleiro de armadura e uma feiticeira encapuzada enfrentando um dragão colossal empoleirado numa fortaleza de montanha em ruínas, céu tempestuoso de pôr do sol com feixes de luz, runas brilhantes, armadura de placas e escamas intricadas, realismo pictórico de capa de livro de fantasia, composição heroica e dramática", "m": "Retrato elegante de uma jovem de longos cabelos ruivo-escuros segurando um vaso com flores lilás, vermelhas e amarelas, pintura de capa de livro de fantasia épica, vestido e manto élficos ornamentados, flores encantadas e luminosas em um vaso de cristal, floresta antiga enevoada e castelo, luz dourada dramática, realismo pictórico"}},
 "Concept Art": {"en": {"nome": "Concept Art", "periodo": "Term born at the Disney studios in the 1930s, consolidated as a profession in film and games between 1977 and 1990", "mestres": ["Craig Mullins (b. 1964)", "Feng Zhu (b. 1977)", "Sparth (Nicolas Bouvier)", "Iain McCaig (b. 1957)", "Syd Mead (1933–2019)"], "caracteristicas": "High-quality professional illustration for media, rich in atmosphere, depth and light.", "historia": "The term 'concept art' emerged at the Disney studios in the 1930s, when artists such as Gustaf Tenggren and, later, Mary Blair created paintings to guide the look of films such as Snow White and Cinderella. The milestone that consolidated the profession in film was Ralph McQuarrie's work for Star Wars (1977), whose paintings helped convince the studio to fund the film before shooting even began. With the expansion of the video game industry from the 1980s–90s, artists who once drew covers and promotional materials began developing characters, settings and creatures before production, consolidating concept art as an essential pre-production stage in film, animation and games.", "tecnica": "Concept art prioritizes quick communication of ideas over polished finish: broad, gestural brushstrokes, with decisions on composition, light and atmosphere (mood) set in the very first studies, often in grayscale or a reduced palette before the final color. It is common to explore several variations (thumbnails) of the same character or setting in a short time, with layers of digital paint overlaid simulating texture and depth. The goal is not the work itself, but to guide 3D modelers, art directors and production teams on the look, scale and feel of an element before it exists physically."}, "pt": {"g": "Um dragão ancestral enroscado em torno de uma cidadela de montanha em ruínas ao nascer do sol, silhueta ousada, perspectiva atmosférica com névoa em camadas, luz de contorno, bordas soltas de pincel pictórico com detalhe focal controlado, escala épica e encantamento", "m": "Concept art de personagem elegante de uma jovem loira segurando um pote lindamente trabalhado com flores lilás, vermelhas e amarelas, iluminação de contorno cinematográfica, profundidade atmosférica, ilustração digital profissional"}},
 "Anime": {"en": {"nome": "Anime / Manga", "periodo": "Modern manga from 1952 (Osamu Tezuka); TV anime from 1963, Japan, with global expansion in the 1990s–2000s", "mestres": ["Hayao Miyazaki (b. 1941)", "Makoto Shinkai (b. 1973)", "Naoko Takeuchi (b. 1967)", "Akira Toriyama (1955–2024)", "Osamu Tezuka (1928–1989)"], "caracteristicas": "Contemporary Japanese animation style, expressive eyes and vibrant colors.", "historia": "Contemporary manga was shaped by Osamu Tezuka, considered the 'father of manga', whose work Astro Boy (Tetsuwan Atom), published from 1952, fused postwar Western scientific optimism with Japan's cultural reconstruction. Tezuka was openly influenced by Disney animation, and in 1963 he adapted Astro Boy for television, creating the country's first popular anime series and defining visual and narrative conventions that the genre would follow for decades. From the 1990s, franchises such as Dragon Ball, Sailor Moon and the Studio Ghibli films took this language to global audiences, consolidating a Japanese visual style recognizable around the world.", "tecnica": "The most recognizable hallmark of anime is the big, extremely expressive eyes, a device that Tezuka himself popularized to convey emotion with an economy of lines given the limitations of animation with few frames per second. Outlines are clean and well defined, with shading often applied in flat blocks (cel shading) rather than soft gradients, and the palette ranges from vibrant, saturated colors to pastel tones depending on the genre. Exaggerated facial expressions, stylized hair with pointed locks and elongated body proportions complete a visual language historically optimized for fast studio production."}, "pt": {"g": "Uma garota no topo de uma colina enquanto o vento agita seus cabelos e um céu de cúmulos imponentes brilha na hora dourada, traço limpo, cel shading chapado, olhos grandes e brilhantes com reflexos, linhas de velocidade, saudade agridoce", "m": "Retrato anime moderno e elegante de uma jovem loira de olhos expressivos, segurando um vaso de barro estilizado cheio de flores coloridas lilás, vermelhas e amarelas, belo cel shading, estilo Kyoto Animation"}},
 "Pixel Art": {"en": {"nome": "Pixel Art", "periodo": "Late 1970s to early 1980s, born from the hardware limitations of the first video games", "mestres": ["Hiroshi Yoshida (Square)", "Yoshitaka Amano, sprites (b. 1952)", "Paul Robertson (b. 1979)", "Eboy", "Mark Ferrari (b. 1956)"], "caracteristicas": "Digital art built block by block from pixels, simulating retro games (8-bit or 16-bit).", "historia": "Pixel art was not invented as an aesthetic choice, but imposed by the technical limitations of the first computers and consoles, whose video memory was measured in a few kilobytes and whose palettes rarely exceeded 16 simultaneous colors. The term 'pixel art' was formally coined in 1982, in a technical paper by the Xerox PARC researchers Adele Goldberg and Robert Flegal. Consoles such as the Atari 2600 (1977) and hits such as Pac-Man and Space Invaders, around 1980, consolidated this visual language as the standard of the so-called '8-bit era', which decades later would be deliberately reappropriated by indie developers as a nostalgic aesthetic choice.", "tecnica": "The image is built by hand on a visible grid of individual pixels, each placed deliberately to suggest detail with the least possible information. The color palette is purposely limited (often between 4 and 256 colors), without smoothing (anti-aliasing), which results in characteristic stair-stepped, 'jagged' diagonal outlines. Techniques such as dithering — mixing pixels of distinct colors to simulate intermediate tones — and sprites with few animation frames are trademarks of the style, which demands great visual economy to communicate recognizable shapes."}, "pt": {"g": "Uma taverna aconchegante à noite em pixel art de 16 bits, paleta limitada de 32 cores, pixels posicionados à mão, dithering para os degradês, sem anti-aliasing, bordas duras e nítidas, luz quente de fogueira contra sombras azuis, clima nostálgico de aventura", "m": "Retrato elegante em pixel art de 32 bits de uma jovem loira segurando um pote de flores detalhadas lilás, vermelhas e amarelas, sombreamento limpo, paleta de cores retrô estética, texturas de pixel altamente detalhadas"}},
 "Voxel Art": {"en": {"nome": "Voxel Art", "periodo": "Commercial games from 1992 (Comanche); popularized globally after Minecraft (2011)", "mestres": ["Eboy", "Notch (Markus Persson), creator of Minecraft (b. 1979)", "Ephtracy, creator of MagicaVoxel", "Ex Machina Voxel Artists"], "caracteristicas": "The 3D equivalent of pixel art; scenes and characters made of small cubes (Minecraft-style).", "historia": "The term 'voxel' (volume + pixel) describes a value on a regular three-dimensional grid, the 3D equivalent of the pixel. The first commercial games to use voxel-based rendering were titles such as Comanche (1992), which simulated terrain with 2D height grids projected as pseudo-3D landscapes, and later Outcast (1999), a pioneer in voxel surface rendering. The release of Minecraft in 2011 redefined the public's perception of what a 'block-based' game is, and the free editor MagicaVoxel, released in 2012, made the voxel art community grow as a creative movement independent of the games that popularized it.", "tecnica": "Models are built entirely from regular volumetric cubes (voxels) placed on a three-dimensional grid, analogous to pixel art but in three dimensions. Surfaces result in blocks without smooth curves, with simplified lighting that reinforces the geometric reading of the volumes. The technique allows an impressive level of detail at low computational cost compared to traditional 3D modeling, favoring rapid iteration — which is why it is popular both in building and simulation games and in original voxel illustration."}, "pt": {"g": "Um castelo em ilha flutuante construído com voxels cúbicos visíveis, câmera isométrica, tamanho uniforme dos cubos, faces com sombreamento chapado e oclusão ambiental suave, paleta brilhante de brinquedo, mundo em miniatura divertido", "m": "Renderização em voxel art elegante de uma jovem loira, lindamente construída com minúsculos cubos 3D, segurando um pote cúbico cheio de flores de blocos de baixa resolução lilás, vermelhas e amarelas, vista isométrica limpa"}},
 "Low Poly": {"en": {"nome": "Low Poly", "periodo": "Roots in 3D graphics of the 1970s–1990s; popularized as a deliberate style from around 2013", "caracteristicas": "Geometric 3D modeling with a reduced number of polygons, creating clean facets.", "historia": "The low poly aesthetic was born from the computational limitations of the first 3D graphics of the 1970s, but became visually iconic in the 1990s, when console and PC processors could only render a limited number of polygons per frame in real time — resulting in the faceted, angular models of games such as Super Mario 64 and Tomb Raider. Around 2013, content creators began to deliberately redefine the difference between high and low polygon counts, turning an old technical limitation into a conscious artistic choice, valued for focusing attention on essential form, light and color.", "tecnica": "Three-dimensional models are built with a reduced and deliberately visible number of polygons (triangles), resulting in flat, faceted surfaces instead of smooth curves. The lighting is usually soft and simplified, creating discrete color gradients across each face of the model, which reinforces the angular geometry rather than hiding it. The palette tends to be vibrant and flat, with landscapes, objects and characters reduced to their most essential geometric forms, keeping legibility and visual appeal even with little detail."}, "pt": {"g": "Um vale de montanha com um rio esculpido em triângulos de sombreamento chapado, facetas poligonais visíveis, cor sem degradê em cada face, luz direcional suave, calma geométrica nítida, minimalista e serena", "m": "Retrato 3D low-poly elegante de uma jovem loira, traços geométricos estilizados, segurando um pote poligonal facetado com flores geométricas lilás, vermelhas e amarelas afiadas, semelhantes a papel, iluminação limpa"}},
 "Pop Art": {"en": {"nome": "Pop Art", "periodo": "1952 to 1970, started in London (Independent Group) and consolidated in the United States", "caracteristicas": "Inspiration from pop culture, strong black outlines, saturated colors and printing halftones.", "historia": "Pop art was born in London in 1952 with the Independent Group, formed by artists such as Richard Hamilton and Eduardo Paolozzi, who discussed popular culture, science fiction, advertising and the new household appliances as legitimate subjects for art. Hamilton's collage 'Just What Is It That Makes Today's Homes So Different, So Appealing?' (1956) is often cited as the first work of the movement. In the United States, Andy Warhol moved from hand painting to silkscreen in the 1960s, using repetition to reflect mass consumption, while Roy Lichtenstein, starting with 'Look Mickey' (1961), appropriated the aesthetic of commercial comics, manually reproducing the Ben-Day dot pattern used in industrial printing.", "tecnica": "Flat, saturated, high-contrast colors replace the subtle tonal work of traditional painting, often bounded by thick, well-defined black outlines, as in printed comics. The Ben-Day dot pattern — a cheap commercial printing technique, reproduced by hand by artists such as Lichtenstein — simulates gradations of color and shadow through repetitive patterns of dots. Serial repetition of the same image, as in Warhol's silkscreened portraits, and direct appropriation of icons of advertising, packaging and mass-media celebrities are central hallmarks of the style."}, "pt": {"g": "Uma heroína de quadrinhos em pleno suspiro com um balão de fala, contornos pretos grossos, sombreamento de retícula com pontos Ben-Day, preenchimentos chapados nas primárias vermelho-amarelo-azul, desalinhamento mecânico de impressão, glamour de consumo estridente e irônico", "m": "Retrato pop art elegante de uma jovem loira segurando um pote de contorno marcante com flores lilás, vermelhas e amarelas altamente saturadas, estilo Andy Warhol, fundo com textura de pontos Ben-Day"}},
 "Minimalismo": {"en": {"nome": "Minimalism", "periodo": "Late 1950s through the 1960s, United States (New York)", "caracteristicas": "Reduction to the essential, restricted color palette, simple forms and ample negative space.", "historia": "Minimalism emerged in New York in the late 1950s and consolidated throughout the 1960s, as a direct reaction to Abstract Expressionism, which valued the artist's subjective and emotional expression. Frank Stella's 'Black Paintings' (1958-1960) are often pointed to as the first works to embody the principles of the movement, summed up in the artist's famous phrase: 'what you see is what you see'. Donald Judd, another central name, argued that art did not need symbolism or narrative — it should simply exist as an object, resulting in sculptures and installations of repeated boxes in serial arrangements.", "tecnica": "Minimalism strips the work of metaphor, narrative and commercial spectacle, turning to pure geometry, repetition and industrial materials. Simple geometric forms — hard-edged squares and rectangles — predominate, organized in mathematically regular, non-hierarchical compositions. The color palette is reduced, often monochrome, and large areas of empty space replace detailing, prioritizing the physical properties of the work (scale, weight, position and material) over any symbolic meaning."}, "pt": {"g": "Uma minúscula árvore escura na borda inferior de um vasto campo pálido e vazio, mais de oitenta por cento de espaço negativo, um único horizonte finíssimo, apenas dois tons suaves, perfeitamente imóvel, silêncio e solidão contemplativa", "m": "Retrato minimalista elegante de uma jovem loira, linhas simples e finas, segurando um pote abstrato e liso com hastes únicas lilás, vermelha e amarela, vasto fundo neutro e limpo, simplicidade elegante"}},
 "Pintura Digital": {"en": {"nome": "Digital Painting", "periodo": "Roots in 1963 (Sketchpad, MIT); popularized as a professional technique between the mid-1980s and 1990s", "caracteristicas": "Soft texture that emulates classical techniques made directly in modern software.", "historia": "The technical basis of digital painting goes back to 1963, when Ivan Sutherland created Sketchpad at MIT, making it possible to manipulate shapes on a CRT screen — which led to the creation of the first digitizing tablet (Rand Tablet, 1968). Software such as Dan Silva's Deluxe Paint (1985) and MacPaint (1984) popularized painting on personal computers, while Photoshop, created by Thomas Knoll in 1987 and originally called 'Display', would become the industry standard. With the advance of digitizing tablets and graphics tablets in the 1990s–2000s, digital painting matured from an experimental tool to a fully established professional technique in illustration, concept art and animation.", "tecnica": "Digital painting simulates physical brushstrokes, textures and paint mixing through programmable brushes, organized in layers that can be reordered, erased or adjusted without destroying earlier work — an advantage over traditional painting that allows unlimited undo and free experimentation. Precise control of light and shadow is done with layers using blending modes, allowing smooth color transitions or, alternatively, highly stylized finishes. The technique is versatile enough to produce both photorealistic results and expressive brushstrokes that imitate oil, watercolor or gouache."}, "pt": {"g": "Um cavaleiro de fantasia desgastado em close, bordas suaves de pincel digital personalizado, transições de pele mescladas, mudanças pictóricas de temperatura de cor entre luz principal quente e luz de preenchimento fria, pinceladas visíveis de blocagem, exaustão heroica silenciosa", "m": "Pintura digital elegante de uma jovem loira segurando um pote de cerâmica, flores detalhadas lilás, vermelhas e amarelas, pinceladas digitais suaves, iluminação perfeita, ilustração de belas-artes hiper-realista"}},
 "Arte Abstrata": {"en": {"nome": "Abstract Art", "periodo": "From 1910, with roots in earlier ornamental traditions; peak in the Russian and European avant-gardes until 1920", "caracteristicas": "Focus on geometric forms, textures and splatters with no intention of depicting the real world.", "historia": "Although abstract tendencies already existed in traditions that restricted the representation of human figures, such as Islamic and Jewish arts, 1910 is consensually pointed to as the birth year of modern abstract art, when Wassily Kandinsky painted a watercolor with no reference to recognizable objects. Kandinsky, who had synesthesia and perceived sounds as colors, published in 1912 the book 'Concerning the Spiritual in Art', giving abstract painting a theoretical basis by treating music as a model of expression through color and form. In 1915, the Russian Kazimir Malevich radicalized the proposal with Suprematism, reducing visual language to basic geometric forms, as in the iconic painting 'Black Square'.", "tecnica": "Abstract art deliberately breaks with any recognizable figurative reference, concentrating on composition, color, form and visual rhythm as ends in themselves. The technique can vary widely: from rigorously controlled geometric compositions, as in Malevich's Suprematism, to spontaneous, expressive gestures that would emerge decades later in American Abstract Expressionism. Color relationships, balance of visual masses and tension between forms replace narrative or recognizable motif as the central elements for reading the work."}, "pt": {"g": "Uma tela de gotejamentos gestuais, respingos e pinceladas cortantes em vermelho e preto saturados sobre linho cru, sem nenhum assunto reconhecível, energia corporal e espessura de tinta visíveis, emoção crua tornada física", "m": "Um retrato abstrato elegante que sugere uma jovem loira segurando um pote, explosões de respingos de tinta lilás, vermelha e amarela representando flores, tela texturizada, belas-artes não representacional"}},
 "Street Art": {"en": {"nome": "Graffiti / Street Art", "periodo": "From the early 1970s, New York and Philadelphia; expansion into art galleries in the 1980s", "caracteristicas": "Urban art made with spray, stencil and textures of brick or concrete walls.", "historia": "Modern graffiti emerged in the late 1960s and early 1970s in New York and Philadelphia, as a form of expression for young people from marginalized neighborhoods who sought to make their presence felt in the city. TAKI 183, a teenager from Washington Heights, is considered the first widely recognized tagger, having gained notoriety after a New York Times report in 1971 that brought this hitherto underground culture to the attention of the general public. In the late 1970s, Jean-Michel Basquiat tagged the streets of Manhattan under the pseudonym SAMO, alongside Al Diaz, before moving to art galleries in the 1980s together with names such as Keith Haring and Andy Warhol, raising graffiti to the status of an internationally recognized artistic language.", "tecnica": "The line is defined by thick, marked outlines, historically made with spray cans on public surfaces such as subway cars and walls. Lettering — the elaborate stylization of letters and signatures (tags) — is a central technical element, as is the use of vibrant, high-contrast colors to ensure legibility and impact at a distance. The work often dialogues with the texture, architecture and imperfections of the surface where it is applied, integrating the physical support into the composition in a way that traditional canvas painting normally does not allow."}, "pt": {"g": "Uma criança solitária em estêncil soltando um balão em um muro de tijolos rachado, estêncil de spray nítido em duas camadas, escorridos, halos de overspray, cartazes descascando ao redor, protesto desafiador e terno", "m": "Retrato de estêncil de street art elegante de uma jovem loira segurando um pote em um muro de concreto, flores lilás, vermelhas e amarelas pintadas com spray, escorridos de tinta vibrantes, obra-prima de grafite urbano"}},
 "Flat Design": {"en": {"nome": "Vector Flat Design", "periodo": "2010s to the present, digital design", "mestres": ["Josef Müller-Brockmann (1914–1996)", "Paul Rand (1914–1996)", "Microsoft (Metro design, 2010)", "Apple (iOS 7, 2013)", "Google (Material Design, 2014)"], "caracteristicas": "Flat, geometric shapes, solid colors, no shadows or textures, simple icons and clean typography.", "historia": "Flat design has roots in the International (Swiss) Typographic Style and in the Bauhaus. It gained strength in the digital era when Microsoft introduced the Metro language in Windows Phone 7 (2010) and Apple abandoned skeuomorphism in iOS 7 (2013) in favor of flat icons. Google's Material Design (2014) kept the idea, with subtle shadows for hierarchy. The aesthetic spread to editorial illustrations and infographics, and derived styles, such as 'Corporate Memphis' (Alegria), were used by tech companies in illustrations of people with elongated limbs.", "tecnica": "Elements built from simple geometric shapes (circles, rectangles, triangles), solid color fills and few or no shadows, gradients or textures. The palette is restricted and vibrant, with contrasting colors. Outlines are absent or very simple. Hierarchy comes from size, position and color, not from volume. In vector (SVG), the image scales without loss of quality. It works well as an icon, interface, infographic and editorial illustration."}, "pt": {"g": "Ilustração vetorial chapada de uma rua movimentada da cidade com prédios geométricos simples, preenchimentos de cor sólida sem degradês, sombras ou texturas, paleta vibrante e limitada de coral, azul-petróleo e amarelo girassol, formas minimalistas e limpas, estilo de infográfico editorial", "m": "Retrato elegante de uma jovem negra com coque afro segurando um vaso com flores lilás, vermelhas e amarelas, ilustração vetorial em flat design, mulher construída com formas geométricas simples, preenchimentos de cor sólida, sem degradês ou sombras, paleta vibrante e limitada, vaso e flores minimalistas e limpos"}},
