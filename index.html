<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estilos artísticos da história humana e como a IA os representa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
<script>
try{var _t=localStorage.getItem("tema");if(!/^(classico|claro|escuro|brutalismo|vidro|synthwave|nordico|bauhaus)$/.test(_t))_t=matchMedia("(prefers-color-scheme: light)").matches?"claro":"classico";document.documentElement.dataset.theme=_t}catch(e){document.documentElement.dataset.theme="classico"}
</script>
<style>
/* ===== Tokens e temas ===== */
:root{
 --fd:"Newsreader",Georgia,serif;--fb:"IBM Plex Sans",system-ui,sans-serif;
 --bg:#15171c;--panel:#1d2027;--panel2:#191c22;--line:#2c313b;--ink:#e9e6ef;--mute:#9b9aa8;
 --acc:#b8a2ea;--on-acc:#15171c;--acc2:#e46a6a;--yel:#e8c75a;--band:#222632;
 --r:12px;--rs:6px;--pill:999px;--bd:1px;--lw:1px;
 --sh:0 1px 3px rgba(0,0,0,.35);--shh:0 8px 22px rgba(0,0,0,.45);
 --hw:500;--hls:-.01em;--glow:none;--blur:none;--bgi:none;
 color-scheme:dark;
}
[data-theme=claro]{--bg:#f3f1f6;--panel:#fff;--panel2:#faf9fc;--line:#d9d5e2;--ink:#1b1a24;--mute:#6a687a;--acc:#6d4bc2;--on-acc:#fff;--acc2:#b83a3a;--yel:#7a5c00;--band:#ebe7f4;--sh:0 1px 3px rgba(40,30,80,.14);--shh:0 8px 22px rgba(40,30,80,.2);color-scheme:light}
[data-theme=escuro]{--fd:"IBM Plex Sans",system-ui,sans-serif;--hw:600;--hls:-.025em;--bg:#0c0c0e;--panel:#151518;--panel2:#111113;--line:#26262b;--ink:#ececf0;--mute:#8b8b95;--acc:#5ab0ff;--on-acc:#06121f;--acc2:#ff7a6b;--yel:#ffd166;--band:#1b1b21;--r:8px}
[data-theme=brutalismo]{--fd:"Space Grotesk",system-ui,sans-serif;--fb:"Space Grotesk",system-ui,sans-serif;--hw:700;--hls:-.03em;--bg:#fcd34d;--panel:#fff;--panel2:#fffdf3;--line:#000;--ink:#000;--mute:#3a3a3a;--acc:#ff3d81;--on-acc:#000;--acc2:#2d5bff;--yel:#000;--band:#a3e635;--r:0;--rs:0;--pill:0;--bd:2px;--lw:2px;--sh:3px 3px 0 #000;--shh:6px 6px 0 #000;color-scheme:light}
[data-theme=vidro]{--fd:"Jost",system-ui,sans-serif;--hw:500;--hls:-.01em;--bg:#0b1020;--panel:rgba(255,255,255,.075);--panel2:rgba(255,255,255,.04);--line:rgba(255,255,255,.17);--ink:#f1f4ff;--mute:#aab3d8;--acc:#8fd3ff;--on-acc:#05101f;--acc2:#ff9ad5;--yel:#ffe29a;--band:rgba(255,255,255,.11);--r:20px;--rs:12px;--sh:0 4px 16px rgba(5,8,30,.35);--shh:0 14px 34px rgba(5,8,30,.55);--blur:blur(16px) saturate(140%);
 --bgi:radial-gradient(60vw 55vh at 8% -5%,#5b3cc4 0%,transparent 62%),radial-gradient(55vw 55vh at 100% 8%,#0ea5e9 0%,transparent 58%),radial-gradient(70vw 60vh at 55% 105%,#db2777 0%,transparent 62%)}
[data-theme=synthwave]{--fd:"Space Grotesk",system-ui,sans-serif;--fb:"Space Grotesk",system-ui,sans-serif;--hw:700;--hls:-.02em;--bg:#0d0221;--panel:#1a0b3a;--panel2:#150833;--line:#3a1c71;--ink:#f5e8ff;--mute:#b79cd9;--acc:#ff2bd6;--on-acc:#12001f;--acc2:#00e5ff;--yel:#ffd319;--band:#2a0f5c;--r:6px;--rs:4px;--glow:0 0 14px color-mix(in srgb,var(--acc) 65%,transparent);--sh:0 0 0 1px #3a1c71;--shh:0 0 22px color-mix(in srgb,var(--acc) 55%,transparent);
 --bgi:linear-gradient(180deg,#0d0221 0%,#1b0540 55%,#2f0b5e 100%)}
[data-theme=nordico]{--fd:"Jost",system-ui,sans-serif;--hw:400;--hls:0;--bg:#eef1f4;--panel:#fafbfc;--panel2:#f3f6f8;--line:#d6dde4;--ink:#22303d;--mute:#667789;--acc:#3b6e8f;--on-acc:#fff;--acc2:#b4533c;--yel:#7d5f26;--band:#e3e9ef;--r:4px;--rs:3px;--sh:0 1px 2px rgba(34,48,61,.08);--shh:0 6px 16px rgba(34,48,61,.14);color-scheme:light}
[data-theme=bauhaus]{--fd:"Jost",system-ui,sans-serif;--fb:"Jost",system-ui,sans-serif;--hw:700;--hls:-.02em;--bg:#e8e8e8;--panel:#fff;--panel2:#f5f5f5;--line:#111;--ink:#111;--mute:#444;--acc:#d62828;--on-acc:#fff;--acc2:#0b4f9c;--yel:#111;--band:#f2b705;--r:0;--rs:0;--pill:0;--bd:2px;--lw:2px;--sh:none;--shh:4px 4px 0 #111;color-scheme:light}

/* ===== Base ===== */
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bgi),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.55 var(--fb)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ===== Topo: hero que recolhe + barra de uma linha ===== */
#top{flex:none;position:relative;z-index:20;background:var(--panel);border-bottom:var(--lw) solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.hero{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s ease}
.hero-in{overflow:hidden;min-height:0}
.hero-box{padding:26px 24px 16px;max-width:1180px}
#top.compact .hero{grid-template-rows:0fr}
h1{font:var(--hw) clamp(26px,3.4vw,42px)/1.08 var(--fd);letter-spacing:var(--hls);margin:0 0 10px;text-wrap:balance;text-shadow:var(--glow)}
.sub{color:var(--mute);margin:0;max-width:100ch;text-wrap:pretty}
.toolbar{display:flex;align-items:center;gap:10px;padding:9px 24px;flex-wrap:nowrap;min-height:56px}
.mini{flex:none;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;border:0;background:none;padding:0;cursor:pointer;font:var(--hw) 19px/1 var(--fd);letter-spacing:var(--hls);color:var(--ink);text-align:left;transition:max-width .28s ease,opacity .2s ease,margin .28s ease;text-shadow:var(--glow)}
#top.compact .mini{max-width:260px;opacity:1;margin-right:8px}
.mini:hover{color:var(--acc)}
.search{position:relative;flex:1 1 280px;min-width:110px;max-width:460px}
.search svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--mute);pointer-events:none}
input[type=search]{width:100%;background:var(--panel2);border:var(--bd) solid var(--line);color:var(--ink);padding:9px 12px 9px 34px;border-radius:var(--rs);font:inherit;font-size:14px}
input[type=search]::placeholder{color:var(--mute)}
#cnt{flex:none;color:var(--mute);font-size:13px;white-space:nowrap}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;color:var(--mute);font-size:13px;user-select:none;white-space:nowrap}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .trk{width:34px;height:20px;border-radius:var(--pill);background:var(--line);position:relative;transition:background .15s;flex:none;border:var(--bd) solid transparent}
.sw .trk::after{content:"";position:absolute;top:2px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:transform .15s}
.sw input:checked+.trk{background:var(--acc)}
.sw input:checked+.trk::after{transform:translateX(13px);background:var(--on-acc)}
.sw input:focus-visible+.trk{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:var(--bd) solid var(--line);border-radius:var(--pill);padding:2px;background:var(--panel2);gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 10px 4px 6px;border-radius:var(--pill);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mute)}
.seg button svg{width:22px;height:16px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.28);flex:none}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--on-acc)}
.seg button:not([aria-pressed=true]):hover{color:var(--ink)}
.pop{position:relative}
.tbtn{display:inline-flex;align-items:center;gap:8px;border:var(--bd) solid var(--line);background:var(--panel2);padding:6px 12px 6px 10px;border-radius:var(--pill);cursor:pointer;font-size:13px;font-weight:600}
.tbtn:hover,.tbtn[aria-expanded=true]{border-color:var(--acc);color:var(--acc)}
.tbtn svg{width:16px;height:16px;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:290px;max-height:min(70vh,520px);overflow:auto;padding:6px;background:var(--panel);border:var(--bd) solid var(--line);border-radius:var(--r);box-shadow:var(--shh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.menu[hidden]{display:none}
:root[data-theme=vidro] .menu{background:rgba(24,28,60,.88)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:var(--bd) solid transparent;background:none;padding:8px 10px;border-radius:var(--rs);cursor:pointer}
.menu button:hover{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.menu button[aria-checked=true]{border-color:var(--acc)}
.menu .sws{display:flex;flex:none;border-radius:var(--rs);overflow:hidden;box-shadow:0 0 0 1px rgba(128,128,128,.4)}
.menu .sws i{display:block;width:16px;height:30px}
.menu b{display:block;font-size:13.5px;font-weight:600}
.menu small{display:block;font-size:12px;color:var(--mute);line-height:1.3}

/* ===== Área rolável única ===== */
#wrap{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--acc) 60%,transparent) transparent;overscroll-behavior:contain}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1000px;table-layout:fixed}
thead th{position:sticky;z-index:3;height:38px;padding:0 12px;font:600 12.5px var(--fb);text-align:left;color:var(--mute);background:var(--panel);border-bottom:var(--lw) solid var(--line);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
thead tr.r1 th{top:0}
thead tr.r2 th{top:38px}
thead th.rs{height:76px;vertical-align:bottom;padding-bottom:10px;color:var(--ink)}
thead th.rs small{display:block;font-weight:500;color:var(--acc);font-size:11.5px;margin-top:2px}
thead th.g1{color:var(--acc);border-bottom:3px solid var(--acc);font-size:13.5px}
thead th.g2{color:var(--acc2);border-bottom:3px solid var(--acc2);font-size:13.5px}
thead th.c1:first-child,thead th.corner{left:0;z-index:5}
td,tbody th{padding:12px;overflow-wrap:anywhere;border-bottom:var(--lw) solid var(--line);vertical-align:top;background:var(--panel2)}
tbody th.name{position:sticky;left:0;z-index:2;padding:0;background:var(--panel);text-align:left;border-right:var(--lw) solid var(--line);transition:background .15s;cursor:pointer}
.nm{display:flex;flex-direction:column;align-items:flex-start;gap:10px;width:100%;padding:14px 12px;border:0;background:none;text-align:left;cursor:pointer;color:var(--acc)}
.nm-t{overflow-wrap:normal;font:var(--hw) clamp(16px,1.25vw,20px)/1.15 var(--fd);letter-spacing:var(--hls);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-color:color-mix(in srgb,var(--acc) 45%,transparent);text-shadow:var(--glow)}
.nm-more{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font:600 12px/1 var(--fb);background:var(--acc);color:var(--on-acc);padding:5px 8px 5px 10px;border-radius:var(--pill)}
.nm-more svg{width:13px;height:13px;transition:transform .15s}
tbody th.name:hover{background:color-mix(in srgb,var(--acc) 11%,var(--panel))}
tbody th.name:hover .nm-t{text-decoration-color:var(--acc)}
tbody th.name:hover .nm-more svg{transform:translateX(3px)}
tbody tr:not(.sec):hover td{background:color-mix(in srgb,var(--acc) 6%,var(--panel2))}
td.car{color:var(--mute);font-size:13.5px}
td.prompt{background:var(--panel);border-left:var(--lw) solid var(--line)}
td.prompt p{margin:0 0 10px;font-size:13px;line-height:1.55}
.copy{display:inline-flex;align-items:center;gap:6px;background:none;border:var(--bd) solid var(--line);color:var(--mute);border-radius:var(--pill);padding:3px 11px 3px 9px;font:500 12px var(--fb);cursor:pointer}
.copy svg{width:13px;height:13px}
.copy:hover{color:var(--on-acc);background:var(--acc);border-color:var(--acc)}
tr.sec th{position:sticky;left:0;background:var(--band);color:var(--yel);font:var(--hw) clamp(18px,1.7vw,23px)/1.2 var(--fd);letter-spacing:var(--hls);text-align:left;padding:15px 16px 13px;border-left:8px solid var(--acc);border-bottom:var(--lw) solid var(--line);border-top:var(--lw) solid var(--line);text-shadow:var(--glow)}
tr.sec .n{font:500 12px var(--fb);color:var(--mute);margin-left:12px;letter-spacing:0;text-shadow:none}
td.img{padding:9px}
td.empty .ph{aspect-ratio:1;border-radius:var(--rs);background:repeating-linear-gradient(135deg,transparent 0 8px,var(--line) 8px 9px);opacity:.5}
.thumb{position:relative;padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%;border-radius:var(--rs)}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--rs);display:block;background:var(--panel);border:var(--bd) solid var(--line);box-shadow:var(--sh);transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.thumb:hover img{transform:translateY(-3px) scale(1.025);box-shadow:var(--shh);border-color:var(--acc)}
.thumb::after{content:attr(data-m);position:absolute;left:7px;bottom:7px;padding:2px 8px;border-radius:var(--pill);font:600 10.5px/1.5 var(--fb);background:rgba(10,10,14,.72);color:#fff;letter-spacing:.02em;pointer-events:none;backdrop-filter:blur(4px)}
tr.hide{display:none}
#vazio{margin:60px auto;text-align:center;color:var(--mute);max-width:44ch}
#vazio[hidden]{display:none}
.sem-prompts .col-prompt{display:none}

/* ===== Visualizador de imagens ===== */
#dlg{border:0;padding:0;margin:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;background:rgba(6,6,10,.95);color:#eee;overflow:hidden}
#dlg::backdrop{background:transparent}
.lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:56px 90px 18px}
.lb figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;max-height:100%;min-height:0}
.lb img{display:block;max-width:100%;max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);object-fit:contain;border-radius:var(--rs);box-shadow:0 18px 60px rgba(0,0,0,.6);transition:opacity .15s}
.lb img.troca{opacity:.25}
.lb figcaption{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13.5px;color:#d9d9e0}
.lb .cap-nome{all:unset;box-sizing:border-box;cursor:pointer;color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.lb .cap-nome:hover,.lb .cap-nome:focus-visible{color:var(--acc)}
.lb .pos{padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-variant-numeric:tabular-nums;font-size:12.5px}
.lb .dl{color:#fff;text-decoration:none;font-size:12.5px;padding:3px 12px;border:1px solid rgba(255,255,255,.4);border-radius:999px}
.lb .dl:hover,.lb .dl:focus-visible{background:#fff;color:#000}
.lb .dl[hidden]{display:none}
.lb-btn{position:absolute;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(20,20,26,.7);color:#fff;cursor:pointer;backdrop-filter:blur(6px);transition:background .15s,transform .15s}
.lb-btn:hover{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.lb-btn svg{width:24px;height:24px}
.lb-btn.prev{left:20px;top:50%;margin-top:-26px}
.lb-btn.next{right:20px;top:50%;margin-top:-26px}
.lb-btn.prev:hover{transform:translateX(-2px)}
.lb-btn.next:hover{transform:translateX(2px)}
.lb-btn.x{top:14px;right:16px;width:40px;height:40px}
.lb-btn.x svg{width:18px;height:18px}
.lb-btn[hidden]{display:none}

/* ===== Painel de detalhes do estilo ===== */
dialog.panel{width:100vw;height:100vh;height:100dvh;max-width:100vw;max-height:100vh;margin:0;padding:0;background:var(--bg);background-image:var(--bgi);background-attachment:fixed;color:var(--ink);border:0;position:fixed;inset:0}
dialog.panel::backdrop{background:rgba(0,0,0,.7)}
.sp-close{position:absolute;top:14px;right:16px;z-index:5;background:var(--panel);border:var(--bd) solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer}
.sp-close:hover{border-color:var(--acc);color:var(--acc)}
.sp-back{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:var(--bd) solid var(--acc);color:var(--acc);padding:9px 16px;border-radius:var(--pill);font:600 13.5px var(--fb);cursor:pointer;margin-bottom:26px}
.sp-back:hover{background:var(--acc);color:var(--on-acc)}
.sp-back svg{width:15px;height:15px}
.sp-body{display:flex;height:100%}
.sp-left{width:36%;flex:0 0 36%;overflow-y:auto;padding:56px 32px 48px;border-right:var(--lw) solid var(--line);background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.sp-right{flex:1;min-width:0;overflow-y:auto;padding:56px 36px 48px}
.sp-left h2{font:var(--hw) clamp(26px,3vw,36px)/1.12 var(--fd);letter-spacing:var(--hls);margin:0 0 6px;text-shadow:var(--glow)}
.sp-left .sp-sec{color:var(--mute);font-size:13px;margin:0 0 4px}
.sp-left .sp-period{color:var(--yel);margin:0 0 26px;font-size:14px}
.sp-left h3{font:600 13.5px var(--fb);color:var(--acc);margin:24px 0 6px}
.sp-left h3:first-of-type{margin-top:0}
.sp-left p{margin:0;font-size:14.5px;line-height:1.65}
.sp-mestres{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.sp-mestres li{font-size:14px;color:var(--mute);line-height:1.5;padding-left:16px;position:relative}
.sp-mestres li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.sp-block{margin:0 0 44px}
.sp-block:last-child{margin-bottom:0}
.sp-label{font:600 14px var(--fb);color:var(--acc);margin:0 0 10px}
.sp-prompt-text{font-size:14px;margin:0 0 6px;line-height:1.65}
.sp-block .copy{margin-bottom:16px}
.sp-imgs{display:flex;gap:18px;flex-wrap:wrap}
.sp-imgs figure{flex:1 1 280px;min-width:0;margin:0}
.sp-imgs .thumb{width:100%;background:var(--panel);border-radius:var(--rs)}
.sp-imgs .thumb img{width:100%;height:auto;max-height:440px;object-fit:contain;aspect-ratio:auto;margin:0 auto}
.sp-imgs figcaption{font-size:12px;color:var(--mute);text-align:center;margin-top:7px}
.sp-missing{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:220px;border-radius:var(--rs);background:repeating-linear-gradient(135deg,transparent 0 8px,var(--line) 8px 9px);opacity:.7;color:var(--mute);font-size:12px}
.sp-missing svg{width:34px;height:34px;opacity:.8}

/* ===== Ajustes finos por tema ===== */
[data-theme=brutalismo] #top{background:var(--bg)}
[data-theme=brutalismo] .nm{color:var(--ink)}
[data-theme=brutalismo] .nm-t{text-decoration-color:var(--acc);text-decoration-thickness:3px}
[data-theme=brutalismo] thead th.g1{color:var(--ink)}
[data-theme=brutalismo] thead th.g2{color:var(--ink)}
[data-theme=bauhaus] .nm{color:var(--ink)}
[data-theme=bauhaus] .nm-t{text-decoration-color:var(--acc);text-decoration-thickness:3px}

/* ===== Responsivo ===== */
@media (max-width:1100px){#cnt{display:none}.mini{font-size:17px}}
@media (max-width:860px){
 .sp-body{flex-direction:column;overflow-y:auto}.sp-left,.sp-right{width:100%;flex:none;overflow-y:visible}.sp-left{border-right:0;border-bottom:var(--lw) solid var(--line)}
 #top.compact .mini{max-width:0;opacity:0;margin:0}
 .tbtn .tn,.sw .st{display:none}

/* Traduções: en-US para os textos de cada estilo (campos ausentes caem no pt-BR) e pt-BR para os prompts (g = geral, m = mulher com flores).
   Os prompts em inglês originais ficam em ESTILOS. A chave é o primeiro item de "stems". Não altere os marcadores. */
const I18N = /*I18N:inicio*/{
"secoes": {

},
"estilos": {
 "Impressionismo": {"en": {"nome": "Impressionism", "periodo": "1860s to 1880s, France", "caracteristicas": "Visible brushstrokes, emphasis on natural light, colored shadows and movement.", "historia": "Around 1860, Claude Monet, Pierre-Auguste Renoir, Alfred Sisley and Frédéric Bazille met as students of the academic painter Charles Gleyre and began painting together outdoors, on the outskirts of Paris. Rejected by the official Salon, they organized an independent exhibition in 1874 in the studio of the photographer Nadar; there, Monet's painting 'Impression, Sunrise' led the critic Louis Leroy to coin the term 'impressionist' as a sneer. The group held eight joint exhibitions until 1886, and Monet established himself as the central figure of the movement with his series of cathedrals, haystacks and water lilies. Impressionism broke with academic rigor by valuing the fleeting perception of light over precise drawing and historical subjects.", "tecnica": "The Impressionists painted outdoors (en plein air) to quickly capture changes in light, applying short, loose, visible brushstrokes that the viewer's eye blends at a distance. They preferred pure colors placed side by side directly on the canvas rather than mixed on the palette, and avoided traditional chiaroscuro, suggesting volume and distance through variations of color and tone. Shadows were painted in colored tones — blues, violets — instead of black, and outlines dissolved into patches of paint. This technique produced vibrant, textured surfaces that favored the momentary sensation over descriptive detail."}, "pt": {"g": "Boulevard parisiense encharcado de chuva ao entardecer, lampiões a gás se dissolvendo em toques quebrados de laranja e violeta, pinceladas visíveis e apressadas, sem contornos, sombras coloridas, multidão reduzida a toques cintilantes de tinta, luz fugaz e a dor de um momento que passa", "m": "Retrato elegante de uma jovem loira segurando um vaso com flores lilás, vermelhas e amarelas, estilo impressionista, pinceladas soltas e vibrantes, luz natural suave, toques de cor"}},
 "posImpressionismo": {"en": {"nome": "Post-Impressionism", "periodo": "Late 1880s to early 1900s, France", "caracteristicas": "Intense colors, slightly distorted forms and strong emotional charge (Van Gogh style).", "historia": "The term 'post-impressionism' was coined by the English critic Roger Fry in 1910 to group artists who, between 1886 and 1905, started from the Impressionist foundation but sought paths of their own. Paul Cézanne wanted to restore structure and solidity to painting, breaking nature down into essential geometric forms — a path that would open the door to Cubism. Paul Gauguin moved away from direct observation in search of a symbolic primitivism, while Vincent van Gogh used color and brushwork to express emotion ('I don't paint what I see, but what I feel'). Georges Seurat, in turn, systematized color into small juxtaposed dots, creating pointillism.", "tecnica": "Each artist developed his own technique within a shared core of thick, directional brushstrokes. Cézanne reduced objects to basic forms (cylinders, spheres, cones) while keeping the vivid colors inherited from Impressionism. Van Gogh applied paint in thick layers (impasto), at times almost sculpting the surface of the canvas with swirling, intense strokes. Seurat built the image from thousands of dots of pure color, relying on the optical mixing of the human eye. What they had in common was a taste for saturated colors, stronger outlines and a more deliberate formal structure than Impressionist observation."}, "pt": {"g": "Um cipreste e uma vila insone sob um céu noturno turbulento, cristas grossas de impasto em azul ultramar e amarelo cádmio, pinceladas direcionais em espiral, marcas carregadas de espátula, emoção crua e trêmula em cada pincelada", "m": "Retrato elegante de uma jovem loira segurando um vaso com flores lilás, vermelhas e amarelas, estilo pós-impressionista, textura espessa de tinta em impasto, pinceladas giratórias e emocionais, cores ousadas e expressivas"}},
 "Surrealismo": {"en": {"nome": "Surrealism", "periodo": "1920s to 1950s, mainly France and Spain", "caracteristicas": "Dreamlike scenes, bizarre juxtapositions, illogical elements and a dream atmosphere.", "historia": "The movement was officially founded by the French poet André Breton in Paris in 1924, with the publication of the 'Surrealist Manifesto'. Breton, who had studied medicine and psychiatry and knew Freud's psychoanalysis well, proposed freeing thought from the shackles of reason by reaching the unconscious through techniques such as automatic writing. Surrealism grew out of the Dada movement of the late 1910s, inheriting its spirit of rupture but directing it toward the systematic exploration of dreams and chance. Salvador Dalí, René Magritte and Max Ernst, among others, extended the idea to painting over the following decades.", "tecnica": "The Surrealists used methods of creation that bypassed conscious control, such as the 'exquisite corpse' — a collective drawing or text built in stages hidden from the participants. In painting, Dalí and Magritte favored a hyper-realistic, almost photographic rendering that made the impossible scenes even more disturbing because they looked real. Hallmarks of the style include the juxtaposition of logically unrelated elements, distorted scales and perspectives, everyday objects removed from their context and a dreamlike atmosphere of silence and estrangement."}, "pt": {"g": "Deserto âmbar sem fim ao crepúsculo, um relógio de bolso mole pendurado numa árvore morta, sombras alongadas se esticando de forma impossível, uma figura solitária apoiada em uma muleta, renderização acadêmica a óleo hiperlisa de um sonho ilógico, desconforto silencioso e saudade", "m": "Retrato surrealista elegante de uma jovem loira segurando um vaso, flores lilás, vermelhas e amarelas derretendo em borboletas, atmosfera onírica, estilo Dalí, elementos flutuantes"}},
 "Cubismo": {"en": {"nome": "Cubism", "periodo": "1907 to 1920, France", "caracteristicas": "Objects fragmented and reassembled through planes and geometric shapes.", "historia": "Cubism was created by Pablo Picasso and Georges Braque in Paris starting in 1907, the year Picasso painted 'Les Demoiselles d'Avignon', a canvas that absorbed influences from Iberian and African sculpture and is considered the starting point of the movement. The two artists worked closely for about two years, debating and developing the new language together. The early phase, later called analytic Cubism (from 1910), broke objects and figures down into overlapping geometric facets, using an almost monochrome palette of ochres, grays and browns. From 1912, synthetic Cubism introduced the collage of cut paper (papiers collés), simplifying forms instead of fragmenting them.", "tecnica": "In analytic Cubism, the object is 'analyzed' and rebuilt from multiple simultaneous points of view, creating shallow, overlapping planes that deny the traditional perspective of a single vanishing point. The palette is restrained and neutral so that attention falls on the structure of the forms rather than on color. In synthetic Cubism, the composition becomes flatter and objects are suggested by simplified geometric shapes and pasted materials — newspaper, wallpaper, straw — anticipating modern collage."}, "pt": {"g": "Um guitarrista desconstruído em facetas angulares sobrepostas, visto de frente e de perfil ao mesmo tempo, paleta contida de ocre, terra de sombra e cinza, espaço achatado, fragmentos de jornal em colagem, cubismo analítico com ritmo austero e melancólico", "m": "Retrato cubista elegante de uma jovem loira segurando um pote, planos geométricos fragmentados, flores lilás, vermelhas e amarelas desconstruídas em formas abstratas, múltiplas perspectivas"}},
 "Barroco": {"en": {"nome": "Baroque", "periodo": "1600 to 1750, Europe (especially Italy, Spain and Flanders)", "caracteristicas": "Dramatic contrast of light and shadow (chiaroscuro), rich detail and opulence.", "historia": "The Baroque flourished in Europe between roughly 1600 and 1750, driven largely by the Catholic Counter-Reformation: faced with the advance of Protestantism, the Church sought an art capable of moving and winning back the faithful through visual spectacle. Caravaggio, one of the pioneers of the period, painted saints and biblical scenes using the bodies of ordinary people — beggars, prostitutes — in dark taverns, bringing the sacred closer to popular everyday life. His use of dramatic light influenced a whole generation of Baroque painters, from Rembrandt to Rubens and Velázquez, who carried theatricality and opulence into churches, palaces and court portraits across Catholic Europe.", "tecnica": "Caravaggio pioneered tenebrism, an extreme form of chiaroscuro in which light falls on the scene like an isolated theatrical spotlight, plunging the rest of the composition into deep shadow. This technique creates a dramatic effect of revelation, guiding the viewer's eye straight to the point of emotional tension in the scene. Baroque compositions favor dynamic diagonals over static symmetry, rich textures of fabric and metal, and a raw realism of the figures, in contrast to the earlier classical idealization."}, "pt": {"g": "Um único feixe de luz de vela cortando a escuridão absoluta, tenebrismo, veludo carmesim profundo e ouro desgastado, gesto teatral congelado em pleno movimento, rico impasto a óleo nas luzes, drama cru e intensidade sagrada", "m": "Retrato barroco elegante de uma jovem loira segurando um pote com flores lilás, vermelhas e amarelas, claro-escuro dramático, sombras intensas, cores ricas e profundas, texturas de pintura a óleo, obra-prima"}},
 "Renascimento": {"en": {"nome": "Renaissance", "periodo": "14th to 16th century, Italy and later all of Europe", "mestres": ["Leonardo da Vinci (1452–1519)", "Raphael (1483–1520)", "Michelangelo (1475–1564)", "Sandro Botticelli (1445–1510)", "Titian (c. 1488–1576)"], "caracteristicas": "Realistic proportions, mathematical linear perspective, harmony and the sfumato technique.", "historia": "The Renaissance flourished in Italy between the 14th and 16th centuries before spreading to the rest of Europe, driven by humanism — an intellectual movement that put the human being, and not only the divine, back at the center of artistic representation. Scientific advances and the rediscovery of classical Greco-Roman texts led artists to study anatomy, mathematics and optics with unprecedented rigor. Filippo Brunelleschi formulated the rules of linear perspective around 1415, later systematized by Leon Battista Alberti in 1435, making it possible to represent three-dimensional space with geometric precision on a flat surface. Leonardo da Vinci, Michelangelo and Raphael brought these discoveries to their peak during the so-called High Renaissance, in the early 16th century.", "tecnica": "Linear perspective organizes the composition around a single vanishing point, making parallel lines converge at the horizon and creating the illusion of real depth. Leonardo da Vinci perfected sfumato, a technique of tonal transitions so soft that it dissolves outlines and sharp edges, as if forms were emerging from smoke. Compositions seek balance and mathematical symmetry, often organized according to golden proportions, with anatomy studied from dissections and direct observation of the human body."}, "pt": {"g": "Serena encosta toscana se afastando em uma distância azulada e enevoada, perspectiva linear de ponto único, suavidade de sfumato sem bordas duras, composição piramidal equilibrada, camadas quentes de velatura a óleo, dignidade tranquila e harmonia ideal", "m": "Retrato renascentista elegante de uma jovem loira segurando um pote clássico cheio de flores lilás, vermelhas e amarelas, sfumato suave, sombras leves, estilo Leonardo da Vinci, composição harmoniosa"}},
 "Expressionismo": {"en": {"nome": "Expressionism", "periodo": "1905 to 1930, mainly Germany", "caracteristicas": "Distortion of reality and strong colors to express subjective feelings and anguish.", "historia": "German Expressionism was born in 1905 in Dresden, when four students founded the group Die Brücke (The Bridge), reacting to the anxiety and alienation of modern life by reviving pre-academic forms of expression such as the woodcut. In 1911, in Munich, a second core emerged, Der Blaue Reiter (The Blue Rider), led by Wassily Kandinsky and Franz Marc, which sought a more spiritual and abstract dimension of art, influenced by Cubism, Futurism and folk art. While Die Brücke developed a distorted, angular figurative style, Der Blaue Reiter moved toward lyrical abstraction. Together, the two groups defined the visual language of Expressionism between 1905 and 1930.", "tecnica": "The Die Brücke style relied on contrasting, almost brutal colors, angular lines and a deliberately simplified, 'primitive' drawing inherited from the woodcut. Der Blaue Reiter, for its part, explored abstract forms, symbolism and vibrant colors to suggest spiritual and emotional states. In both cases, faithful representation of reality is sacrificed in favor of the expressive distortion of forms and perspectives, with agitated brushstrokes and rough outlines that convey anguish, tension and direct emotional intensity."}, "pt": {"g": "Uma figura gritando numa ponte sob um céu laranja-sangue, linhas onduladas e distorcidas, verdes ácidos e vermelhos violentos, pinceladas rudes e agressivas, rostos como máscaras, ansiedade transformada em cor e forma", "m": "Retrato expressionista elegante e sombrio de uma jovem loira segurando um pote com flores lilás, vermelhas e amarelas, pinceladas ousadas e distorcidas, cores subjetivas intensas, profundidade emocional"}},
 "Realismo": {"en": {"nome": "Realism", "periodo": "1840 to 1880, France", "caracteristicas": "Precise, raw and detailed representation of everyday human life, without idealization.", "historia": "Realism emerged in France in the 1850s, after the Revolution of 1848, as a direct reaction to Romanticism and its emotional theatricality and exotic themes. Gustave Courbet, considered the father of the movement, declared that he painted only what he could see — 'I cannot paint an angel because I have never seen one' — and portrayed ordinary workers and peasants in everyday scenes, without idealization. His work 'A Burial at Ornans' (1849-50), nearly seven meters wide, shocked the public and critics by depicting an ordinary rural funeral at the monumental scale previously reserved for religious or historical subjects. The movement established a new way of looking at the lives of the working classes, which would pave the way for Impressionism.", "tecnica": "Courbet built his canvases with robust brushstrokes and frequent use of the palette knife, creating thick, textured surfaces. His earthy, sober palette avoided the idealized glow of Romanticism, favoring tones that reflected the roughness of real life observed directly. The compositions avoid any heroism or idealization of the subjects portrayed, valuing careful observation of natural light and anatomy as they appear, without embellishment."}, "pt": {"g": "Um trabalhador cansado descansando à beira de um campo de trigo ao meio-dia, rosto honesto e sem idealização, suor e poeira em roupas gastas, luz do dia plana e nublada, paleta terrosa e contida, quietude digna e cansaço silencioso", "m": "Pintura realista elegante de uma jovem loira segurando um pote com flores lilás, vermelhas e amarelas, altamente detalhada, texturas precisas de tecido e pétalas, iluminação natural direta, belas-artes"}},
 "Ukiyo-e": {"en": {"nome": "Ukiyo-e", "periodo": "17th to 19th century, Japan (Edo period)", "caracteristicas": "Traditional Japanese woodblock print style, with bold outlines and flat colors.", "historia": "Ukiyo-e, which means 'pictures of the floating world', flourished during the Edo period (1603-1868), when Japan's economic expansion gave rise to a new urban class with an appetite for images of kabuki actors, courtesans and landscapes. Initially produced in black and white and colored by hand, woodblock prints came to be printed in full color (nishiki-e) from 1765, thanks to technical advances that made it possible to align multiple wooden blocks. Production was a collaborative process among the artist who drew the image, the carver who cut the blocks and the printer, coordinated by a publisher. In the 19th century, masters such as Hokusai and Hiroshige expanded the genre to landscapes, and their works would go on to strongly influence the European Impressionists decades later.", "tecnica": "Ukiyo-e woodblock prints are characterized by strong, well-defined black line outlines that delimit areas of color applied flat, without gradations or volumetric shading. Producing a color image required a separately carved woodblock for each color, printed in precise sequence on the paper. Compositions often adopt bold, asymmetrical framing, with elevated perspectives and unexpected crops that would later inspire 'Japonisme' in Western art."}, "pt": {"g": "Uma onda gigante e encaracolada, com espuma em forma de garras, prestes a quebrar sobre pequenos barcos, o Monte Fuji minúsculo ao longe, contornos firmes de sumi, áreas chapadas de azul-da-prússia e creme, veios da madeira visíveis, céu em gradiente bokashi, reverência diante do poder da natureza", "m": "Retrato elegante em xilogravura ukiyo-e de uma jovem japonesa de cabelos pretos em penteado tradicional preso no alto, segurando um pote com flores lilás, vermelhas e amarelas, contornos nítidos e marcantes, cores decorativas chapadas, estética tradicional japonesa"}},
 "Art Nouveau": {"en": {"nome": "Art Nouveau", "periodo": "1890 to 1910, Europe", "caracteristicas": "Organic, flowing, sinuous lines based on nature, decorative frames.", "historia": "Art Nouveau developed in Europe between about 1890 and 1910, as a reaction to the historicism and academicism of the 19th century and to the flood of cheap imitations of historical styles produced by mass production. The term came from the name of a Parisian gallery, the Maison de l'Art Nouveau, run by the dealer Siegfried Bing. The Czech illustrator Alphonse Mucha helped define the movement's aesthetic almost by accident: in December 1894 he was the only designer available to create, in a hurry, a poster for the actress Sarah Bernhardt; the result — a life-size figure beneath a halo-shaped arch — was posted on the streets of Paris in early 1895 and made him famous within a few days.", "tecnica": "The style's trademark is the 'whiplash line': an asymmetrical, sinuous curve, inspired by plant stems or locks of hair, that gains momentum and coils back on itself. Flowers and insects — lilies, irises, dragonflies, peacocks — were always stylized into decorative patterns, never reproduced with botanical accuracy. The movement also explored modern materials such as wrought iron, glass and ceramics, in symmetrical or spiral ornamental compositions that conveyed a sense of dynamism and organic growth."}, "pt": {"g": "Uma donzela emoldurada por um halo circular de vinhas em chicote e lírios, cabelos sinuosos e fluidos que viram ornamento, pastéis chapados e suaves com detalhes dourados, linhas de contorno marcantes, painel decorativo com letras, calma poética e sensual", "m": "Retrato Art Nouveau elegante de uma jovem loira segurando um pote, flores lilás, vermelhas e amarelas fluindo, linhas orgânicas intrincadas, estilo Alphonse Mucha, detalhes em folha de ouro, molduras decorativas"}},
 "Art Déco": {"en": {"nome": "Art Deco", "periodo": "1920 to 1940, international (peaking in Paris and New York)", "caracteristicas": "1920s aesthetic with precise geometric shapes, symmetry and luxurious tones (gold).", "historia": "Art Deco got its name retrospectively, from the International Exhibition of Modern Decorative and Industrial Arts held in Paris in 1925 — at the time it was simply called the 'modern style'. Over six months, more than 16 million visitors from 20 countries toured pavilions devoted to architecture, fashion, jewelry and graphic design. The movement developed between the two world wars and celebrated technological progress, the speed of machines and the urban luxury of the skyscraper era, in contrast to the organic forms of the Art Nouveau that preceded it.", "tecnica": "Unlike the natural curves of Art Nouveau, Art Deco adopts straight lines, symmetry and angular geometry — forms that are easier to reproduce in industrial and mass production. The aesthetic combines manufactured materials (chrome, plastic, glass) with noble ones (ivory, silver, jade), in repetitive, stepped patterns. The palette of metallic, contrasting colors — gold, black, silver — reinforces the feeling of luxury, modernity and urban sophistication."}, "pt": {"g": "Um grandioso saguão de hotel de chevrons escalonados e raios de sol irradiantes, simetria perfeita de espelho, laca preta, latão polido e incrustações de ouro, formas aerodinâmicas de arestas duras, glamour frio e modernidade confiante", "m": "Retrato Art Déco elegante de uma jovem loira segurando um pote geométrico e liso com flores lilás, vermelhas e amarelas, padrões simétricos, estilo glamoroso dos anos 1920, detalhes em ouro e contraste marcante"}},
 "Arte Bizantina": {"en": {"nome": "Byzantine Art / Mosaic", "periodo": "4th to 15th century, Byzantine Empire", "mestres": ["Masters of San Vitale (Ravenna)", "Masters of Hagia Sophia", "Theodore Metochites (1270–1332)", "Theophanes the Greek (c. 1340–c. 1410)"], "caracteristicas": "Images formed by small tiles, stones or gilded and colored glass.", "historia": "Byzantine art flourished between the 4th and 15th centuries in the Byzantine Empire, whose capital was Constantinople. Some of the most complete and best-preserved examples are in Ravenna, Italy, built under the Ostrogothic king Theodoric (493-526) and later under the emperor Justinian — such as the mosaics of the church of San Vitale (c. 526-548), which feature a uniform gold background decades before this technique spread across the rest of the West. Byzantine art deliberately rejected Greco-Roman classical naturalism, seeking to represent the sacred in a hieratic, frontal and timeless way, aimed at spiritual contemplation rather than physical likeness.", "tecnica": "Mosaics were made of tesserae — small pieces of glass or stone — and a specific technique was used for the gold background: a thin sheet of gold leaf was applied cold onto a glass plate, covered with a layer of powdered glass and then fired in a kiln. The gold tesserae were set at slightly varying angles to one another, so as to reflect ambient light in a glittering, irregular way. Human figures were shown frontally, elongated and static, standing out against the flat gold background without any suggestion of spatial depth."}, "pt": {"g": "Um imperador solene de frente com auréola dourada, milhares de pequenas tesselas de vidro irregulares sobre um fundo de ouro cintilante, linhas de rejunte visíveis, figuras hieráticas e chapadas com olhos enormes e fixos, sem perspectiva, quietude sagrada e atemporal", "m": "Retrato elegante em mosaico bizantino de uma jovem loira segurando um pote com flores lilás, vermelhas e amarelas, pequenos ladrilhos de vidro intrincados, rejunte dourado marcante, estética de ícone religioso"}},
 "Romantismo": {"en": {"nome": "Romanticism", "periodo": "c. 1790 to 1850, Europe", "caracteristicas": "Sublime nature, storms and ruins, intense emotion, dramatic colors and the individual before the infinite.", "historia": "Romanticism emerged at the turn of the 18th to the 19th century as a reaction to Enlightenment rationalism and the order of Neoclassicism. Instead of reason, it valued emotion, imagination and the uncontrollable force of nature. Friedrich painted solitary figures before immense landscapes, as in 'Wanderer above the Sea of Fog' (c. 1818); Géricault shocked Paris with 'The Raft of the Medusa' (1818–19), and Delacroix turned revolution into painting with 'Liberty Leading the People' (1830). Turner took atmosphere to the edge of abstraction, dissolving storms and fires into light.", "tecnica": "Romantic painting prefers dramatic compositions, with diagonals, great masses of clouds and strong contrasts between light and darkness. The brushwork is looser and the color more intense and warm than in Neoclassicism, with atmospheres of mist, storm or moonlight. Human figures are usually small against the landscape, to evoke the sublime. Turner used translucent glazes of oil and watercolor to create vaporous light, while Delacroix placed complementary colors side by side to give the scene vibration."}, "pt": {"g": "Um andarilho solitário em um penhasco irregular sobre um mar de névoa ao amanhecer, nuvens de tempestade se rasgando para deixar entrar feixes de luz dourada, abadia gótica em ruínas ao longe, figura pequena diante do vasto sublime, composição diagonal dramática, ricas velaturas a óleo, assombro e melancolia", "m": "Retrato elegante de uma jovem loira segurando um vaso com flores lilás, vermelhas e amarelas, estilo de pintura a óleo romântica, céu sublime e tempestuoso atrás dela, luz dramática rompendo as nuvens, cabelos ao vento, cores ricas e saturadas, atmosfera emocional"}},
 "Rococó": {"en": {"nome": "Rococo", "periodo": "c. 1720 to 1780, France and Central Europe", "caracteristicas": "Soft pastels, ornamental curves, aristocratic lightness, gallant scenes and festive gardens.", "historia": "Rococo was born in Paris after the death of Louis XIV (1715), when the court traded the solemnity of Versailles for the more intimate life of the salons. The name comes from 'rocaille', the shells and stones used in decorative grottoes. Watteau inaugurated the 'fêtes galantes' with 'The Embarkation for Cythera' (1717); Boucher painted goddesses and shepherdesses for Madame de Pompadour, and Fragonard summed up the light spirit of the age in 'The Swing' (c. 1767). Rococo art was made to decorate interiors, with mirrors, gilded stucco and tapestries. It lost ground with the rise of Neoclassicism and the French Revolution.", "tecnica": "A light palette of pink, sky blue, mint green, cream and gold, with soft, luminous brushstrokes. The compositions are asymmetrical, full of S-curves, bows, foliage and clouds. The themes are amorous and festive, with silk and satin dresses painted with sheen and transparency. The atmosphere is theatrical and irreverent, and the sense of movement comes from fluttering drapery. The drawing keeps an almost porcelain-like delicacy, with graceful, small figures within decorative landscapes."}, "pt": {"g": "Festa em jardim em tons pastel sob árvores ondulantes, uma jovem aristocrata num balanço de corda entre nuvens de anáguas de seda, querubins e guirlandas de rosas, ornamentos dourados em espiral emolduram a cena, pinceladas leves como plumas em pêssego, menta e azul-pó, clima brincalhão e galanteador", "m": "Retrato elegante de uma jovem loira segurando um vaso com flores lilás, vermelhas e amarelas, estilo de pintura rococó, vestido de seda rosa-pastel e azul-pó, curvas douradas ornamentadas, pinceladas suaves e leves como plumas, cenário de jardim galanteador, querubins e guirlandas de rosas"}},
 "Neoclassicismo": {"en": {"nome": "Neoclassicism", "periodo": "c. 1760 to 1830, France, Italy and Europe", "caracteristicas": "Clarity of drawing, balanced composition, themes from antiquity, statuesque poses and cool light.", "historia": "Neoclassicism was spurred by the excavations of Herculaneum (1738) and Pompeii (1748) and by the writings of the historian Johann Winckelmann, who defended the 'noble simplicity and quiet grandeur' of Greek art. In reaction to the excess of Rococo, artists revived the order and civic virtue of ancient Rome. Jacques-Louis David, with 'The Oath of the Horatii' (1784) and 'The Death of Marat' (1793), became the official painter of the Revolution and later of Napoleon. Ingres took the purity of line to the extreme in portraits and nudes such as 'La Grande Odalisque' (1814). The style shaped museums, courthouses and monuments across the West.", "tecnica": "Drawing dominates color: sharp outlines, smooth surfaces and almost invisible brushwork, with no brush marks. Figures have idealized anatomy and sculptural poses, arranged in friezes or stable triangles. The light is clear and even, with well-defined shadows, and the palette is sober, with strong reds, blues and whites. Settings feature columns, togas, drapery and marble. The result is a cool, orderly and solemn image that seems frozen in a heroic instant."}, "pt": {"g": "Cena heroica em um átrio romano, figuras de toga branca posando como esculturas ao redor de um altar de pedra, contornos nítidos e limpos, luz fria e uniforme, composição triangular rigorosa, superfícies polidas e lisas como esmalte sem pinceladas visíveis, virtude cívica solene", "m": "Retrato elegante de uma jovem loira segurando um vaso com flores lilás, vermelhas e amarelas, estilo de pintura neoclássica, drapeado grego branco, fundo com coluna de mármore, contornos nítidos e lisos, luz fria e uniforme, pose estatuária e calma, superfície polida"}},
 "Pontilhismo": {"en": {"nome": "Pointillism", "periodo": "c. 1884 to 1905, France", "caracteristicas": "Mosaic of dots of pure color, optical mixing, vibrant light and still, geometric figures.", "historia": "Pointillism (or divisionism) was born when Georges Seurat began painting 'A Sunday Afternoon on the Island of La Grande Jatte' (1884–86), shown at the last Impressionist exhibition in 1886. Inspired by the color studies of Michel-Eugène Chevreul and Ogden Rood, Seurat wanted to give Impressionist painting a scientific rigor. The critic Félix Fénéon called the group 'neo-Impressionist'. Paul Signac spread the method and wrote its manifesto, 'From Eugène Delacroix to Neo-Impressionism' (1899); Pissarro adopted the technique for a few years. Seurat's early death at age 31 cut the research short, but it influenced Fauvism and Futurism.", "tecnica": "The surface is built from small dots or touches of pure color, applied side by side without mixing on the palette. From a distance, the viewer's eye fuses the dots and perceives tones that are more luminous and vibrant than those obtained by mixing paints (optical mixing). Complementary colors are placed side by side to intensify light. The forms are simplified and almost motionless, with soft outlines and a feeling of silence. It is slow work, requiring planning of the composition and brush discipline."}, "pt": {"g": "Tarde de domingo à beira de um rio, figuras rígidas em silhueta com sombrinhas sob árvores altas, cena inteira construída com minúsculos pontos de cores complementares puras, mistura óptica, luz cintilante, quietude geométrica e silenciosa", "m": "Retrato elegante de uma jovem loira segurando um vaso com flores lilás, vermelhas e amarelas, estilo pontilhista, imagem construída com milhares de minúsculos pontos de cor pura, mistura óptica de cores, tons complementares luminosos, quietude à la Seurat"}},
 "Expressionismo Abstrato": {"en": {"nome": "Abstract Expressionism", "periodo": "1940 to 1960, United States (New York)", "caracteristicas": "Physical gesture, monumental scale, colors in fields or splatters, and emotion without figurative representation.", "historia": "After World War II, New York replaced Paris as the center of Western art. Artists such as Pollock, De Kooning, Franz Kline and Lee Krasner sought a painting that expressed deep emotions without depicting the visible world. In 1952, the critic Harold Rosenberg called the practice 'action painting': the canvas as an arena for action. Rothko and Barnett Newman took another path, 'color field', with contemplative fields of color. In 1947, Pollock began painting with the canvas on the floor, dripping paint in continuous rhythms. The movement helped turn American art into an international force.", "tecnica": "There are two strands. In 'action painting', the artist gestures with the whole body and uses broad brushstrokes, splatters, dripping and palette knives, with no single focal point (all-over). In 'color field', thin layers of paint form large rectangles of color, with soft, luminous edges that envelop the gaze. The canvases are enormous to absorb the viewer. The composition comes from the process, with layers, accidents and regrets visible, and the result conveys energy or silence without depicting objects."}, "pt": {"g": "Tela monumental coberta de gotejamentos e respingos gestuais violentos de esmalte preto, branco e ocre, ritmo emaranhado em toda a superfície sem ponto focal, golpes grossos de espátula, energia crua do corpo inteiro do pintor", "m": "Retrato elegante de uma jovem loira segurando um vaso com flores lilás, vermelhas e amarelas, estilo expressionista abstrato, rosto e flores dissolvidos em gotejamentos gestuais de tinta e golpes ousados de cor, energia pictórica crua, pinceladas amplas e enérgicas"}},
 "Arte Rupestre": {"en": {"nome": "Cave Art", "periodo": "Upper Paleolithic, from about 50,000 to 10,000 years ago, on every continent", "mestres": ["Chauvet Cave, France (c. 36,000 years ago)", "Lascaux Cave, France (c. 17,000 years ago)", "Altamira Cave, Spain", "Serra da Capivara, Brazil", "Cueva de las Manos, Argentina"], "caracteristicas": "Silhouettes of animals and hands in ochre, charcoal and manganese on rock, lively lines and use of the wall's relief.", "historia": "Cave paintings are the oldest images made by human beings. In 2024, researchers dated a hunting scene in Sulawesi (Indonesia) to more than 50,000 years ago. The European panels include Chauvet (c. 36,000 years old), Lascaux (discovered in 1940) and Altamira (discovered in 1879). In Brazil, Serra da Capivara National Park holds thousands of sites with scenes of hunting, dancing and rituals. The function of the images is not known for certain, and hypotheses include hunting magic, shamanic rituals and the recording of stories, but the authorship is anonymous and collective.", "tecnica": "The pigments came from minerals and charcoal: iron oxides for reds and yellows, charcoal and manganese for blacks. They were applied with fingers, fur brushes or feathers, or blown through hollow bones to create negative hand silhouettes. The artists took advantage of bulges and cracks in the rock to suggest volume and movement, and painted by the light of animal-fat lamps. Animals are represented with concise, lively outlines, at varying scales, with no ground line or perspective."}, "pt": {"g": "Parede de caverna calcária iluminada por tochas, manada de bisões e cavalos em galope pintados em ocre vermelho e carvão preto, contornos seguindo as saliências naturais da rocha, impressões de mãos em estêncil sopradas com pigmento, textura mineral áspera, antigo e misterioso", "m": "Retrato elegante de uma jovem loira segurando um vaso com flores lilás, vermelhas e amarelas, estilo de pintura rupestre pré-histórica em parede áspera de calcário, mulher e flores em silhuetas de ocre e carvão, impressões de mãos em estêncil ao redor, textura mineral iluminada por tochas"}},
 "Arte Egípcia": {"en": {"nome": "Egyptian Art", "periodo": "c. 3100 BCE to 30 BCE, Ancient Egypt", "mestres": ["Thutmose, sculptor of the Nefertiti bust (14th century BCE)", "Artists of the village of Deir el-Medina", "The scribe Hunefer (Book of the Dead, c. 1275 BCE)", "Tomb of Nefertari (c. 1255 BCE)", "Funerary mask of Tutankhamun (c. 1323 BCE)"], "caracteristicas": "Figures in profile with frontal eye and shoulders, pure lines, hierarchy of size and hieroglyphs in blue, green, red and gold.", "historia": "For about three thousand years, Egyptian art followed stable conventions tied to religion and the idea of an afterlife. Images in tombs and temples had a magical function: to ensure that the deceased had food, protection and eternal life. The rules of proportion, already defined in the Old Kingdom, were taught by organized workshops of craftsmen, such as those of Deir el-Medina. The main break came with Akhenaten (14th century BCE), in the Amarna style, which brought more naturalistic and softer forms, as in the bust of Nefertiti. After him, the traditional canon returned.", "tecnica": "The image follows a canon: head in profile, eye and shoulders frontal, hips and legs in profile, an arrangement that shows each part of the body at its most recognizable angle. Size indicates importance (pharaohs and gods are larger) and figures sit in separate horizontal registers divided by lines, alongside hieroglyphs. Symbolic colors came from minerals: Egyptian blue, malachite green, red and yellow ochre, white and gold. The outlines are clean and the surfaces flat, with no shadow or perspective."}, "pt": {"g": "Parede de tumba em registros: faraó e deusa em perfil rigoroso com olho e ombros de frente, fileiras de hieróglifos, pigmentos minerais chapados em azul egípcio, verde malaquita, ocre vermelho e ouro sobre gesso, contornos pretos limpos, escala hierárquica, calma eterna", "m": "Retrato elegante de uma jovem egípcia antiga com tom de pele escuro do Nilo, cabelos pretos e olhos delineados com kohl, segurando um vaso com flores lilás, vermelhas e amarelas, estilo de pintura mural do Egito Antigo, pose de perfil com olho e ombros de frente, borda de hieróglifos, pigmentos minerais chapados de turquesa, ocre e ouro, contornos pretos, flores de lótus no vaso"}},
 "Arte Maia": {"en": {"nome": "Maya / Aztec Art", "periodo": "Maya: c. 250 to 900 CE (Classic period). Aztecs: c. 1325 to 1521, Mesoamerica", "mestres": ["Painters of the Bonampak murals, Mexico (c. 790 CE)", "Scribes of the Dresden Codex (Maya)", "Tlacuilos, Aztec scribe-painters (Codex Mendoza, c. 1541)", "Amanteca, Aztec featherwork artisans", "Sculptors of the Aztec Sun Stone"], "caracteristicas": "Glyphs, hieratic profiles, feather headdresses, stone reliefs, intense colors and iconography of gods and calendars.", "historia": "The Maya and the Aztecs developed systems of writing, calendars and monumental art. Classic Maya art, from cities such as Palenque, Tikal and Bonampak, portrayed kings, rituals and war on stelae, murals and painted ceramics. The Aztecs, who founded Tenochtitlan in 1325, produced colossal sculptures, such as the Sun Stone, and accordion-folded codices painted by the tlacuilos. The featherwork made by the amanteca was more valuable than gold. After the Spanish conquest (1521), many books were burned; those that survived, along with the murals and reliefs, are today the main testimonies of these cultures.", "tecnica": "Murals and codices use precise outlines in black or red filled with flat colors, such as Maya blue (a durable pigment made from indigo and clay), cinnabar red and ochre yellow. Figures appear in profile, with enormous headdresses of quetzal feathers, jade and interlaced glyphs. In stone reliefs, dense geometric forms, serpents, jaguars and faces of deities predominate. The composition is full, with little empty space, and symbolism (calendar, sacrifice, cosmos) prevails over perspective."}, "pt": {"g": "Mural de templo de um governante maia de perfil usando um imponente cocar de penas de quetzal e ornamentos de jade, faixas de glifos, pele de jaguar, azul maia chapado e saturado, vermelho de cinábrio e ocre com contornos marcantes, composição cerimonial densa, detalhes de relevo em pedra entalhada", "m": "Retrato elegante de uma jovem maia de pele bronzeada acobreada e cabelos longos, pretos e lisos, segurando um vaso com flores lilás, vermelhas e amarelas, estilo de mural maia mesoamericano antigo, pose de perfil, imponente cocar de penas de quetzal, azul maia e vermelho de cinábrio, bordas de glifos, contornos marcantes, composição cerimonial chapada"}},
 "Arte Aborigene": {"en": {"nome": "Aboriginal Art (Dot Painting)", "periodo": "Ancient tradition; acrylic painting since 1971, Australia (Western Desert)", "caracteristicas": "Concentric dots, winding lines, maps of the territory, earth, ochre and warm colors linked to the 'Dreaming'.", "historia": "Aboriginal paintings record stories of the 'Dreaming', the cosmology that explains the origin of the land, of living beings and of laws, and they work as maps of the territory. The modern acrylic painting movement began in 1971, in the community of Papunya, when the teacher Geoffrey Bardon encouraged older men to paint murals for the school; the Papunya Tula group emerged. The use of dots protects sacred meanings, since they camouflage designs that only initiated people can decipher. Some motifs are restricted and belong to families or clans; for this reason the style must be treated with respect, avoiding imitating specific works or stories.", "tecnica": "Acrylic dots are applied with stick ends or brushes over earth-colored backgrounds, forming patterns of concentric circles (water or camp sites), U-shaped lines (seated people) and paths. The work is seen from above, like a map. The colors come from the landscape: red and yellow ochres, whites, blacks and, more recently, vivid tones. In the north, Arnhem Land painters use tree bark and the 'x-ray' style, which shows the internal organs of animals. The repetition of dots creates vibration and movement."}, "pt": {"g": "Vista aérea do deserto como um mapa sagrado, círculos concêntricos de minúsculos pontos, caminhos sinuosos pontilhados e símbolos em U, ocre terroso em vermelho, amarelo e branco sobre fundo escuro, repetição rítmica hipnótica, pintura acrílica chapada de pontos", "m": "Retrato elegante de uma jovem aborígene australiana de pele escura e cabelos escuros e cacheados segurando um vaso com flores lilás, vermelhas e amarelas, estilo de pintura de pontos aborígene australiana, figura e flores construídas com círculos concêntricos e fileiras de minúsculos pontos, paleta terrosa de ocre, vermelho e branco, caminhos pontilhados sinuosos, composição simbólica chapada"}},
 "Shan Shui": {"en": {"nome": "Chinese Shan Shui / Sumi-e Painting", "periodo": "Shan shui: Tang and Song dynasties (7th to 13th century). Sumi-e: Japan, from the 14th century", "caracteristicas": "Mountains and mist in ink, expressive brushstrokes, emptiness as part of the composition and silent poetry.", "historia": "'Shan shui' means 'mountain-water'. Chinese landscape painting flourished in the Song dynasty, when masters such as Fan Kuan ('Travelers Among Mountains and Streams') and Guo Xi ('Early Spring', 1072) sought to portray the order of the universe rather than a specific place. They were generally works by scholars who were also poets and calligraphers. Zen Buddhism took the technique to Japan, where Sesshū and other masters created sumi-e. Landscape painting, with the human figure tiny before nature, expresses the Taoist vision of harmony between humans and the cosmos.", "tecnica": "Black ink is made by rubbing an ink stick on a stone with water, and different dilutions give a range of grays. The goat- or wolf-hair brush, on rice paper or silk, produces strokes that range from a fine thread to a broad wash. The principle 'qi yun sheng dong' (spirit resonance, life movement) matters more than likeness. Emptiness (liubai) suggests mist, water and sky. Guo Xi described three distances: high, deep and level. Colors, when they appear, are minimal."}, "pt": {"g": "Montanhas imponentes e enevoadas e uma cachoeira fina em aguada monocromática de nanquim, minúscula cabana de erudito e um viajante solitário numa trilha, vasto espaço vazio como névoa, pinceladas expressivas do preto seco ao molhado, rolo horizontal em seda envelhecida, poesia silenciosa e meditativa", "m": "Retrato elegante de uma jovem chinesa de cabelos longos e pretos em penteado tradicional segurando um vaso com flores lilás, vermelhas e amarelas, pintura chinesa tradicional em aguada de nanquim, mulher como uma delicada figura de pincel, flores feitas com poucos traços expressivos, montanhas enevoadas ao fundo, vasto espaço vazio, textura de papel de arroz, selo vermelho carimbado"}},
 "Miniatura Persa": {"en": {"nome": "Persian / Mughal Miniature", "periodo": "13th to 18th century, Persia (Iran) and Mughal India", "caracteristicas": "Jewel colors, gold, minute detail, flowering gardens, elevated perspective and decorative composition.", "historia": "The Persian miniature illustrated manuscript books, such as the 'Shahnameh' (The Book of Kings, by Ferdowsi, c. 1010), poems and chronicles. After the Mongol invasion (13th century), the influence of Chinese painting was added to the Persian tradition. Under the Timurids, the Herat school had its great name in Behzad; under the Safavids, Tabriz and Isfahan continued refining the genre. In India, the emperor Akbar (reigned 1556 to 1605) gathered Persian and Indian painters in his atelier and produced works such as the 'Hamzanama'. Under Jahangir, artists took up naturalistic studies of animals and plants, such as those by Ustad Mansur.", "tecnica": "Miniatures are painted in gouache and gold on polished paper, with extremely fine squirrel-hair brushes. The pigments include ground lapis lazuli for blue, vermilion, malachite and gold leaf. The perspective is ascending, with no vanishing point: the ground rises like a carpet and people and architecture are stacked. Gardens, carpets and tiles are ornamented in detail, and the figures, elegant and delicate, appear in graceful poses, with decorative borders and calligraphy."}, "pt": {"g": "Cena de jardim da corte vista de um ponto de vista elevado, príncipes e damas elegantes entre ciprestes e plátanos em flor, pavilhão revestido de azulejos com padrões de arabescos, tons de joia em azul lápis-lazúli, vermelhão e folha de ouro, borda ornamental de caligrafia, guache opaco chapado, minuciosamente detalhado", "m": "Retrato elegante de uma jovem persa de cabelos longos e escuros e olhos delineados com kohl segurando um vaso com flores lilás, vermelhas e amarelas, estilo de miniatura persa mogol, pinceladas minúsculas e delicadas, tons de joia em azul lápis-lazúli e vermelhão, detalhes em folha de ouro, borda floral ornamentada com caligrafia, perspectiva decorativa chapada, fundo de jardim"}},
 "Azulejaria": {"en": {"nome": "Portuguese Azulejo Tiles", "periodo": "15th century to the present, Portugal and Brazil", "mestres": ["Gabriel del Barco (c. 1649–1703)", "António de Oliveira Bernardes (1662–1732)", "Policarpo de Oliveira Bernardes (1695–1778)", "Maria Keil (1914–2012)", "Júlio Pomar (1926–2018)"], "caracteristicas": "Cobalt blue on a white background (or polychrome), narrative scenes, geometric patterns and baroque frames.", "historia": "The azulejo arrived in the Iberian Peninsula with the Arabs (from the Arabic 'al-zulayj', polished stone). In Portugal, King Manuel I commissioned tiles in Seville around 1503, and local production grew in the 17th century. In the early 18th century, the 'Great Production' brought large blue-and-white panels with religious and mythological scenes, under the influence of Chinese porcelain and Delft faience. The tradition crossed the Atlantic and covers churches and mansions in São Luís, Salvador and Recife. In the 20th century, artists such as Maria Keil (Lisbon metro stations) and Júlio Pomar renewed the medium.", "tecnica": "The design is painted with cobalt oxide on raw white glaze (tin glaze) on ceramic tiles and then fired in a kiln, fixing the design forever. Panels are made up of several pieces and must respect the division into squares. There are 'pattern' tiles (repetition of a geometric or floral motif) and 'figurative' ones (narrative scenes). The brush creates graded tones of blue, and the baroque frames use scrolls, shells and angels. Later, polychrome versions appeared, such as the yellow and green ones."}, "pt": {"g": "Grande painel de azulejos azul e branco com uma cena de pátio barroco com figuras elegantes e navios, pinceladas em azul cobalto sobre esmalte de estanho branco brilhante, grade visível de azulejos cerâmicos quadrados, moldura ornamentada com volutas, conchas e querubins, craquelê de queima antiga em forno", "m": "Retrato elegante de uma jovem portuguesa de cabelos escuros presos em coque segurando um vaso com flores lilás, vermelhas e amarelas, estilo tradicional de azulejo português, retrato pintado em azul cobalto sobre azulejos de cerâmica esmaltados de branco, grade de azulejos visível, moldura barroca de volutas, craquelê brilhante, motivos florais"}},
 "Geometria Islamica": {"en": {"nome": "Islamic Geometry (Arabesque)", "periodo": "8th century to the present, Islamic world (from Al-Andalus to India)", "mestres": ["Artisans of the Alhambra, Granada (13th–14th century)", "Masters of the Darb-i Imam shrine, Isfahan (1453)", "Mimar Sinan (1489–1588), Ottoman architect", "Artisans of the Sheikh Lotfollah Mosque, Isfahan", "M. C. Escher (1898–1972), admirer of the Alhambra"], "caracteristicas": "Stars, polygons and continuous interlacing, plant arabesques, calligraphy and infinite symmetry in ceramic, wood and stucco.", "historia": "In Islamic art, the emphasis on geometric and plant patterns, rather than human figures in religious spaces, developed a highly refined visual mathematics. From the Alhambra in Granada (13th–14th century) to the mosques of Iran and Turkey, artisans created mosaics, stuccoes and carvings. The Darb-i Imam shrine in Isfahan (1453) displays 'girih' patterns that in 2007 the physicists Peter Lu and Paul Steinhardt showed to approach quasicrystals. The Dutch artist M. C. Escher visited the Alhambra in 1922 and 1936 and drew inspiration from its mosaics for his tessellations.", "tecnica": "The design starts from a grid of circles and compass work: circles are divided into 4, 5, 6, 8 or 12 parts and stars, polygons and interlacings are built from them. The patterns can repeat infinitely (tessellations) and extend beyond the frame. Arabesques add curvilinear plant branches, and Kufic or thuluth calligraphy is integrated into the decoration. Techniques include cut tiles (zellige), carved stucco, marquetry and metalwork. Common colors are turquoise, cobalt blue, green, gold and white."}, "pt": {"g": "Cúpula e parede interiores cobertas de estrelas entrelaçadas de oito e doze pontas, tesselação infinita, mosaico de azulejos zellige em turquesa, azul cobalto, esmeralda e ouro, arabescos de estuque entalhado com volutas de vinhas e faixa caligráfica, simetria radial perfeita", "m": "Retrato elegante de uma jovem árabe de pele oliva e olhos escuros, cabelos cobertos por um véu de seda bordado, segurando um vaso com flores lilás, vermelhas e amarelas, estilo de arte geométrica islâmica, rosto emoldurado por padrões de estrelas entrelaçadas e vinhas de arabesco, azulejos em turquesa, cobalto e ouro, simetria radial perfeita, borda caligráfica, flores como motivos ornamentais"}},
 "Pintura a Oleo": {"en": {"nome": "Oil Painting on Canvas", "periodo": "15th century to the present, Europe and the world", "mestres": ["Jan van Eyck (c. 1390–1441)", "Titian (c. 1488–1576)", "Rembrandt (1606–1669)", "John Singer Sargent (1856–1925)", "Lucian Freud (1922–2011)"], "caracteristicas": "Rich, deep colors, visible brushstrokes and impasto, smooth transitions, glazes and layered sheen.", "historia": "Oil paint (pigment bound with linseed oil) had already been used in Asia before the 15th century, but it was in the Low Countries that Jan van Eyck and his contemporaries raised it to a new level of luminosity and detail. In Venice, Titian began painting with it in loose brushstrokes on canvas, lighter than wood. Rembrandt and Velázquez explored its ability to create volume and atmosphere. The invention of the metal paint tube (1841) made it possible to paint outdoors and paved the way for Impressionism. Even today, oil is the traditional medium for portraiture and easel painting.", "tecnica": "Layers of oil dry slowly, which allows colors to be blended on the canvas and corrected. The 'fat over lean' rule prevents cracking: the first layers are thinner and the final ones contain more oil. Glazes (translucent layers) create depth and a luminous glow in skin and fabric; impasto (thick paint) gives relief to the highlights. Bristle brushes and the palette knife leave different textures. The final surface usually receives varnish, which saturates the colors and gives a deep sheen."}, "pt": {"g": "Pintura a óleo clássica em tela esticada de uma natureza-morta de interior silenciosa com uma cortina de veludo e um vaso de latão, velaturas quentes em camadas do escuro ao claro, pinceladas de cerdas visíveis e luzes em impasto, rico terra de sombra queimada e ocre, claro-escuro suave, profundidade envernizada", "m": "Retrato elegante de uma jovem latina de cabelos escuros e ondulados segurando um vaso com flores lilás, vermelhas e amarelas, pintura a óleo clássica em tela, luzes em impasto espesso, tons de pele luminosos em velatura, pinceladas de cerdas visíveis, paleta quente e rica, qualidade de museu envernizada"}},
 "Guache": {"en": {"nome": "Gouache / Acrylic", "periodo": "Gouache: 15th century (illuminated manuscripts) to the present. Acrylic: from the 1940s", "caracteristicas": "Opaque, flat and vibrant colors, matte finish, crisp edges and poster texture.", "historia": "Gouache (from the Italian 'guazzo') is an opaque watercolor, with pigment mixed with chalk or white, used since medieval illuminated manuscripts and in Mughal miniatures. In the 20th century, Matisse cut out papers painted with gouache to create his 'cut-outs' (c. 1943–54). Acrylic paint, developed in the 1940s–50s (such as Magna, from 1947, and Liquitex, from 1955), was adopted by pop artists, such as Hockney and Warhol, for its fast drying and intense colors. Mary Blair and Ralph McQuarrie used gouache and acrylic in concept art for film, from 'Cinderella' to 'Star Wars'.", "tecnica": "Gouache dries matte and opaque, allowing light layers to cover dark ones, and it can be reactivated with water. Artists work with flat areas of color, clean outlines and little modeling, resulting in a poster-like look. Acrylic paint dries quickly into a flexible, durable plastic film; it is used in thin or thick layers, with a matte or glossy finish. Combined, these paints give saturated, smooth colors without brush texture. They are ideal for illustration, storyboards and graphic painting."}, "pt": {"g": "Ilustração em guache estilo cartaz de uma vila na encosta na hora dourada, formas de cor opaca e chapada com bordas nítidas, coral, azul-petróleo e mostarda saturados, acabamento fosco aveludado, árvores e telhados simplificados e estilizados, charme de arte conceitual de meados do século", "m": "Retrato elegante de uma jovem negra de cabelos naturais cacheados segurando um vaso com flores lilás, vermelhas e amarelas, estilo de ilustração em guache e acrílico, formas de cor opaca, chapada e saturada, acabamento fosco, bordas nítidas, formas simplificadas e estilizadas, visual de cartaz de meados do século"}},
 "Lapis": {"en": {"nome": "Pencil / Graphite Drawing", "periodo": "16th century to the present, Europe and the world", "mestres": ["Leonardo da Vinci (1452–1519)", "Jean-Auguste-Dominique Ingres (1780–1867)", "Käthe Kollwitz (1867–1945)", "M. C. Escher (1898–1972)", "Paul Cadden (Scottish hyperrealist)"], "caracteristicas": "Monochrome strokes in shades of gray, hatching, soft gradients, visible construction lines and white paper.", "historia": "Graphite was found in Borrowdale, England, in the mid-16th century, and soon began to be used in wood-wrapped sticks, the ancestors of today's pencil. In 1795, Nicolas-Jacques Conté invented the process of mixing graphite with fired clay, making it possible to grade the hardness. Artists such as Ingres left pencil portraits of admirable subtlety, and Escher used graphite to plan his illusions. Today, hyperrealist draftsmen simulate photographs with pencils, and the pencil remains a tool for study, sketching and finished art.", "tecnica": "The scale runs from 9H (hard, light lines) to 9B (soft, dark). The artist builds volume with parallel hatching, cross-hatching and smudging done with a finger or a blending stump. The kneaded eraser 'draws' the lights by lifting graphite. The white paper is the strongest light in the image. Construction lines and corrections left visible reveal the process. The result is a subtle, silvery tone, with a metallic sheen in the darkest areas."}, "pt": {"g": "Desenho detalhado a lápis grafite em papel de algodão branco das mãos de um velho artesão segurando um relógio de bolso, hachuras paralelas e cruzadas finas, degradês suaves esfumados, brilho metálico prateado nas sombras, linhas de construção leves ainda visíveis, sem cor", "m": "Retrato elegante de uma jovem sul-asiática com uma longa trança escura segurando um vaso com flores lilás, vermelhas e amarelas, desenho a lápis grafite em papel branco, hachuras e hachuras cruzadas finas, degradês suaves esfumados, tons de cinza prateados, linhas de construção visíveis, monocromático"}},
 "Nanquim": {"en": {"nome": "Ink Illustration", "periodo": "Antiquity to the present; illustration tradition since the 19th century", "mestres": ["Aubrey Beardsley (1872–1898)", "Gustave Doré (1832–1883)", "Franklin Booth (1874–1948)", "Hugo Pratt (1927–1995)", "Moebius (Jean Giraud, 1938–2012)"], "caracteristicas": "Sharp black outlines, hatching, stippling, large masses of solid black and strong contrast between black and white.", "historia": "India ink (also known as Chinese ink) has been known since antiquity, but ink illustration gained strength in the 19th century with the press and photomechanical reproduction. Beardsley revolutionized the genre with his decorative drawings of flowing black lines for 'Salome' (1894) and 'The Yellow Book'. Doré created thousands of dramatic illustrations for the Bible and for Dante. In the 20th century, comics adopted ink with masters such as Hugo Pratt ('Corto Maltese') and Moebius. Since 2009, the Inktober challenge has popularized the practice among illustrators around the world.", "tecnica": "Dip pens (ink in an inkwell), brushes or technical pens are used. Shadows are made with hatching, cross-hatching and stippling, since black is flat and admits no halftones. The artist thinks in positive and negative, leaving the white of the paper as light and solid black as shadow. Lines vary in thickness to give rhythm and depth. Mistakes cannot be erased, so the drawing demands planning. Washes of diluted ink can be added to obtain soft grays."}, "pt": {"g": "Ilustração em nanquim preto de uma rua de catedral gótica à noite, contornos nítidos de pena, hachuras cruzadas densas e pontilhado para as sombras, grandes massas de preto sólido contra o papel branco nu, espessura de linha variada e fluida, sem tons de cinza, alto contraste dramático", "m": "Retrato elegante de uma jovem do leste asiático com um corte chanel preto e liso segurando um vaso com flores lilás, vermelhas e amarelas, ilustração a caneta de nanquim preto, hachuras cruzadas densas e pontilhado, sombras de preto sólido e marcantes, espessura de linha fluida, alto contraste em papel branco, traços decorativos Art Nouveau"}},
